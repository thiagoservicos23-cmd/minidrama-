<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mini Drama — peças de teatro online</title>
<meta name="description" content="Assista a peças de teatro completas, onde e quando quiser. Streaming de teatro feito por grupos independentes.">
<meta name="theme-color" content="#120D0F">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mini Drama">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700;800&display=swap"></noscript>
<script defer src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/tus-js-client@4.1.0/dist/tus.min.js"></script>
<style>
:root{
  --bg:#120D0F; --bg-elev:#1B1417; --bg-elev-2:#241B1E;
  --curtain:#7A1F2E; --curtain-2:#9C2C3E;
  --gold:#C9A24B; --gold-soft:#E4CE95;
  --ink:#F4ECE3; --ink-muted:#B9A9A0; --ink-faint:#8A7A72;
  --line:rgba(244,236,227,0.10);
  --danger:#C4453C; --ok:#5C8A5A;
  --radius:3px; --radius-lg:6px;
  --shadow-deep:0 24px 60px rgba(0,0,0,0.55);
  --font-display:'Fraunces', Georgia, serif;
  --font-body:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--bg); color:var(--ink); font-family:var(--font-body); min-height:100vh; -webkit-font-smoothing:antialiased;}
img{max-width:100%; display:block;}
a{color:inherit; text-decoration:none;}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit;}
::-webkit-scrollbar{height:8px; width:8px;}
::-webkit-scrollbar-thumb{background:var(--line); border-radius:4px;}
.container{max-width:1240px; margin:0 auto; padding:0 28px;}
@media (max-width:640px){.container{padding:0 16px;}}

.site-header{position:sticky; top:0; z-index:60; display:flex; align-items:center; justify-content:space-between; padding:16px 28px; gap:24px; background:linear-gradient(180deg, rgba(9,6,7,0.92), rgba(9,6,7,0.55) 80%, transparent); backdrop-filter:blur(6px);}
.site-header.solid{background:var(--bg); box-shadow:0 1px 0 var(--line);}
@media (max-width:640px){.site-header{padding:14px 16px;}}
.brand{display:flex; align-items:baseline; gap:6px; font-family:var(--font-display); font-weight:700; font-size:23px; letter-spacing:.2px; flex-shrink:0;}
.brand .dot{width:7px; height:7px; border-radius:50%; background:var(--curtain-2); margin-left:1px;}
.main-nav{display:flex; align-items:center; gap:26px; flex:1; margin-left:12px;}
.main-nav a{font-size:14.5px; color:var(--ink-muted); white-space:nowrap; position:relative; padding:6px 0;}
.main-nav a:hover, .main-nav a.active{color:var(--ink);}
.main-nav a.active::after{content:""; position:absolute; left:0; right:0; bottom:-2px; height:2px; background:var(--gold);}
@media (max-width:900px){.main-nav{display:none;}}
.header-actions{display:flex; align-items:center; gap:10px; flex-shrink:0;}
.icon-btn{background:none; border:1px solid var(--line); color:var(--ink); border-radius:50%; width:36px; height:36px; display:flex; align-items:center; justify-content:center;}
.icon-btn:hover{border-color:var(--gold);}
.btn{border:none; border-radius:var(--radius); padding:10px 20px; font-size:14px; font-weight:600; letter-spacing:.2px; transition:transform .12s ease, opacity .15s;}
.btn:active{transform:scale(0.97);}
.btn:disabled{opacity:.5; cursor:default;}
.btn-gold{background:var(--gold); color:#241708;}
.btn-gold:hover{background:var(--gold-soft);}
.btn-ghost{background:transparent; color:var(--ink); border:1px solid var(--line);}
.btn-ghost:hover{border-color:var(--ink-muted);}
.btn-danger{background:transparent; color:var(--danger); border:1px solid rgba(196,69,60,.4);}
.btn-danger:hover{background:rgba(196,69,60,.1);}
.btn-block{width:100%;}
.btn-sm{padding:7px 14px; font-size:13px;}
.avatar-btn{width:36px; height:36px; border-radius:50%; background:var(--curtain); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; border:1px solid var(--line);}
.hamburger{display:none; background:none; border:none; color:var(--ink);}
@media (max-width:900px){.hamburger{display:block;}}
.mobile-drawer{position:fixed; inset:0; background:rgba(9,6,7,.94); z-index:90; display:none; flex-direction:column; padding:24px; gap:6px;}
.mobile-drawer.open{display:flex;}
.mobile-drawer a, .mobile-drawer button{padding:14px 6px; font-size:18px; color:var(--ink); border:none; background:none; text-align:left; border-bottom:1px solid var(--line); font-family:var(--font-display);}
.mobile-drawer .close-drawer{align-self:flex-end; font-size:28px; background:none; border:none; color:var(--ink); margin-bottom:12px;}

.hero{position:relative; height:74vh; min-height:460px; max-height:720px; overflow:hidden;}
.hero-slide{position:absolute; inset:0; opacity:0; transition:opacity .9s ease; background-size:cover; background-position:center 20%;}
.hero-slide.active{opacity:1;}
.hero-slide::after{content:""; position:absolute; inset:0; background:linear-gradient(0deg, var(--bg) 4%, rgba(18,13,15,0.15) 45%, rgba(18,13,15,0.55) 100%), linear-gradient(90deg, rgba(18,13,15,0.85) 0%, rgba(18,13,15,0.15) 55%);}
.hero-content{position:absolute; left:0; bottom:9%; padding:0 28px; max-width:640px; z-index:2;}
@media (max-width:640px){.hero-content{padding:0 16px; bottom:7%;}}
.hero-eyebrow{display:flex; align-items:center; gap:8px; color:var(--gold-soft); font-size:13px; font-weight:600; margin-bottom:14px;}
.hero-eyebrow .dot{width:6px; height:6px; border-radius:50%; background:var(--curtain-2);}
.hero-title{font-family:var(--font-display); font-size:clamp(32px,5.2vw,58px); line-height:1.02; font-weight:700; margin:0 0 16px;}
.hero-desc{color:var(--ink-muted); font-size:15.5px; line-height:1.6; margin:0 0 22px; max-width:520px;}
.hero-meta{display:flex; gap:14px; align-items:center; color:var(--ink-muted); font-size:13.5px; margin-bottom:22px; flex-wrap:wrap;}
.hero-meta span{display:flex; align-items:center; gap:6px;}
.hero-actions{display:flex; gap:12px; flex-wrap:wrap;}
.hero-dots{position:absolute; right:28px; bottom:9%; z-index:3; display:flex; flex-direction:column; gap:8px;}
@media (max-width:640px){.hero-dots{display:none;}}
.hero-dots button{width:26px; height:3px; border:none; background:var(--line); padding:0;}
.hero-dots button.active{background:var(--gold);}

.section-row{margin:44px 0;}
.section-row-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:16px;}
.section-title{font-family:var(--font-display); font-size:22px; font-weight:600; margin:0;}
.section-link{font-size:13px; color:var(--ink-muted);}
.section-link:hover{color:var(--gold);}
.rail{display:flex; gap:16px; overflow-x:auto; padding-bottom:10px; scroll-snap-type:x proximity;}
.rail::-webkit-scrollbar{display:none;}
.card{flex:0 0 210px; scroll-snap-align:start; cursor:pointer; position:relative; border-radius:var(--radius-lg); overflow:hidden; background:var(--bg-elev); border:1px solid var(--line); transition:border-color .18s, transform .18s;}
@media (max-width:640px){.card{flex-basis:150px;}}
.card:hover{border-color:var(--gold); transform:translateY(-3px);}
.card-poster{width:100%; aspect-ratio:2/3; object-fit:cover; background:var(--bg-elev-2);}
.card-body{padding:10px 12px 12px;}
.card-title{font-size:13.5px; font-weight:600; margin:0 0 4px; line-height:1.3; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.card-sub{font-size:11.5px; color:var(--ink-faint); display:flex; justify-content:space-between; gap:6px;}
.card-badge{position:absolute; top:8px; left:8px; background:var(--curtain); color:#fff; font-size:10px; font-weight:700; padding:3px 8px; border-radius:2px; letter-spacing:.3px;}
.card-lock{position:absolute; top:8px; right:8px; width:24px; height:24px; border-radius:50%; background:rgba(9,6,7,.7); display:flex; align-items:center; justify-content:center;}
.genre-filters{display:flex; gap:8px; overflow-x:auto; margin-bottom:22px; padding-bottom:2px;}
.genre-filters::-webkit-scrollbar{display:none;}
.chip{flex:0 0 auto; padding:8px 16px; border-radius:20px; border:1px solid var(--line); font-size:13px; color:var(--ink-muted); white-space:nowrap; background:none;}
.chip.active{background:var(--ink); color:var(--bg); border-color:var(--ink);}

.site-footer{border-top:1px solid var(--line); margin-top:80px; padding:44px 28px 90px; color:var(--ink-faint); font-size:13px;}
.footer-grid{display:grid; grid-template-columns:1.4fr 1fr 1fr 1fr; gap:28px; max-width:1240px; margin:0 auto 28px;}
@media (max-width:760px){.footer-grid{grid-template-columns:1fr 1fr;}}
.footer-grid h4{font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-muted); margin:0 0 12px; font-weight:600;}
.footer-grid a{display:block; margin-bottom:8px; color:var(--ink-faint);}
.footer-grid a:hover{color:var(--ink);}
.footer-bottom{max-width:1240px; margin:0 auto; border-top:1px solid var(--line); padding-top:20px;}

.auth-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:40px 20px; position:relative;}
.auth-wrap::before{content:""; position:absolute; inset:0; background:radial-gradient(ellipse at top, rgba(122,31,46,.28), transparent 60%); pointer-events:none;}
.auth-card{position:relative; z-index:1; width:100%; max-width:400px; background:var(--bg-elev); border:1px solid var(--line); border-radius:var(--radius-lg); padding:38px 32px;}
.auth-brand{text-align:center; font-family:var(--font-display); font-size:26px; font-weight:700; margin-bottom:6px;}
.auth-sub{text-align:center; color:var(--ink-muted); font-size:13.5px; margin-bottom:28px;}
.field{margin-bottom:16px;}
.field label{display:block; font-size:12.5px; font-weight:600; color:var(--ink-muted); margin-bottom:6px;}
.field input, .field select, .field textarea{width:100%; background:var(--bg-elev-2); border:1px solid var(--line); color:var(--ink); padding:11px 13px; border-radius:var(--radius); font-size:14px; outline:none;}
.field input:focus, .field select:focus, .field textarea:focus{border-color:var(--gold);}
.field-hint{color:var(--ink-faint); font-size:11.5px; margin-top:5px;}
.auth-foot{text-align:center; margin-top:20px; font-size:13.5px; color:var(--ink-muted);}
.auth-foot a{color:var(--gold-soft); font-weight:600;}
.form-msg{padding:10px 12px; border-radius:var(--radius); font-size:13px; margin-bottom:16px; display:none;}
.form-msg:empty{display:none !important;}
.form-msg.error{display:block; background:rgba(196,69,60,.12); color:#E8938C; border:1px solid rgba(196,69,60,.3);}
.form-msg.ok{display:block; background:rgba(92,138,90,.14); color:#9CC79A; border:1px solid rgba(92,138,90,.3);}
.demo-note{background:var(--bg-elev-2); border:1px dashed var(--line); border-radius:var(--radius); padding:10px 12px; font-size:11.5px; color:var(--ink-faint); margin-top:18px; line-height:1.5;}

.plans-hero{text-align:center; padding:64px 20px 20px;}
.plans-hero h1{font-family:var(--font-display); font-size:clamp(30px,4.4vw,46px); margin:0 0 12px;}
.plans-hero p{color:var(--ink-muted); max-width:520px; margin:0 auto; font-size:15px;}
.plans-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:20px; max-width:1080px; margin:44px auto; padding:0 20px;}
@media (max-width:860px){.plans-grid{grid-template-columns:1fr; max-width:420px;}}
.plan-card{background:var(--bg-elev); border:1px solid var(--line); border-radius:var(--radius-lg); padding:30px 26px; display:flex; flex-direction:column; position:relative;}
.plan-card.featured{border-color:var(--gold); background:linear-gradient(180deg, rgba(201,162,75,.08), var(--bg-elev) 40%);}
.plan-tag{position:absolute; top:-12px; left:26px; background:var(--gold); color:#241708; font-size:11px; font-weight:700; padding:4px 10px; border-radius:2px;}
.plan-name{font-family:var(--font-display); font-size:21px; font-weight:600; margin:0 0 6px;}
.plan-price{font-size:34px; font-weight:700; margin:0 0 4px;}
.plan-price span{font-size:14px; font-weight:500; color:var(--ink-muted);}
.plan-period{color:var(--ink-faint); font-size:12.5px; margin-bottom:22px;}
.plan-benefits{list-style:none; padding:0; margin:0 0 26px; flex:1;}
.plan-benefits li{display:flex; gap:10px; align-items:flex-start; font-size:13.5px; color:var(--ink-muted); margin-bottom:11px; line-height:1.4;}
.plan-benefits li svg{flex-shrink:0; margin-top:2px; color:var(--gold);}
.plans-faq{max-width:720px; margin:60px auto 0; padding:0 20px;}
.faq-item{border-bottom:1px solid var(--line); padding:18px 0;}
.faq-item summary{cursor:pointer; font-weight:600; font-size:14.5px; list-style:none;}
.faq-item summary::-webkit-details-marker{display:none;}
.faq-item p{color:var(--ink-muted); font-size:13.5px; margin:10px 0 0; line-height:1.6;}

.detail-hero{position:relative; height:56vh; min-height:380px; background-size:cover; background-position:center;}
.detail-hero::after{content:""; position:absolute; inset:0; background:linear-gradient(0deg, var(--bg), rgba(18,13,15,.2) 60%);}
.detail-back{position:absolute; top:20px; left:20px; z-index:2;}
.detail-wrap{max-width:900px; margin:-90px auto 60px; position:relative; z-index:2; padding:0 24px;}
@media (max-width:640px){.detail-wrap{margin-top:-60px; padding:0 16px;}}
.detail-title{font-family:var(--font-display); font-size:clamp(26px,4vw,40px); font-weight:700; margin:0 0 10px;}
.detail-meta{display:flex; gap:14px; flex-wrap:wrap; color:var(--ink-muted); font-size:13.5px; margin-bottom:20px;}
.detail-actions{display:flex; gap:12px; margin-bottom:28px; flex-wrap:wrap;}
.detail-desc{color:var(--ink-muted); line-height:1.75; font-size:14.5px; max-width:680px; margin-bottom:26px;}
.detail-cast{font-size:13.5px; color:var(--ink-faint); line-height:1.9;}
.detail-cast b{color:var(--ink-muted); font-weight:600;}
.player-shell{background:#000; border-radius:var(--radius-lg); overflow:hidden; aspect-ratio:16/9; display:flex; align-items:center; justify-content:center; position:relative;}
.player-shell video, .player-shell iframe{width:100%; height:100%; border:none;}
.player-locked{text-align:center; padding:40px; color:var(--ink-muted);}
.player-locked svg{color:var(--gold); margin-bottom:14px;}
.player-locked h3{font-family:var(--font-display); color:var(--ink); margin:0 0 8px;}

.page-wrap{max-width:840px; margin:0 auto; padding:50px 24px 90px;}
.page-title{font-family:var(--font-display); font-size:32px; margin:0 0 8px;}
.page-sub{color:var(--ink-muted); font-size:14px; margin-bottom:36px;}
.acc-grid{display:grid; grid-template-columns:220px 1fr; gap:32px;}
@media (max-width:700px){.acc-grid{grid-template-columns:1fr;}}
.acc-nav a, .acc-nav button{display:block; width:100%; text-align:left; padding:11px 14px; border-radius:var(--radius); font-size:14px; color:var(--ink-muted); border:none; background:none; margin-bottom:4px;}
.acc-nav a.active, .acc-nav button.active{background:var(--bg-elev); color:var(--ink); font-weight:600;}
.acc-card{background:var(--bg-elev); border:1px solid var(--line); border-radius:var(--radius-lg); padding:26px;}
.acc-card h3{font-family:var(--font-display); font-size:18px; margin:0 0 18px;}
.plan-status-badge{display:inline-flex; align-items:center; gap:8px; background:var(--bg-elev-2); border:1px solid var(--line); padding:8px 14px; border-radius:20px; font-size:13px; margin-bottom:16px;}
.plan-status-badge .dot{width:8px; height:8px; border-radius:50%; background:var(--ok);}
.plan-status-badge.expired .dot{background:var(--danger);}

.admin-shell{display:grid; grid-template-columns:230px 1fr; min-height:100vh;}
@media (max-width:860px){.admin-shell{grid-template-columns:1fr;}}
.admin-side{background:var(--bg-elev); border-right:1px solid var(--line); padding:22px 14px; position:sticky; top:0; height:100vh; overflow-y:auto;}
@media (max-width:860px){.admin-side{position:relative; height:auto; display:flex; overflow-x:auto; gap:4px; padding:14px;}}
.admin-brand{font-family:var(--font-display); font-weight:700; font-size:19px; padding:6px 12px 22px;}
@media (max-width:860px){.admin-brand{display:none;}}
.admin-nav-item{display:flex; align-items:center; gap:12px; padding:11px 12px; border-radius:var(--radius); color:var(--ink-muted); font-size:13.5px; margin-bottom:2px; white-space:nowrap; border:none; background:none; width:100%; text-align:left;}
.admin-nav-item svg{flex-shrink:0;}
.admin-nav-item:hover{color:var(--ink);}
.admin-nav-item.active{background:var(--curtain); color:#fff;}
.admin-main{padding:30px 34px 80px;}
@media (max-width:640px){.admin-main{padding:20px 16px 70px;}}
.admin-topbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:28px; flex-wrap:wrap; gap:14px;}
.admin-h1{font-family:var(--font-display); font-size:26px; margin:0;}
.stat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:34px;}
@media (max-width:900px){.stat-grid{grid-template-columns:repeat(2,1fr);}}
.stat-card{background:var(--bg-elev); border:1px solid var(--line); border-radius:var(--radius-lg); padding:20px;}
.stat-card .stat-label{font-size:12px; color:var(--ink-faint); margin-bottom:8px; text-transform:uppercase; letter-spacing:.05em;}
.stat-card .stat-value{font-family:var(--font-display); font-size:28px; font-weight:600;}
.admin-panel{background:var(--bg-elev); border:1px solid var(--line); border-radius:var(--radius-lg); padding:24px; margin-bottom:24px;}
.admin-panel-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; flex-wrap:wrap; gap:10px;}
.admin-panel-head h3{font-family:var(--font-display); font-size:18px; margin:0;}
table{width:100%; border-collapse:collapse; font-size:13.5px;}
th{text-align:left; color:var(--ink-faint); font-weight:600; font-size:11.5px; text-transform:uppercase; letter-spacing:.05em; padding:10px 12px; border-bottom:1px solid var(--line);}
td{padding:13px 12px; border-bottom:1px solid var(--line); color:var(--ink-muted); vertical-align:middle;}
tr:last-child td{border-bottom:none;}
td.strong{color:var(--ink); font-weight:600;}
.table-scroll{overflow-x:auto;}
.badge{display:inline-block; padding:3px 10px; border-radius:10px; font-size:11px; font-weight:600;}
.badge-ok{background:rgba(92,138,90,.16); color:#9CC79A;}
.badge-warn{background:rgba(201,162,75,.16); color:var(--gold-soft);}
.badge-off{background:rgba(196,69,60,.16); color:#E8938C;}
.badge-neutral{background:var(--bg-elev-2); color:var(--ink-muted);}
.row-actions{display:flex; gap:8px;}
.row-actions button{background:none; border:1px solid var(--line); color:var(--ink-muted); border-radius:var(--radius); padding:5px 10px; font-size:12px;}
.row-actions button:hover{border-color:var(--gold); color:var(--ink);}
.empty-state{text-align:center; padding:50px 20px; color:var(--ink-faint);}
.empty-state svg{margin-bottom:14px; color:var(--ink-faint);}
.search-input{background:var(--bg-elev-2); border:1px solid var(--line); border-radius:var(--radius); padding:9px 13px; color:var(--ink); font-size:13.5px; min-width:220px;}

.modal-overlay{position:fixed; inset:0; background:rgba(9,6,7,.75); z-index:200; display:none; align-items:flex-start; justify-content:center; padding:40px 16px; overflow-y:auto;}
.modal-overlay.open{display:flex;}
.modal-box{background:var(--bg-elev); border:1px solid var(--line); border-radius:var(--radius-lg); width:100%; max-width:560px; padding:28px; margin-top:20px;}
.modal-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;}
.modal-head h3{font-family:var(--font-display); font-size:19px; margin:0;}
.modal-close{background:none; border:none; color:var(--ink-muted); font-size:22px;}
.modal-close:hover{color:var(--ink);}
.form-grid-2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
@media (max-width:480px){.form-grid-2{grid-template-columns:1fr;}}
.modal-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:20px;}

<script>
/* ======================================================================
   MINI DRAMA — front-end. Fala com a API real (Node/Express + Prisma)
   pelo mesmo domínio (/api/...). Sem localStorage como banco: os dados
   ficam de fato no servidor / banco de dados.
   ====================================================================== */
const SITE_NAME = "Mini Drama";
const TOKEN_KEY = "minidrama_token";

const ICO = {
  play: `<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>`,
  info: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v5h1"/></svg>`,

  menu: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg>`,
  chevronLeft: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M15 18l-6-6 6-6"/></svg>`,
  grid: `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>`,
  film: `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="1"/><path d="M7 4v16M17 4v16M3 9h4M3 15h4M17 9h4M17 15h4"/></svg>`,
  users: `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20c0-3.5 3-6 6.5-6s6.5 2.5 6.5 6M16 8.2a3 3 0 110 5.9M21.5 20c0-2.7-1.9-5-4.5-5.7"/></svg>`,
  ticket: `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8a2 2 0 012-2h14a2 2 0 012 2v2a2 2 0 000 4v2a2 2 0 01-2 2H5a2 2 0 01-2-2v-2a2 2 0 000-4V8z"/><path d="M10 6v12" stroke-dasharray="2 3"/></svg>`,
  logout: `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>`,
  home: `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>`,
  edit: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>`,
  trash: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>`,
  clock: `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>`
};

/* --------------------------- ESTADO LOCAL (cache do que veio da API) ------- */
const DB = { plays: [], plans: [], users: [], me: null };

/* --------------------------- CLIENTE DE API --------------------------------- */
function getToken(){ return localStorage.getItem(TOKEN_KEY); }
function setToken(t){ localStorage.setItem(TOKEN_KEY, t); }
function clearToken(){ localStorage.removeItem(TOKEN_KEY); }

function showWakeHint(on){ const el = document.getElementById("wake-hint"); if(el) el.classList.toggle("show", on); }

// Chamadas à API. GETs tentam de novo sozinhos (o servidor gratuito "dorme" e leva alguns
// segundos para acordar); POST/PUT/DELETE nunca são repetidos, para não duplicar nada.
async function api(path, { method="GET", body } = {}){
  const headers = { "Content-Type": "application/json" };
  const token = getToken();
  if(token) headers["Authorization"] = "Bearer " + token;
  const isGet = method === "GET";
  const attempts = isGet ? 4 : 1;
  for(let i=0; i<attempts; i++){
    const ctrl = new AbortController();
    const timer = setTimeout(()=>ctrl.abort(), isGet ? 35000 : 60000);
    try{
      const res = await fetch("/api" + path, { method, headers, body: body ? JSON.stringify(body) : undefined, signal: ctrl.signal });
      clearTimeout(timer);
      if(isGet && [502,503,504].includes(res.status) && i < attempts-1){ showWakeHint(true); await sleep(1500*(i+1)); continue; }
      let data = null;
      try{ data = await res.json(); }catch(e){ data = null; }
      if(!res.ok){
        const err = new Error((data && data.error) || "Ocorreu um erro. Tente novamente.");
        err.httpError = true; err.status = res.status; throw err;
      }
      return data;
    }catch(e){
      clearTimeout(timer);
      if(e.httpError) throw e;
      if(i < attempts-1){ showWakeHint(true); await sleep(1500*(i+1)); continue; }
    }
  }
  throw new Error("Sem conexão com o servidor. Verifique sua internet e tente de novo.");
}

/* --------------------------- HELPERS ----------------------------------- */
function esc(str){ return String(str==null?"":str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtMoney(v){ return v===0 ? "Grátis" : "R$ " + v.toFixed(2).replace(".", ","); }
function fmtDuration(min){ const h=Math.floor(min/60), m=min%60; return h + "h" + (m? (m<10?"0"+m:m)+"min" : ""); }
function fmtDate(iso){ return new Date(iso).toLocaleDateString("pt-BR"); }
function planById(id){ return DB.plans.find(p=>p.id===id); }
function planLevel(planId){ const idx = DB.plans.findIndex(p=>p.id===planId); return idx<0?0:idx; }
function isPlanActive(user){ if(!user) return false; const pl = planById(user.plan); if(user.plan === "plateia" || (pl && pl.price === 0)) return true; return new Date(user.planExpiry) > new Date(); }
function daysLeft(user){ return Math.max(0, Math.ceil((new Date(user.planExpiry) - Date.now()) / 86400000)); }
function currentUser(){ return DB.me; }
function toast(msg){
  const host = document.getElementById("toast-host");
  const t = document.createElement("div"); t.className="toast"; t.textContent = msg;
  host.appendChild(t); setTimeout(()=>{ t.remove(); }, 3400);
}
function qs(sel, root=document){ return root.querySelector(sel); }
function qsa(sel, root=document){ return Array.from(root.querySelectorAll(sel)); }
function go(hash){ location.hash = hash; }

/* --------------------------- BOOTSTRAP + ROTEADOR --------------------------- */
window.addEventListener("hashchange", render);
window.addEventListener("DOMContentLoaded", boot);

/* ---- cache local: a 2ª visita em diante abre NA HORA, mesmo com o servidor dormindo ---- */
const CACHE_KEY = "minidrama_cache_v2";
function loadCache(){
  try{ const c = JSON.parse(localStorage.getItem(CACHE_KEY)); if(c && Date.now() - c.t < 14*86400000) return c; }catch(e){}
  return null;
}
function saveCache(){
  try{ localStorage.setItem(CACHE_KEY, JSON.stringify({ t: Date.now(), plays: DB.plays, plans: DB.plans, me: DB.me, hasToken: !!getToken() })); }catch(e){}
}

// Busca catálogo, planos e (se logado) os dados do usuário. Só desloga em 401/403 — falha de rede não desloga ninguém.
async function loadFresh(){
  const [playsRes, plansRes] = await Promise.all([ api("/plays"), api("/plans") ]);
  DB.plays = playsRes.plays; DB.plans = plansRes.plans;
  if(getToken()){
    try{ DB.me = (await api("/auth/me")).user; }
    catch(e){ if(e.httpError && (e.status === 401 || e.status === 403)){ clearToken(); DB.me = null; } }
  } else { DB.me = null; }
  saveCache();
}

async function refreshInBackground(){
  try{
    const before = JSON.stringify([DB.plays, DB.plans, DB.me]);
    await loadFresh();
    const changed = before !== JSON.stringify([DB.plays, DB.plans, DB.me]);
    if(changed && ["#/home", "#/planos"].includes(location.hash || "#/home")) render();
  }catch(e){ /* silencioso: o usuário já está vendo a versão guardada */ }
}

async function boot(){
  registerServiceWorker();
  const cached = loadCache();
  if(cached && cached.hasToken === !!getToken() && (cached.plans || []).length){
    DB.plays = cached.plays || []; DB.plans = cached.plans; DB.me = cached.me || null;
    render();
    refreshInBackground();
    scheduleInstallBanner();
    return;
  }
  const wake = setTimeout(()=>showWakeHint(true), 4000);
  try{
    await loadFresh();
  }catch(e){
    clearTimeout(wake);
    document.getElementById("app").innerHTML = `<div class="boot-screen"><div class="brand">Mini Drama</div><p style="text-align:center; padding:0 20px;">${esc(e.message || "Não foi possível conectar ao servidor.")}</p><button class="btn btn-gold" onclick="location.reload()">Tentar de novo</button></div>`;
    return;
  }
  clearTimeout(wake);
  render();
  scheduleInstallBanner();
}

const ADMIN_ROUTES = ["#/admin","#/admin/pecas","#/admin/usuarios","#/admin/planos"];

async function render(){
  let hash = location.hash || "#/home";
  const user = currentUser();

  if(ADMIN_ROUTES.some(r=>hash.startsWith(r)) && !(user && user.role==="admin")){
    toast("Acesso restrito à administração.");
    hash = "#/login"; location.hash = hash; return;
  }

  const app = document.getElementById("app");
  window.scrollTo(0,0);

  if(hash.startsWith("#/admin")) { app.innerHTML = AdminLayout(hash); await afterAdminRender(hash); return; }
  if(hash.startsWith("#/peca/")) {
    const id = hash.split("/")[2];
    app.innerHTML = PublicShell(`<div class="page-wrap"><p>Carregando peça...</p></div>`); afterPublicRender();
    const html = await PlayDetail(id);
    qs("#app main").outerHTML = `<main>${html}</main>`; afterPublicRender();
    initPlayerIfNeeded();
    return;
  }
  if(hash === "#/login") { app.innerHTML = LoginPage(); attachAuthEvents(); return; }
  if(hash === "#/cadastro") { app.innerHTML = SignupPage(); attachAuthEvents(); return; }
  if(hash === "#/planos") { app.innerHTML = PublicShell(PlansPage()); afterPublicRender(); return; }
  if(hash === "#/conta") {
    if(!user){ go("#/login"); return; }
    app.innerHTML = PublicShell(AccountPage(user)); afterPublicRender(); attachAccountEvents(); return;
  }
  if(hash === "#/catalogo") {
    app.innerHTML = PublicShell(`<div class="page-wrap"><p>Carregando catálogo...</p></div>`); afterPublicRender();
    const html = await CatalogPage();
    qs("#app main").outerHTML = `<main>${html}</main>`; afterPublicRender(); attachCatalogEvents();
    return;
  }
  app.innerHTML = PublicShell(HomePage());
  afterPublicRender();
  attachHomeEvents();
}

async function refreshPlays(){ const r = await api("/plays"); DB.plays = r.plays; DB.playsTotal = r.total; }
async function refreshPlans(){ const r = await api("/plans"); DB.plans = r.plans; }
async function refreshUsers(){ const r = await api("/users"); DB.users = r.users; }

/* --------------------------- SHELL / HEADER ---------------------------- */

  const user = currentUser();

  <header class="site-header" id="site-header">
    <a href="#/home" class="brand">${SITE_NAME}<span class="dot"></span></a>
    <nav class="main-nav">
      <a href="#/home" class="${hash==='#/home'?'active':''}">Início</a>
      <a href="#/catalogo" class="${hash==='#/catalogo'?'active':''}">Catálogo</a>
      <a href="#/planos" class="${hash==='#/planos'?'active':''}">Planos</a>
      ${user && user.role==='admin' ? `<a href="#/admin">Painel admin</a>` : ``}
    </nav>
    <div class="header-actions">
      ${user ? `
        <button class="icon-btn" title="Conta" onclick="go('#/conta')">${ICO.bell}</button>
        <a href="#/conta" class="avatar-btn" title="${esc(user.name)}">${esc(initials)}</a>
      ` : (getToken() ? `<span class="sk avatar-sk"></span>` : `
        <a href="#/login" class="btn btn-ghost btn-sm">Entrar</a>
        <a href="#/cadastro" class="btn btn-gold btn-sm">Criar conta</a>
      `)}
      <button class="hamburger" onclick="toggleDrawer(true)">${ICO.menu}</button>
    </div>
  </header>
  <div class="mobile-drawer" id="mobile-drawer">
    <button class="close-drawer" onclick="toggleDrawer(false)">&times;</button>
    <a href="#/home" onclick="toggleDrawer(false)">Início</a>
    <a href="#/catalogo" onclick="toggleDrawer(false)">Catálogo</a>
    <a href="#/planos" onclick="toggleDrawer(false)">Planos</a>
    ${user ? `<a href="#/conta" onclick="toggleDrawer(false)">Minha conta</a>` : ``}
    ${user && user.role==='admin' ? `<a href="#/admin" onclick="toggleDrawer(false)">Painel admin</a>` : ``}
    ${user ? `<button onclick="doLogout()">Sair</button>` : `
      <a href="#/login" onclick="toggleDrawer(false)">Entrar</a>
      <a href="#/cadastro" onclick="toggleDrawer(false)">Criar conta</a>`}
  </div>
  <main>${innerHtml}</main>
  <footer class="site-footer">
    <div class="footer-grid">
      <div>
        <div class="brand" style="margin-bottom:10px;">${SITE_NAME}<span class="dot"></span></div>
        <p style="max-width:260px; line-height:1.6;">Streaming de peças de teatro produzidas por grupos independentes. Um projeto da turma de Teatro em parceria com a turma de Tecnologia.</p>
      </div>
      <div><h4>Navegação</h4><a href="#/catalogo">Catálogo</a><a href="#/planos">Planos</a><a href="#/cadastro">Criar conta</a><a href="#/home" onclick="promptInstall(); return false;">Instalar o app</a></div>
      <div><h4>Suporte</h4><a href="#/">Central de ajuda</a><a href="#/">Fale conosco</a></div>
      <div><h4>Legal</h4><a href="#/">Termos de uso</a><a href="#/">Privacidade</a></div>
    </div>
    <div class="footer-bottom">© ${new Date().getFullYear()} ${SITE_NAME}</div>
  </footer>`;
}
function toggleDrawer(open){ qs("#mobile-drawer").classList.toggle("open", open); }
function doLogout(){
  clearToken(); DB.me = null; saveCache();
  toast("Você saiu da sua conta."); go("#/home");
  loadFresh().then(()=>{ if((location.hash||"#/home")==="#/home") render(); }).catch(()=>{});
}
function afterPublicRender(){
  const h = qs("#site-header");
  if(h){ window.onscroll = ()=>{ h.classList.toggle("solid", window.scrollY>10); }; }
}

/* --------------------------- HOME PAGE ---------------------------------- */
let heroIndex = 0, heroTimer = null;
function HomePage(){
  const featured = DB.plays.filter(p=>p.featured);
  const genres = [...new Set(DB.plays.map(p=>p.genre))];
  return `
  <section class="hero" id="hero">
    ${featured.map((p,i)=>`
      <div class="hero-slide ${i===0?'active':''}" data-i="${i}" data-bg="${esc(p.backdropUrl)}" ${i===0?`style="background-image:url('${esc(p.backdropUrl)}')"`:''}>
        <div class="hero-content reveal">
          <div class="hero-eyebrow"><span class="dot"></span> Em cartaz na plataforma</div>
          <h1 class="hero-title">${esc(p.title)}</h1>
          <div class="hero-meta"><span>${ICO.clock} ${fmtDuration(p.durationMinutes)}</span><span>${p.genre}</span><span>${p.releaseYear}</span></div>
          <p class="hero-desc">${esc(p.synopsis)}</p>
          <div class="hero-actions">
            <a href="#/peca/${p.id}" class="btn btn-gold">${ICO.play} Assistir agora</a>
            <a href="#/peca/${p.id}" class="btn btn-ghost">${ICO.info} Mais detalhes</a>
          </div>
        </div>
      </div>`).join("")}
    <div class="hero-dots">${featured.map((_,i)=>`<button class="${i===0?'active':''}" onclick="setHero(${i})"></button>`).join("")}</div>
  </section>
  <div class="container">${genres.map(g => PlayRow(g, DB.plays.filter(p=>p.genre===g))).join("")}</div>`;
}
function PlayRow(title, plays){
  return `<div class="section-row">
    <div class="section-row-head"><h2 class="section-title">${esc(title)}</h2><a href="#/catalogo" class="section-link">Ver tudo</a></div>
    <div class="rail">${plays.map(p=>PlayCard(p)).join("")}</div></div>`;
}
function PlayCard(p){

function isYoutube(url){ return /youtube\.com|youtu\.be/.test(url||""); }
function embedYoutube(url){ const m = url.match(/(?:v=|youtu\.be\/)([\w-]{6,})/); return m ? `https://www.youtube.com/embed/${m[1]}` : url; }
function isHls(url){ return /\.m3u8(\?|$)/i.test(url||""); }

// Lê a duração de um arquivo de vídeo local (em minutos), sem precisar subir nada.
function detectVideoDuration(file){
  return new Promise((resolve)=>{
    const url = URL.createObjectURL(file);
    const videoEl = document.createElement("video");
    videoEl.preload = "metadata";
    videoEl.onloadedmetadata = () => { URL.revokeObjectURL(url); resolve(Math.round(videoEl.duration / 60)); };
    videoEl.onerror = () => { URL.revokeObjectURL(url); resolve(null); };
    videoEl.src = url;
  });
}
// Transforma "minha_peca-ATO_final.mp4" em "Minha Peca Ato Final".
function titleFromFilename(filename){
  const base = filename.replace(/\.[^/.]+$/, "");
  return base.replace(/[_\-]+/g, " ").replace(/\s+/g, " ").trim().replace(/\b\w/g, c => c.toUpperCase());
}
// Converte um arquivo de imagem escolhido pelo usuário em base64, pra usar direto como URL.
function fileToDataUrl(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// "Intuição" de gênero por palavras-chave no título (heurística simples, não é IA
// entendendo a peça de verdade — serve pra dar um ponto de partida, sempre editável).
const GENRE_OPTIONS = ["Drama","Comédia","Romance","Ação","Clássico","Musical","Suspense","Infantil","Outro"];
const GENRE_KEYWORDS = [
  { genre: "Comédia", words: ["comedia","farsa","riso","hilari","engracad"] },
  { genre: "Romance", words: ["romance","amor","paixao","coracao","namoro","casamento"] },
  { genre: "Suspense", words: ["suspense","misterio","crime","assassinato","investiga","enigma"] },
  { genre: "Ação", words: ["acao","luta","guerra","batalha","persegui"] },
  { genre: "Infantil", words: ["infantil","crianca","criancas","bicho","fada","dragao","conto"] },
  { genre: "Clássico", words: ["classico","tragedia","grecia","shakespeare","mitologia","antigona"] },
  { genre: "Musical", words: ["musical","cancao","viola","sanfona","opera","canta"] }
];
function normalizeText(s){ return (s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, ""); }
function guessGenre(text){
  const t = normalizeText(text);
  for(const rule of GENRE_KEYWORDS){ if(rule.words.some(w => t.includes(w))) return rule.genre; }
  return "Drama";
}

let currentPlayData = null;
let currentHls = null;

// Liga o player HLS (Bunny.net Stream e afins) depois que o <video> ja esta no DOM.
function initPlayerIfNeeded(){
  if(currentHls){ currentHls.destroy(); currentHls = null; }
  if(!currentPlayData) return;
  const { play, canWatch } = currentPlayData;
  if(!canWatch || !play.videoUrl || !isHls(play.videoUrl)) return;
  const video = document.getElementById("hls-player");
  if(!video) return;
  if(window.Hls && Hls.isSupported()){
    currentHls = new Hls();
    currentHls.loadSource(play.videoUrl);
    currentHls.attachMedia(video);
  } else if(video.canPlayType("application/vnd.apple.mpegurl")){
    video.src = play.videoUrl; // Safari toca HLS nativamente
  } else {
    toast("Este navegador não consegue tocar este vídeo.");
  }
}

/* --------------------------- CHECKOUT PIX -------------------------------- */
// O navegador só PEDE o pagamento e ACOMPANHA o resultado. Quem decide se o plano é liberado é o
// servidor, depois de confirmar com a SyncPay — nada aqui consegue "forçar" a liberação.
let checkout = { plan: null, payment: null, timer: null, polls: 0 };

function maskCpf(v){ v = v.replace(/\D/g,"").slice(0,11); return v.replace(/(\d{3})(\d)/,"$1.$2").replace(/(\d{3})(\d)/,"$1.$2").replace(/(\d{3})(\d{1,2})$/,"$1-$2"); }
function maskPhone(v){ v = v.replace(/\D/g,"").slice(0,11); if(v.length>7) return v.replace(/(\d{2})(\d{5})(\d{0,4})/,"($1) $2-$3").replace(/-$/,""); if(v.length>2) return v.replace(/(\d{2})(\d+)/,"($1) $2"); return v; }

function checkoutBox(){
  let host = document.getElementById("checkout-modal");
  if(!host){
    host = document.createElement("div"); host.id = "checkout-modal"; host.className = "modal-overlay";
    host.innerHTML = `<div class="modal-box" id="checkout-box" style="max-width:440px;"></div>`;
    document.body.appendChild(host);
  }
  return host;
}
function openCheckout(planId){
  if(!currentUser()){ go("#/login"); return; }
  const plan = planById(planId);
  if(!plan || !(plan.price > 0)) return;
  stopPolling();
  checkout = { plan, payment: null, timer: null, polls: 0 };
  checkoutBox().classList.add("open");
  document.body.style.overflow = "hidden";
  renderCheckoutForm();
}
function closeCheckout(){
  const pending = checkout.payment && checkout.payment.status === "pending";
  stopPolling();
  const host = document.getElementById("checkout-modal");
  if(host) host.classList.remove("open");
  document.body.style.overflow = "";
  if(pending) toast("Se você já pagou o PIX, a confirmação chega sozinha em instantes.");
}
function stopPolling(){ if(checkout.timer){ clearTimeout(checkout.timer); checkout.timer = null; } }
function coHead(title){ return `<div class="modal-head"><h3>${title}</h3><button class="modal-close" onclick="closeCheckout()">&times;</button></div>`; }
function setCheckout(html){ document.getElementById("checkout-box").innerHTML = html; }

function renderCheckoutForm(errorMsg, vals){
  const p = checkout.plan; vals = vals || {};
  setCheckout(`${coHead("Assinar plano " + esc(p.name))}
    <div class="co-summary"><div><b>${esc(p.name)}</b><div style="font-size:12.5px; color:var(--ink-muted); margin-top:2px;">30 dias de acesso · pagamento por PIX</div></div><div class="co-price">${fmtMoney(p.price)}</div></div>
    <div class="form-msg error" id="co-msg" style="${errorMsg?'display:block':''}">${esc(errorMsg||"")}</div>
    <form id="co-form" autocomplete="on">
      <div class="field"><label>CPF</label><input name="cpf" inputmode="numeric" placeholder="000.000.000-00" required autocomplete="off" value="${esc(vals.cpf||"")}"></div>
      <div class="field"><label>Celular com DDD</label><input name="phone" inputmode="tel" placeholder="(63) 99999-9999" required autocomplete="tel" value="${esc(vals.phone||"")}"></div>
      <div class="field-hint" style="margin:-4px 0 16px;">O CPF é usado apenas para gerar a cobrança PIX. Não guardamos o número completo.</div>
      <button class="btn btn-gold btn-block" id="co-submit" type="submit">Gerar PIX de ${fmtMoney(p.price)}</button>
    </form>`);
  const f = qs("#co-form");
  f.cpf.addEventListener("input", ()=>{ f.cpf.value = maskCpf(f.cpf.value); });
  f.phone.addEventListener("input", ()=>{ f.phone.value = maskPhone(f.phone.value); });
  f.addEventListener("submit", submitCheckout);
}

async function submitCheckout(e){
  e.preventDefault();
  const f = e.target, btn = qs("#co-submit");
  btn.disabled = true; btn.textContent = "Gerando PIX...";
  try{
    const r = await api("/payments/checkout", { method:"POST", body:{ planId: checkout.plan.id, cpf: f.cpf.value, phone: f.phone.value } });
    checkout.payment = r.payment; checkout.polls = 0;
    renderPix(r);
    scheduleCheck(4000);
  }catch(err){
    renderCheckoutForm(err.message, { cpf: f.cpf.value, phone: f.phone.value });   // mantém o que a pessoa digitou
  }
}

function renderPix(r){
  setCheckout(`${coHead("Pague com PIX")}
    <div class="pix-box">
      <div class="co-summary" style="text-align:left;"><div><b>${esc(checkout.plan.name)}</b><div style="font-size:12.5px; color:var(--ink-muted);">30 dias de acesso</div></div><div class="co-price">${fmtMoney(r.payment.amount)}</div></div>
      <img class="qr" src="${r.qr}" alt="QR Code do PIX">
      <div class="pix-code" id="pix-code">${esc(r.pixCode)}</div>
      <button class="btn btn-gold btn-block" style="margin-top:12px;" onclick="copyPix()">Copiar código PIX</button>
      <ol class="pix-steps"><li>Abra o app do seu banco e escolha <b>Pix</b>.</li><li>Leia o QR Code ou use <b>Pix Copia e Cola</b>.</li><li>Confirme o pagamento. Esta tela atualiza sozinha!</li></ol>
      <div class="pix-wait"><span class="spinner" style="width:18px;height:18px;"></span><span id="pix-status">Aguardando o pagamento…</span></div>
      <div style="display:flex; gap:10px; margin-top:14px;">
        <button class="btn btn-ghost btn-sm" style="flex:1;" onclick="checkNow()">Já paguei, verificar</button>
        <button class="btn btn-danger btn-sm" onclick="cancelCheckout()">Cancelar</button>
      </div>
    </div>`);
}

async function copyPix(){
  const code = checkout.payment && qs("#pix-code") ? qs("#pix-code").textContent : "";
  try{ await navigator.clipboard.writeText(code); toast("Código PIX copiado! Cole no app do seu banco."); }
  catch(e){
    const r = document.createRange(); r.selectNodeContents(qs("#pix-code"));
    const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
    toast("Selecionamos o código — é só copiar.");
  }
}

function scheduleCheck(ms){
  stopPolling();
  checkout.timer = setTimeout(checkNow, ms);
}
async function checkNow(){
  if(!checkout.payment) return;
  stopPolling();
  checkout.polls++;
  try{
    const r = await api("/payments/" + checkout.payment.id);
    const st = r.payment.status;
    if(st === "paid"){ return onPaid(r.payment); }
    if(st === "expired" || st === "canceled"){
      return setCheckout(`${coHead("PIX expirado")}<div class="co-ok"><div class="big">⌛</div><h3>Este PIX não vale mais</h3><p style="color:var(--ink-muted); font-size:14px;">Sem problema — gere um novo e pague em menos de um minuto.</p><button class="btn btn-gold btn-block" style="margin-top:14px;" onclick="renderCheckoutForm()">Gerar novo PIX</button></div>`);
    }
  }catch(err){ /* falha momentânea de rede: tenta de novo no próximo ciclo */ }
  if(checkout.polls < 300) scheduleCheck(checkout.polls < 60 ? 5000 : 10000);
}
// Voltou do app do banco? Confere na hora, sem esperar o próximo ciclo.
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState === "visible" && checkout.payment && checkout.payment.status === "pending" && checkout.timer) checkNow(); });

async function onPaid(payment){
  stopPolling();
  checkout.payment = payment;
  await loadFresh().catch(()=>{});
  setCheckout(`${coHead("Pagamento confirmado")}<div class="co-ok"><div class="big">🎉</div><h3>Tudo certo! Plano ${esc(checkout.plan.name)} ativo</h3>
    <p style="color:var(--ink-muted); font-size:14px; line-height:1.6;">Seu acesso vale até <b style="color:var(--gold-soft);">${fmtDate(payment.validUntil)}</b>.<br>O comprovante fica em <b>Minha conta › Meus pagamentos</b>.</p>
    <button class="btn btn-gold btn-block" style="margin-top:14px;" onclick="closeCheckout(); go('#/catalogo'); render();">Ver as peças</button></div>`);
}
async function cancelCheckout(){
  try{ if(checkout.payment) await api("/payments/" + checkout.payment.id + "/cancel", { method:"POST" }); }catch(e){}
  checkout.payment = null;
  closeCheckout();
  toast("Pagamento cancelado. Nada foi cobrado.");
}

        setToken(r.token); DB.me = r.user;
        await loadFresh().catch(()=>{});

      }catch(err){ msg.textContent = err.message; msg.style.display="block"; }
    });

}

  return `<div class="page-wrap">
    <h1 class="page-title">Minha conta</h1><p class="page-sub">Olá, ${esc(user.name.split(" ")[0])}! Aqui você acompanha sua assinatura e seus dados.</p>

            : (!free ? `<button class="btn ${active?'btn-ghost':'btn-gold'} btn-sm" onclick="openCheckout('${esc(user.plan)}')">${active ? 'Renovar +30 dias' : 'Reativar plano'}</button> <a href="#/planos" class="btn btn-ghost btn-sm">Trocar de plano</a>` : '')}
        </div>
        <div class="acc-card" style="margin-bottom:20px;">
          <h3>Meus pagamentos</h3>
          <div id="my-payments"><p style="color:var(--ink-faint); font-size:13.5px;">Carregando…</p></div>
        </div>
        <div class="acc-card" style="margin-bottom:20px;">
          <h3>E-mails</h3>
          <label class="checkbox-row"><input type="checkbox" id="opt-emails" ${user.emailOptOut ? '' : 'checked'}> Quero receber novidades e destaques do catálogo por e-mail</label>
          <p class="field-hint" style="margin-top:8px;">Avisos importantes (vencimento do plano e comprovantes de pagamento) continuam chegando sempre.</p>
        </div>

          <h3>Alterar senha</h3>
          <div class="form-msg" id="pw-msg"></div>

            <div class="field"><label>Senha atual</label><input type="password" name="current" required autocomplete="current-password"></div>
            <div class="field"><label>Nova senha (mínimo 8 caracteres)</label><input type="password" name="next" required minlength="8" autocomplete="new-password"></div>
            <button class="btn btn-ghost btn-sm" type="submit">Salvar nova senha</button>
          </form>
        </div>
      </div>
    </div>
  </div>`;
}
const PAY_LABEL = { paid:["Pago","badge-ok"], pending:["Aguardando","badge-warn"], expired:["Expirado","badge-neutral"], canceled:["Cancelado","badge-neutral"] };
async function attachAccountEvents(){
  const pf = qs("#pw-form");
  if(pf) pf.addEventListener("submit", async e=>{
    e.preventDefault();
    const msg = qs("#pw-msg");
    try{
      await api("/auth/change-password", { method:"POST", body:{ currentPassword: pf.current.value, newPassword: pf.next.value } });
      msg.className = "form-msg ok"; msg.textContent = "Senha alterada com sucesso."; msg.style.display = "block"; pf.reset();
    }catch(err){ msg.className = "form-msg error"; msg.textContent = err.message; msg.style.display = "block"; }
  });
  const opt = qs("#opt-emails");
  if(opt) opt.addEventListener("change", async ()=>{
    try{ const r = await api("/auth/preferences", { method:"PATCH", body:{ emailOptOut: !opt.checked } }); DB.me = r.user; saveCache(); toast(opt.checked ? "Pronto! Você vai receber as novidades." : "Tudo bem, paramos os e-mails de divulgação."); }
    catch(err){ opt.checked = !opt.checked; toast(err.message); }
  });
  try{
    const r = await api("/payments/mine");
    const box = qs("#my-payments"); if(!box) return;
    box.innerHTML = r.payments.length ? r.payments.map(p=>{ const [t,c] = PAY_LABEL[p.status] || [p.status,"badge-neutral"];
      return `<div class="pay-row"><span>${fmtDate(p.createdAt)} · ${esc(p.planName)}</span><span>${fmtMoney(p.amount)} <span class="badge ${c}" style="margin-left:6px;">${t}</span></span></div>`; }).join("")
      : `<p style="color:var(--ink-faint); font-size:13.5px;">Você ainda não fez nenhum pagamento.</p>`;
  }catch(e){ const box = qs("#my-payments"); if(box) box.innerHTML = `<p style="color:var(--ink-faint); font-size:13.5px;">Não foi possível carregar agora.</p>`; }
}

      title: fd.get("title").trim(), genre: fd.get("genre"), releaseYear: parseInt(fd.get("releaseYear"),10),
      durationMinutes: parseInt(fd.get("durationMinutes"),10), requiresPlan: fd.get("requiresPlan"),
      synopsis: fd.get("synopsis").trim(), director: fd.get("director").trim(), cast: fd.get("cast").trim(),
      posterUrl: fd.get("posterUrl").trim(), backdropUrl: fd.get("backdropUrl").trim() || fd.get("posterUrl").trim(),
      videoUrl: fd.get("videoUrl").trim(), featured: fd.get("featured")==="on"
    };
    const existingId = fd.get("id");
    try{
      if(existingId){ await api("/plays/" + existingId, { method:"PUT", body:data }); toast("Peça atualizada."); }
      else{ await api("/plays", { method:"POST", body:data }); toast("Peça cadastrada."); }
      closeModal("play-modal"); render();
    }catch(err){ toast(err.message); }
  });
}
// Envia o arquivo de vídeo escolhido direto para o Bunny.net Stream,
// sem passar pelo nosso próprio servidor (evita limites de tamanho/tempo
// do Render). Usa o protocolo TUS (upload retomável, aguenta arquivos grandes).
async function uploadVideoToBunny(){
  const fileInput = qs("#bunny-file-input");
  const progressEl = qs("#bunny-progress");
  const file = fileInput.files[0];
  if(!file){ toast("Escolha um arquivo de vídeo primeiro."); return; }
  if(!window.tus){ toast("Não foi possível carregar o enviador de vídeo. Recarregue a página."); return; }

  const titleField = qs('#play-form [name="title"]');
  const title = (titleField && titleField.value.trim()) || "Peça sem título";

  progressEl.style.display = "block";
  progressEl.textContent = "Preparando upload...";

  let prep;
  try{
    prep = await api("/bunny/create-upload", { method:"POST", body:{ title } });
  }catch(err){
    progressEl.textContent = "";
    toast(err.message);
    return;
  }

  const upload = new tus.Upload(file, {
    endpoint: "https://video.bunnycdn.com/tusupload",
    retryDelays: [0, 3000, 5000, 10000],
    headers: {
      AuthorizationSignature: prep.signature,
      AuthorizationExpire: String(prep.expiration),
      VideoId: prep.videoGuid,
      LibraryId: String(prep.libraryId)
    },
    metadata: { filetype: file.type, title: title },
    onError: function(error){
      progressEl.textContent = "Erro no upload: " + error.message;
      toast("Falha ao enviar o vídeo.");
    },
    onProgress: function(bytesUploaded, bytesTotal){
      const pct = ((bytesUploaded / bytesTotal) * 100).toFixed(1);
      progressEl.textContent = "Enviando... " + pct + "%";
    },
    onSuccess: function(){
      progressEl.textContent = "Upload concluído! O Bunny ainda vai processar o vídeo (alguns minutos) antes de ficar disponível.";
      const urlField = qs("#video-url-field");
      if(urlField) urlField.value = prep.playbackUrl;
      toast("Vídeo enviado! Clique em \"Salvar peça\" para confirmar.");
    }
  });
  upload.start();
}

// ---------- Cadastro em lote (vários vídeos de uma vez) ----------
let batchFiles = [];

function openBatchModal(){
  batchFiles = [];
  qs("#batch-modal-box").innerHTML = `
    <div class="modal-head"><h3>Cadastrar várias peças de uma vez</h3><button class="modal-close" onclick="closeModal('batch-modal'); goToAdminPlaysPage(1);">&times;</button></div>
    <p style="color:var(--ink-muted); font-size:13px; margin-bottom:14px; line-height:1.6;">
      Escolha os vídeos do computador <b>ou</b> cole links do Google Drive (bem mais rápido — o Bunny busca
      direto do Drive, sem passar pela sua internet). Título e gênero são sugeridos automaticamente
      (dá pra ajustar). Depois de enviadas, edite cada peça pra completar sinopse, elenco e pôster.
    </p>
    <div class="field"><label>Arquivos do computador</label><input type="file" id="batch-file-input" accept="video/*" multiple></div>
    <div class="field">
      <label>Ou links do Google Drive (um por linha, no formato "Título | link")</label>
      <textarea id="batch-links-input" rows="4" placeholder="A Farsa do Silêncio | https://drive.google.com/file/d/XXXXX/view
Ventos de Dona Flor | https://drive.google.com/file/d/YYYYY/view"></textarea>
      <button type="button" class="btn btn-ghost btn-sm" style="margin-top:8px;" onclick="onBatchLinksSubmit()">Adicionar esses links à lista</button>
    </div>
    <div id="batch-list" style="margin-top:16px; display:flex; flex-direction:column; gap:10px;"></div>
    <div class="modal-actions">
      <button type="button" class="btn btn-ghost btn-sm" onclick="closeModal('batch-modal'); goToAdminPlaysPage(1);">Fechar</button>
      <button type="button" class="btn btn-gold btn-sm" id="batch-start-btn" style="display:none;" onclick="startBatchUpload()">Iniciar cadastro em lote</button>
    </div>`;
  openModal("batch-modal");
  qs("#batch-file-input").addEventListener("change", onBatchFilesChosen);
}

function onBatchLinksSubmit(){
  const raw = qs("#batch-links-input").value;
  const lines = raw.split("\n").map(l=>l.trim()).filter(Boolean);
  for(const line of lines){
    const parts = line.split("|");
    let title, url;
    if(parts.length >= 2){ title = parts[0].trim(); url = parts.slice(1).join("|").trim(); }
    else { title = "Peça sem título"; url = line.trim(); }
    if(!url) continue;
    batchFiles.push({ driveUrl: url, title, duration: 60, status: "Pronto para importar (ajuste a duração — não dá pra detectar de um link)" });
  }
  qs("#batch-links-input").value = "";
  renderBatchList();
  qs("#batch-start-btn").style.display = batchFiles.length ? "inline-block" : "none";
}

async function onBatchFilesChosen(e){
  const files = Array.from(e.target.files || []);
  const listEl = qs("#batch-list");
  listEl.textContent = "Detectando a duração dos vídeos...";
  for(const file of files){
    const minutes = await detectVideoDuration(file);
    batchFiles.push({ file, title: titleFromFilename(file.name), duration: Math.max(minutes || 60, 60), status: "Pronto para enviar" });
  }
  renderBatchList();
  qs("#batch-start-btn").style.display = batchFiles.length ? "inline-block" : "none";
}

function sleep(ms){ return new Promise(r=>setTimeout(r, ms)); }

function renderBatchList(){
  qs("#batch-list").innerHTML = batchFiles.map((f,i)=>`
    <div style="border:1px solid var(--line); border-radius:4px; padding:10px;">
      <div style="font-size:11px; color:var(--ink-faint); margin-bottom:6px;">${f.file ? "📁 arquivo local" : "🔗 link (" + esc(f.driveUrl) + ")"}</div>
      <div class="form-grid-2">
        <div class="field" style="margin-bottom:6px;"><label>Título</label><input type="text" value="${esc(f.title)}" onchange="batchFiles[${i}].title=this.value"></div>
        <div class="field" style="margin-bottom:0;"><label>Duração (min)</label><input type="number" min="60" value="${f.duration}" onchange="batchFiles[${i}].duration=parseInt(this.value,10)||60"></div>
      </div>
      <div style="font-size:12px; color:var(--ink-faint); margin-top:4px;" id="batch-status-${i}">${esc(f.status)}</div>
    </div>`).join("");
}

async function startBatchUpload(){
  qs("#batch-start-btn").disabled = true;
  qs("#batch-start-btn").textContent = "Enviando...";
  for(let i=0; i<batchFiles.length; i++){
    await processBatchItem(i);
  }
  toast("Cadastro em lote concluído!");
  await refreshPlays();
  qs("#batch-start-btn").textContent = "Concluído";
}

async function processBatchItem(i){
  const item = batchFiles[i];
  const setStatus = (txt) => { const el = qs("#batch-status-"+i); if(el) el.textContent = txt; };
  try{
    setStatus("Criando peça...");
    const created = await api("/plays", { method:"POST", body:{
      title: item.title, genre: guessGenre(item.title), releaseYear: new Date().getFullYear(),
      durationMinutes: item.duration, requiresPlan: "plateia",
      synopsis: "Sinopse a definir — edite esta peça para completar os detalhes.",
      director: "", cast: "",
      posterUrl: "https://images.unsplash.com/photo-1503095396549-807759245b35?q=80&w=800&auto=format&fit=crop",
      backdropUrl: "https://images.unsplash.com/photo-1503095396549-807759245b35?q=80&w=1600&auto=format&fit=crop",
      videoUrl: "", featured: false
    }});
    const playId = created.play.id;

    if(item.file){
      // Arquivo local: sobe direto do navegador pro Bunny via TUS.
      setStatus("Preparando envio do vídeo...");
      const prep = await api("/bunny/create-upload", { method:"POST", body:{ title: item.title } });
      await new Promise((resolve, reject)=>{
        const upload = new tus.Upload(item.file, {
          endpoint: "https://video.bunnycdn.com/tusupload",
          retryDelays: [0, 3000, 5000, 10000],
          headers: {
            AuthorizationSignature: prep.signature, AuthorizationExpire: String(prep.expiration),
            VideoId: prep.videoGuid, LibraryId: String(prep.libraryId)
          },
          metadata: { filetype: item.file.type, title: item.title },
          onError: (err) => { setStatus("Erro no envio: " + err.message); reject(err); },
          onProgress: (up, total) => setStatus("Enviando vídeo... " + ((up/total)*100).toFixed(0) + "%"),
          onSuccess: () => resolve()
        });
        upload.start();
      });
      await api("/plays/" + playId, { method:"PUT", body:{ videoUrl: prep.playbackUrl } });
      setStatus("✔ Concluído — edite a peça depois para completar gênero, sinopse etc.");
    } else if(item.driveUrl){
      // Link (Google Drive etc.): o Bunny busca sozinho, servidor-a-servidor.
      setStatus("Pedindo para o Bunny buscar o vídeo...");
      const prep = await api("/bunny/fetch-from-url", { method:"POST", body:{ url: item.driveUrl, title: item.title } });
      setStatus("Aguardando o Bunny confirmar...");
      let found = null;
      for(let attempt=0; attempt<20; attempt++){
        await sleep(4000);
        try{
          const r = await api("/bunny/resolve?marker=" + encodeURIComponent(prep.marker));
          if(r.found){ found = r; break; }
        }catch(e){ /* tenta de novo */ }
        setStatus("Aguardando o Bunny confirmar... (tentativa " + (attempt+1) + "/20)");
      }
      if(!found){
        setStatus("Não localizei a confirmação a tempo. Confira no painel do Bunny e cole a URL manualmente na peça, se precisar.");
        return;
      }
      await api("/plays/" + playId, { method:"PUT", body:{ videoUrl: found.playbackUrl } });
      setStatus("✔ Importação iniciada — o Bunny ainda está baixando/processando em segundo plano.");
    } else {
      setStatus("Nada para enviar (nem arquivo nem link).");
    }
  }catch(err){
    setStatus("Erro: " + (err.message || "falhou ao processar este item."));
  }
}

// Pede pro Bunny buscar o vídeo direto de um link (Google Drive etc.) — muito
// mais rápido que enviar do navegador, porque a transferência é servidor-a-servidor.
async function importVideoFromUrl(){
  const urlInput = qs("#import-url-input");
  const progressEl = qs("#bunny-progress");
  const url = urlInput.value.trim();
  if(!url){ toast("Cole um link primeiro."); return; }
  const titleField = qs('#play-form [name="title"]');
  const title = (titleField && titleField.value.trim()) || "Peça sem título";

  progressEl.style.display = "block";
  progressEl.textContent = "Pedindo para o Bunny buscar o vídeo...";

  let prep;
  try{
    prep = await api("/bunny/fetch-from-url", { method:"POST", body:{ url, title } });
  }catch(err){
    progressEl.textContent = "";
    toast(err.message);
    return;
  }

  progressEl.textContent = "Bunny está buscando o vídeo. Aguardando confirmação (pode levar um pouco)...";
  let tries = 0;
  const poll = async () => {
    tries++;
    try{
      const r = await api("/bunny/resolve?marker=" + encodeURIComponent(prep.marker));
      if(r.found){
        qs("#video-url-field").value = r.playbackUrl;
        progressEl.textContent = "Importação iniciada! O Bunny ainda vai processar o vídeo (alguns minutos) antes de ficar disponível.";
        toast("Vídeo importado! Clique em \"Salvar peça\" para confirmar.");
        return;
      }
    }catch(e){ /* tenta de novo */ }
    if(tries >= 20){
      progressEl.textContent = "Ainda não localizei o vídeo importado. Ele pode estar demorando mais — confira no painel do Bunny.net, ou tente salvar a peça e colar a URL manualmente depois.";
      return;
    }
    setTimeout(poll, 4000);
  };
  poll();
}

/* --------------------------- APP INSTALÁVEL (PWA) -------------------------- */
function registerServiceWorker(){
  if("serviceWorker" in navigator){
    window.addEventListener("load", ()=>{ navigator.serviceWorker.register("/sw.js").catch(()=>{}); });
  }
}
let deferredInstall = null;
function isStandalone(){ return (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true; }
function isIos(){ return /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream; }
window.addEventListener("beforeinstallprompt", (e)=>{ e.preventDefault(); deferredInstall = e; });
window.addEventListener("appinstalled", ()=>{ deferredInstall = null; removeInstallBanner(); toast("App instalado! Procure o Mini Drama na sua tela inicial 🎭"); });

function removeInstallBanner(){ const b = document.getElementById("install-banner"); if(b) b.remove(); }
function dismissInstallBanner(){ try{ localStorage.setItem("md_install_dismissed", String(Date.now())); }catch(e){} removeInstallBanner(); }

// Instala (Android/Chrome/Edge/desktop) ou ensina o caminho (iPhone/Safari, que não tem botão automático).
async function promptInstall(){
  if(isStandalone()){ toast("O app já está instalado neste aparelho."); return; }
  if(deferredInstall){
    deferredInstall.prompt();
    const choice = await deferredInstall.userChoice.catch(()=>null);
    deferredInstall = null; removeInstallBanner();
    if(choice && choice.outcome !== "accepted") try{ localStorage.setItem("md_install_dismissed", String(Date.now())); }catch(e){}
    return;
  }
  if(isIos()){ showInstallBanner(true); return; }
  toast("No menu do navegador, escolha “Instalar app” ou “Adicionar à tela inicial”.");
}

function showInstallBanner(force){
  if(document.getElementById("install-banner")) return;
  const ios = isIos() && !deferredInstall;
  const b = document.createElement("div");
  b.id = "install-banner"; b.className = "install-banner";
  b.innerHTML = `<img src="/icons/icon-192.png" alt="">
    <div class="ib-text">
      <p class="ib-title">Instale o app Mini Drama</p>
      <p class="ib-sub">${ios ? 'Toque em <b>Compartilhar</b> <span aria-hidden="true">⬆️</span> e depois em <b>“Adicionar à Tela de Início”</b>.' : 'Acesso direto da tela inicial, abre mais rápido e em tela cheia.'}</p>
      ${ios ? '' : '<button class="btn btn-gold btn-sm" style="margin-top:8px;" onclick="promptInstall()">Instalar app</button>'}
    </div>
    <button class="ib-close" aria-label="Fechar" onclick="dismissInstallBanner()">&times;</button>`;
  document.body.appendChild(b);
}

// Mostra o convite alguns segundos depois de abrir (sem atrapalhar), no máximo 1x a cada 7 dias.
function scheduleInstallBanner(){
  if(isStandalone()) return;
  let last = 0; try{ last = parseInt(localStorage.getItem("md_install_dismissed"), 10) || 0; }catch(e){}
  if(Date.now() - last < 7*86400000) return;
  setTimeout(()=>{
    if(isStandalone() || document.getElementById("install-banner")) return;
    if(deferredInstall || (isIos() && /safari/i.test(navigator.userAgent) && !/crios|fxios/i.test(navigator.userAgent))) showInstallBanner();
  }, 6000);
}
