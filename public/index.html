const GENRE_RULES = [
  { id:"homem-lobo-e-vampiro", words:["lobo","lobisomem","vampir"] },
  { id:"bebes-e-gravidezes", words:["bebe","gravid","gestan","gestac","maternidade"] },
  { id:"amor-a-primeira-vista", words:["primeira vista","primeiro olhar"] },
  { id:"identidade-escondida", words:["identidade","disfarc","incognit","escondid"] },
  { id:"relacionamento-tabu", words:["tabu","proibid","padrasto","madrasta","cunhad"] },
  { id:"animes", words:["anime"] },
  { id:"dublados", words:["dublad","dublagem"] },
  { id:"brasileiras", words:["brasil"] },
  { id:"ia", words:["inteligencia artificial","robo"], re:/\bia\b/ },
  { id:"bl-gl", words:["boys love","girls love"], re:/\b(bl|gl)\b/ }
];
function normalizeText(s){ return (s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, ""); }
function guessGenres(text){
  const t = normalizeText(text);
  return GENRE_RULES.filter(r => r.words.some(w => t.includes(w)) || (r.re && r.re.test(t))).map(r => r.id);
}

/* --------------------------- STORYREEL (player vertical) ------------------------------
   Feed estilo Reels/TikTok: uma novelinha por tela, rolagem com scroll-snap (CSS puro) e player Plyr
   (+ hls.js para .m3u8). Só a tela ATIVA tem player montado; as outras ficam só com a capa, então
   memória e banda não crescem com o tamanho do feed. O link do vídeo vem de /api/plays/:id (a listagem
   nunca o traz), logo quem não tem direito à novelinha nunca recebe o link. */
const REEL_SVG = (path, size = 22) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${path}</svg>`;
const REEL_ICO = {
  volume: REEL_SVG('<path d="M11 5L6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 010 7M18.5 5.5a9 9 0 010 13"/>'),
  mute: REEL_SVG('<path d="M11 5L6 9H3v6h3l5 4z"/><path d="M22 9l-6 6M16 9l6 6"/>'),
  info: REEL_SVG('<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>'),
  share: REEL_SVG('<path d="M4 12v7a1 1 0 001 1h14a1 1 0 001-1v-7M16 6l-4-4-4 4M12 2v14"/>'),
  up: REEL_SVG('<path d="M6 15l6-6 6 6"/>'),
  down: REEL_SVG('<path d="M6 9l6 6 6-6"/>'),
  back: REEL_SVG('<path d="M15 18l-6-6 6-6"/>'),
  lock: REEL_SVG('<rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 018 0v3"/>', 30),
  expand: REEL_SVG('<path d="M8 3H5a2 2 0 00-2 2v3M21 8V5a2 2 0 00-2-2h-3M3 16v3a2 2 0 002 2h3M16 21h3a2 2 0 002-2v-3"/>'),
  film: REEL_SVG('<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M3 15h18M8 4v16M16 4v16"/>', 30),
  alert: REEL_SVG('<circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5h.01"/>', 30)
};
const PLYR_PT = { restart:"Reiniciar", rewind:"Voltar {seektime}s", play:"Reproduzir", pause:"Pausar", fastForward:"Avançar {seektime}s",
  seek:"Buscar", seekLabel:"{currentTime} de {duration}", played:"Assistido", buffered:"Carregado", currentTime:"Tempo atual", duration:"Duração",
  volume:"Volume", mute:"Silenciar", unmute:"Ativar som", enableCaptions:"Ativar legendas", disableCaptions:"Desativar legendas", download:"Baixar",
  enterFullscreen:"Tela cheia", exitFullscreen:"Sair da tela cheia", frameTitle:"Player de {title}", captions:"Legendas", settings:"Configurações",
  pip:"Picture-in-picture", menuBack:"Voltar ao menu anterior", speed:"Velocidade", normal:"Normal", quality:"Qualidade", loop:"Repetir",
  start:"Início", end:"Fim", all:"Tudo", reset:"Redefinir", disabled:"Desativado", enabled:"Ativado", advertisement:"Anúncio" };

let reel = null;          // estado do reel aberto (null = fechado)
let appRenders = 0;       // quantas telas o site já desenhou (para o "Voltar" saber se há para onde voltar)

/* ---- funções puras (testadas em tests/storyreel.test.js) ---- */
function ytId(url){ const m = String(url || "").match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{6,})/); return m ? m[1] : null; }
// A novelinha escolhida vem primeiro; depois as outras que a pessoa PODE assistir e que já têm vídeo.
function buildReelFeed(plays, startId){
  const start = startId ? plays.find(p => p.id === startId) : null;
  const rest = plays.filter(p => p.canWatch && p.hasVideo && (!start || p.id !== start.id));
  return start ? [start, ...rest] : rest;
}
// Vídeo em pé (9:16) ocupa a tela inteira; o horizontal fica numa caixa 16:9 sobre a capa borrada.
function reelIsTall(w, h){ return w > 0 && h > w * 1.1; }

function waitFor(test, ms){
  return new Promise(res => { const t0 = Date.now(); (function tick(){ const v = test(); if(v) return res(v); if(Date.now() - t0 > ms) return res(null); setTimeout(tick, 120); })(); });
}
const reelReduced = () => window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---- montagem da tela ---- */
function reelMetaHtml(p){
  return `<span>${ICO.clock} ${fmtDuration(p.durationMinutes)}</span>${p.genreLabels && p.genreLabels.length ? `<span>${p.genreLabels.slice(0, 2).map(esc).join(" · ")}</span>` : ""}<span>${esc(p.releaseYear)}</span>`;
}
function reelPanelHtml(kind, p){
  const plan = planById(p.requiresPlan), user = currentUser();
  if(kind === "locked") return `${REEL_ICO.lock}<h3>Conteúdo do plano ${esc(plan ? plan.name : "")}</h3><p>Assine para assistir à novelinha completa (${fmtDuration(p.durationMinutes)}).</p>
    <div class="reel-panel-actions"><a href="#/planos" class="btn btn-gold btn-sm">Ver planos</a>${user ? "" : `<a href="#/login" class="btn btn-ghost btn-sm">Entrar</a>`}</div>`;
  if(kind === "novideo") return `${REEL_ICO.film}<h3>Vídeo ainda não cadastrado</h3><p>A produção ainda vai anexar o link de exibição desta novelinha.</p>`;
  return `${REEL_ICO.alert}<h3>Não foi possível reproduzir</h3><p>${esc(kind)}</p><div class="reel-panel-actions"><button class="btn btn-ghost btn-sm" data-act="retry">Tentar de novo</button></div>`;
}
function reelSlideHtml(p, i){
  const bg = esc(p.backdropUrl || p.posterUrl || "");
  const watchable = p.canWatch && p.hasVideo;
  const panel = !p.canWatch ? "locked" : (!p.hasVideo ? "novideo" : "");
  const syn = String(p.synopsis || "").trim();
  return `<section class="reel-slide ${panel ? "is-panel" : ""}" data-i="${i}" data-id="${esc(p.id)}" aria-label="${esc(p.title)}">
    <div class="reel-bg" style="background-image:url('${bg}')"></div>
    <div class="reel-stage" id="reel-stage-${i}">
      <img class="reel-cover" src="${bg}" alt="">
      ${panel ? `<div class="reel-panel">${reelPanelHtml(panel, p)}</div>` : ""}
    </div>
    <div class="reel-info">
      <h2 class="reel-title">${esc(p.title)}</h2>
      <p class="reel-meta">${reelMetaHtml(p)}</p>
      ${syn.length > 2 ? `<p class="reel-syn">${esc(syn)}</p>` : ""}
    </div>
    <div class="reel-rail">
      ${watchable ? `<button class="reel-btn" data-act="sound" aria-label="Ativar ou silenciar o som" aria-pressed="false">${REEL_ICO.volume}</button><button class="reel-btn reel-btn-fs" data-act="fs" aria-label="Tela cheia">${REEL_ICO.expand}</button>` : ""}
      <button class="reel-btn" data-act="info" aria-label="Detalhes da novelinha">${REEL_ICO.info}</button>
      <button class="reel-btn" data-act="share" aria-label="Compartilhar">${REEL_ICO.share}</button>
    </div>
  </section>`;
}
function reelEndHtml(i){
  return `<section class="reel-slide reel-end" data-i="${i}" aria-label="Fim da lista">
    <h2>Você viu tudo por aqui</h2><p>Não há mais novelinhas liberadas para você nesta lista.</p>
    <div class="reel-panel-actions"><a href="#/catalogo" class="btn btn-gold btn-sm">Ver o catálogo</a><button class="btn btn-ghost btn-sm" data-act="top">Voltar ao início</button></div>
  </section>`;
}
function reelShellHtml(inner){
  return `<div class="reel" id="reel" role="region" aria-label="StoryReel">
    <div class="reel-top"><button class="reel-btn" data-act="back" aria-label="Voltar">${REEL_ICO.back}</button><span class="reel-count" id="reel-count" aria-live="polite"></span></div>
    ${inner}</div>`;
}

/* ---- dados ---- */
function reelDetail(id, chapterId){
  const r = reel; if(!r) return Promise.reject(new Error("fechado"));
  const key = id + (chapterId ? ":" + chapterId : "");
  if(!r.details.has(key)) r.details.set(key, api("/plays/" + encodeURIComponent(id) + (chapterId ? `?chapterId=${encodeURIComponent(chapterId)}` : "")).catch(e => { r.details.delete(key); throw e; }));
  return r.details.get(key);
}
// Salva onde a pessoa parou (servidor: PUT /api/me/progress/:id). Só para quem está logada.
function reelSave(r, id, ctl, force, finished){
  if(!r || !ctl || !currentUser()) return;
  const dur = Math.floor(ctl.duration || 0), pos = finished ? dur : Math.floor(ctl.time || 0);
  if(!(dur >= 60) || !Number.isFinite(pos) || pos < 0) return;
  r.lastPos.set(id, pos / dur >= 0.95 ? 0 : pos);
  const now = Date.now();
  if(!force && now - r.lastSave < 15000) return;
  r.lastSave = now;
  fetch("/api/me/progress/" + encodeURIComponent(id), {
    method: "PUT", keepalive: true,
    headers: { "Content-Type": "application/json", Authorization: "Bearer " + getToken() },
    body: JSON.stringify({ position: Math.min(pos, dur), duration: dur })
  }).catch(() => {});
}

/* ---- player (Plyr + hls.js; se o Plyr não carregar, cai para os controles do navegador) ---- */
async function createReelPlayer(stage, url, opts){
  const host = document.createElement("div"); host.className = "reel-player"; stage.appendChild(host);
  const yt = isYoutube(url) ? ytId(url) : null;
  const hlsUrl = !yt && isHls(url);
  let el, hls = null;
  if(yt) host.innerHTML = `<div class="plyr__video-embed" data-plyr-provider="youtube" data-plyr-embed-id="${esc(yt)}"></div>`;
  else host.innerHTML = `<video playsinline preload="metadata"></video>`;
  el = host.firstElementChild;

  const Plyr_ = await waitFor(() => window.Plyr, 3500);
  if(yt && !Plyr_){                                    // sem Plyr, o YouTube volta ao iframe simples
    host.innerHTML = `<iframe src="${esc(embedYoutube(url))}" allow="autoplay; fullscreen" allowfullscreen style="width:100%;height:100%"></iframe>`;
    const nop = () => {};
    return { kind: "iframe", paused: true, time: 0, duration: 0, muted: false, play: () => Promise.resolve(), pause: nop, toggle: nop, seekBy: nop, seekTo: nop, fullscreen: nop, on: nop, destroy: () => host.remove() };
  }
  if(hlsUrl){
    await waitFor(() => window.Hls, 4500);
    if(window.Hls && Hls.isSupported()){
      hls = new Hls({ startPosition: opts.resume > 5 ? opts.resume : -1 });
      let retries = 0;
      hls.on(Hls.Events.ERROR, (_, data) => {
        if(!data || !data.fatal) return;
        if(data.type === Hls.ErrorTypes.NETWORK_ERROR && retries++ < 2) hls.startLoad();
        else if(data.type === Hls.ErrorTypes.MEDIA_ERROR && retries++ < 2) hls.recoverMediaError();
        else opts.onFatal && opts.onFatal("O vídeo não carregou. Confira sua conexão e tente de novo.");
      });
      hls.loadSource(url); hls.attachMedia(el);
    } else if(el.canPlayType("application/vnd.apple.mpegurl")){ el.src = url; }
    else { host.remove(); throw new Error("Este navegador não consegue tocar este vídeo."); }
  } else if(!yt){ el.src = url; }

  let player = null;
  if(Plyr_){
    player = new Plyr(el, {
      controls: ["play-large", "play", "progress", "current-time", "duration", "mute", "volume", "settings", "fullscreen"],
      settings: ["speed"], speed: { selected: 1, options: [0.75, 1, 1.25, 1.5] },
      keyboard: { focused: false, global: false },        // as teclas são tratadas por reelOnKey (evita ação dupla)
      clickToPlay: true, hideControls: true, resetOnEnd: false, seekTime: 10,
      tooltips: { controls: false, seek: true }, muted: !!opts.muted, i18n: PLYR_PT,
      iconUrl: "https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.svg",
      youtube: { noCookie: true, rel: 0, iv_load_policy: 3, modestbranding: 1 }
    });
    host.addEventListener("click", (ev) => { if(ev.target.closest('[data-plyr="fullscreen"]')){ ev.stopPropagation(); ev.preventDefault(); reelToggleFullscreen(); } }, true);
    host.addEventListener("dblclick", (ev) => { if(ev.target.closest(".plyr__controls, .plyr__menu")) return; ev.stopPropagation(); ev.preventDefault(); reelToggleFullscreen(); }, true);
  } else { el.controls = true; el.muted = !!opts.muted; }

  const media = () => player || el;
  const ctl = {
    kind: yt ? "youtube" : (hlsUrl ? "hls" : "file"), el,
    get time(){ return Number(media().currentTime) || 0; },
    get duration(){ return Number(media().duration) || 0; },
    get paused(){ return !!media().paused; },
    get muted(){ return !!media().muted; },
    set muted(v){ media().muted = !!v; },
    play(){ try{ return Promise.resolve(media().play()); }catch(e){ return Promise.reject(e); } },
    pause(){ media().pause(); },
    toggle(){ return ctl.paused ? ctl.play().catch(() => {}) : ctl.pause(); },
    seekTo(t){ media().currentTime = Math.max(0, t); },
    seekBy(d){ const max = ctl.duration || Infinity; ctl.seekTo(Math.min(max, ctl.time + d)); },
    fullscreen(){ reelToggleFullscreen(); },
    on(evt, fn){ if(player) player.on(evt, fn); else el.addEventListener(evt === "ready" ? "loadedmetadata" : evt, fn); },
    destroy(){
      try{ if(player) player.destroy(); }catch(e){}
      try{ if(hls) hls.destroy(); }catch(e){}
      try{ if(!yt){ el.removeAttribute("src"); el.load && el.load(); } }catch(e){}
      host.remove();
    }
  };
  return ctl;
}

/* ---- ativar / desativar uma tela ---- */
const reelStageEl = (i) => document.getElementById("reel-stage-" + i);
function reelSlideEl(i){ return reel && reel.scroller.querySelector(`.reel-slide[data-i="${i}"]`); }
function reelShowPanel(i, kind){
  const slide = reelSlideEl(i), stage = reelStageEl(i); if(!slide || !stage) return;
  slide.classList.add("is-panel"); stage.classList.remove("is-live");
  const l = stage.querySelector(".reel-loading"); if(l) l.remove();
  let el = stage.querySelector(".reel-panel"); if(!el){ el = document.createElement("div"); el.className = "reel-panel"; stage.appendChild(el); }
  el.innerHTML = reelPanelHtml(kind, reel.items[i]);
}

async function reelMount(i){
  const r = reel, p = r.items[i]; if(!p) return;
  if(!(p.canWatch && p.hasVideo)) return;
  const token = ++r.token, stage = reelStageEl(i), slide = reelSlideEl(i); if(!stage || !slide) return;
  const stale = () => reel !== r || r.active !== i || r.token !== token;
  slide.classList.remove("is-panel");
  const old = stage.querySelector(".reel-panel"); if(old) old.remove();
  stage.insertAdjacentHTML("beforeend", `<div class="reel-loading" role="status" aria-label="Carregando"></div>`);
  let d;
  try{ d = await reelDetail(p.id, p.chapterId); }
  catch(e){ if(!stale()) reelShowPanel(i, e.message || "Não consegui carregar este vídeo."); return; }
  if(stale()) return;
  const url = d.play && d.play.videoUrl;
  if(!d.canWatch){ reelShowPanel(i, "locked"); return; }
  if(!url){ reelShowPanel(i, "novideo"); return; }
  const resume = r.lastPos.has(p.id) ? r.lastPos.get(p.id) : ((d.resume && d.resume.position) || 0);
  let ctl;
  const subUrl = (d && d.play && d.play.subtitleUrl) || p.subtitleUrl || "";
  try{ ctl = await createReelPlayer(stage, url, { resume, muted: r.muted, subtitleUrl: subUrl, onFatal: (m) => { if(!stale()) reelShowPanel(i, m); } }); }
  catch(e){ if(!stale()) reelShowPanel(i, e.message || "Não foi possível reproduzir."); return; }
  if(stale()){ ctl.destroy(); return; }
  r.ctl = ctl; r.ctlIndex = i; r.lastSave = Date.now();

  let resumed = false;
  const applyResume = () => { if(resumed) return; resumed = true; if(resume > 5 && Math.abs(ctl.time - resume) > 2 && ctl.kind !== "hls") ctl.seekTo(resume); };
  ctl.on("loadedmetadata", () => {
    applyResume();
    const v = ctl.el;
    slide.classList.toggle("is-tall", ctl.kind !== "youtube" && reelIsTall(v.videoWidth, v.videoHeight));
  });
  ctl.on("ready", () => { if(ctl.kind === "youtube") applyResume(); });
  ctl.on("playing", () => {
    const l = stage.querySelector(".reel-loading"); if(l) l.remove(); stage.classList.add("is-live"); reelPoke();
    if(p.isVorta || String(p.id).startsWith("vorta:")){
      fetch("/api/vorta/track", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ deviceId: "web-player", deviceModel: (navigator.userAgent || "Web").slice(0, 100), osVersion: navigator.platform || "Web", appVersion: "1.0.0" })
      }).catch(() => {});
    }
  });
  ctl.on("pause", () => { reelSave(r, p.id, ctl, true); reelPoke(); });
  ctl.on("timeupdate", () => reelSave(r, p.id, ctl, false));
  ctl.on("volumechange", () => { r.muted = ctl.muted; reelSyncSound(); });
  ctl.on("ended", () => { reelSave(r, p.id, ctl, true, true); if(r.active === i) reelGo(i + 1); });
  ctl.on("error", () => { if(!stale() && ctl.kind !== "youtube") reelShowPanel(i, "O vídeo não carregou. Confira sua conexão e tente de novo."); });
  reelSyncSound();

  try{ await ctl.play(); }
  catch(e){                                             // o navegador barrou o autoplay com som: começa mudo (o botão de som ativa)
    if(!ctl.muted && !stale()){
      ctl.muted = true; r.muted = true; reelSyncSound();
      try{ await ctl.play(); toast("Toque no ícone de som para ativar o áudio."); }catch(e2){ /* fica no botão de play do player */ }
    }
  }
}

function reelUnmount(i){
  const r = reel; if(!r) return;
  r.token++;
  if(r.ctl && r.ctlIndex === i){
    const p = r.items[i]; if(p) reelSave(r, p.id, r.ctl, true);
    r.ctl.destroy(); r.ctl = null; r.ctlIndex = -1;
  }
  const stage = reelStageEl(i), slide = reelSlideEl(i);
  if(stage){ stage.classList.remove("is-live"); const l = stage.querySelector(".reel-loading"); if(l) l.remove(); }
  if(slide) slide.classList.remove("is-tall", "is-fs");
  if(r.fsCss){ r.fsCss = false; r.root.classList.remove("fs-css"); }
}

function reelSetActive(i){
  const r = reel; if(!r || i === r.active) return;
  if(r.active >= 0) reelUnmount(r.active);
  r.active = i;
  const item = r.items[i];
  const c = document.getElementById("reel-count");
  if(c) c.textContent = item ? `${i + 1} / ${r.items.length}` : "Fim";
  const up = r.root.querySelector('[data-act="up"]'), down = r.root.querySelector('[data-act="down"]');
  if(up) up.disabled = i <= 0; if(down) down.disabled = i >= r.last;
  const hint = document.getElementById("reel-hint"); if(hint && i > 0){ hint.classList.add("gone"); }
  if(item){
    try{ history.replaceState(null, "", "#/reel/" + item.id); }catch(e){}
    reelMount(i);
    const nxt = r.items[i + 1];                         // adianta o link do próximo (só o texto; o vídeo só carrega quando ele ficar ativo)
    if(nxt && nxt.canWatch && nxt.hasVideo) reelDetail(nxt.id).catch(() => {});
  }
  reelSyncSound(); reelPoke();
}
function reelGo(i){
  const r = reel; if(!r) return;
  i = Math.max(0, Math.min(r.last, i));                  // com mais de uma novelinha, a última posição é a tela de "fim"
  const s = reelSlideEl(i);
  if(s) s.scrollIntoView({ behavior: reelReduced() ? "auto" : "smooth", block: "start" });
}

/* ---- interação ---- */
function reelSyncSound(){
  const r = reel; if(!r) return;
  r.root.querySelectorAll('[data-act="sound"]').forEach(b => { b.innerHTML = r.muted ? REEL_ICO.mute : REEL_ICO.volume; b.setAttribute("aria-pressed", r.muted ? "false" : "true"); });
}
function reelPoke(){                                    // em tela larga, título e botões somem com o player parado de mexer
  const r = reel; if(!r) return;
  r.root.classList.remove("ui-idle"); clearTimeout(r.idleT);
  if(r.ctl && !r.ctl.paused) r.idleT = setTimeout(() => { if(reel === r) r.root.classList.add("ui-idle"); }, 3200);
}
function reelBack(){ if(appRenders > 1) history.back(); else go("#/home"); }
function reelToggleMute(){
  const r = reel; if(!r) return;
  r.muted = !r.muted;
  if(r.ctl) r.ctl.muted = r.muted;
  reelSyncSound();
}
/* ---- tela cheia: 1) nativa no palco (Android/PC) 2) <video> nativo (iPhone) 3) CSS ---- */
const reelNativeFs = () => document.fullscreenElement || document.webkitFullscreenElement || null;
function reelFsActive(){ return !!(reelNativeFs() || (reel && reel.fsCss)); }
function reelSetFsCss(on){
  const r = reel; if(!r) return;
  r.fsCss = !!on; r.root.classList.toggle("fs-css", !!on);
  const slide = reelSlideEl(r.ctlIndex); if(slide) slide.classList.toggle("is-fs", !!on);
}
function reelLockLandscape(){
  try{
    const o = window.screen && screen.orientation, v = reel && reel.ctl && reel.ctl.el;
    if(o && o.lock && !(v && v.videoHeight > v.videoWidth)) o.lock("landscape").catch(() => {});   // vídeo deitado: gira a tela sozinha
  }catch(e){}
}
function reelUnlock(){ try{ if(window.screen && screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); }catch(e){} }
async function reelExitFs(){
  try{
    if(document.fullscreenElement && document.exitFullscreen) await document.exitFullscreen();
    else if(document.webkitFullscreenElement && document.webkitExitFullscreen) document.webkitExitFullscreen();
  }catch(e){}
  reelSetFsCss(false); reelUnlock();
}
async function reelToggleFullscreen(){
  const r = reel; if(!r || !r.ctl) return;
  if(reelFsActive()){ await reelExitFs(); return; }
  const stage = reelStageEl(r.ctlIndex), video = r.ctl.el;
  const req = stage && (stage.requestFullscreen || stage.webkitRequestFullscreen);
  if(req){
    try{ await req.call(stage, { navigationUI: "hide" }); reelLockLandscape(); return; }
    catch(e){ /* o navegador recusou: tenta a próxima opção */ }
  }
  if(r.ctl.kind !== "youtube" && video && video.webkitEnterFullscreen){      // iPhone: só o <video> vai para a tela cheia de verdade
    try{ video.webkitEnterFullscreen(); return; }catch(e){}
  }
  reelSetFsCss(true);
}
function reelOpenSheet(){
  const r = reel, p = r && r.items[r.active]; if(!p) return;
  const plan = planById(p.requiresPlan);
  const staff = [p.director ? `<b>Direção:</b> ${esc(p.director)}` : "", p.cast ? `<b>Elenco:</b> ${esc(p.cast)}` : ""].filter(Boolean).join("<br>");
  const syn = String(p.synopsis || "").trim();
  r.sheet.innerHTML = `<div class="reel-sheet-box" role="dialog" aria-modal="true" aria-label="Detalhes de ${esc(p.title)}">
    <div class="reel-sheet-head"><h3>${esc(p.title)}</h3><button class="reel-btn" data-act="closesheet" aria-label="Fechar">&times;</button></div>
    <p class="reel-meta">${reelMetaHtml(p)}</p>
    ${syn.length > 2 ? `<p class="reel-sheet-syn">${esc(syn)}</p>` : ""}
    ${staff ? `<p class="reel-sheet-cast">${staff}</p>` : ""}

    <a class="btn btn-ghost btn-sm" href="#/novelinha/${esc(p.id)}">Ver página da novelinha</a></div>`;
  r.sheet.classList.add("open");
  const close = r.sheet.querySelector('[data-act="closesheet"]'); if(close) close.focus();
}
function reelCloseSheet(){ const r = reel; if(r) r.sheet.classList.remove("open"); }
async function reelShare(){
  const r = reel, p = r && r.items[r.active]; if(!p) return;
  const url = location.origin + location.pathname + "#/novelinha/" + p.id;
  if(navigator.share){ try{ await navigator.share({ title: p.title, text: p.title + " — " + SITE_NAME, url }); }catch(e){} return; }
  try{ await navigator.clipboard.writeText(url); toast("Link copiado."); }catch(e){ window.prompt("Copie o link:", url); }
}
function reelOnClick(e){
  const r = reel; if(!r) return;
  if(e.target === r.sheet){ reelCloseSheet(); return; }
  const b = e.target.closest("[data-act]"); if(!b) return;
  switch(b.dataset.act){
    case "back": reelBack(); break;
    case "sound": reelToggleMute(); break;
    case "fs": reelToggleFullscreen(); break;
    case "info": reelOpenSheet(); break;
    case "closesheet": reelCloseSheet(); break;
    case "share": reelShare(); break;
    case "up": reelGo(r.active - 1); break;
    case "down": reelGo(r.active + 1); break;
    case "top": reelGo(0); break;
    case "retry": { const i = r.active; reelUnmount(i); const s = reelSlideEl(i); if(s) s.classList.remove("is-panel"); reelMount(i); break; }
  }
}
function reelOnKey(e){
  const r = reel; if(!r || e.ctrlKey || e.metaKey || e.altKey) return;
  const t = e.target, k = e.key;
  if(t && /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) return;                       // não atrapalha a barra de progresso nem campos
  if(t && t.closest && t.closest("button, a") && (k === " " || k === "Enter")) return; // botão focado: deixa o clique normal valer
  const sheetOpen = r.sheet.classList.contains("open");
  if(k === "Escape"){ if(sheetOpen) reelCloseSheet(); else if(reelFsActive()) reelExitFs(); else reelBack(); return; }
  if(sheetOpen) return;
  const act = {
    ArrowDown: () => reelGo(r.active + 1), PageDown: () => reelGo(r.active + 1),
    ArrowUp: () => reelGo(r.active - 1), PageUp: () => reelGo(r.active - 1),
    " ": () => r.ctl && r.ctl.toggle(),
    ArrowRight: () => r.ctl && r.ctl.seekBy(10), ArrowLeft: () => r.ctl && r.ctl.seekBy(-10),
    m: reelToggleMute, M: reelToggleMute, f: reelToggleFullscreen, F: reelToggleFullscreen,
    i: reelOpenSheet, I: reelOpenSheet
  }[k];
  if(act){ e.preventDefault(); act(); reelPoke(); }
}

/* ---- abrir / fechar ---- */
function reelTeardown(){
  const r = reel; if(!r) return;
  reel = null;                                          // primeiro: assim qualquer resposta que chegar atrasada se descarta sozinha
  clearTimeout(r.idleT);
  try{ if(r.ctl){ const p = r.items[r.ctlIndex]; if(p) reelSave(r, p.id, r.ctl, true); r.ctl.destroy(); } }catch(e){}
  if(r.io) r.io.disconnect();
  document.removeEventListener("keydown", r.onKey);
  document.removeEventListener("fullscreenchange", r.onFs); document.removeEventListener("webkitfullscreenchange", r.onFs);
  try{ if(document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(() => {}); }catch(e){}
  reelUnlock();
  document.removeEventListener("visibilitychange", r.onVis);
  window.removeEventListener("pagehide", r.onHide);
}

async function openReel(startId, seq){
  let cleanStartId = startId || "", chapterId = "";
  if(cleanStartId.includes("?")){
    const parts = cleanStartId.split("?");
    cleanStartId = parts[0];
    const sp = new URLSearchParams(parts[1]);
    chapterId = sp.get("chapterId") || "";
  }
  const app = document.getElementById("app");
  document.body.classList.add("reel-open");
  app.innerHTML = reelShellHtml(`<div class="reel-loading" role="status" aria-label="Carregando"></div>`);
  app.querySelector('[data-act="back"]').onclick = reelBack;
  let plays = [];
  try{ plays = (await api("/plays?page=1&pageSize=100")).plays || []; }catch(e){ toast(e.message); }
  if(seq !== renderSeq) return;
  if(cleanStartId && !plays.some(p => p.id === cleanStartId)){      // novelinha fora das 100 mais recentes: busca só ela
    try{
      const d = await api("/plays/" + encodeURIComponent(cleanStartId) + (chapterId ? `?chapterId=${encodeURIComponent(chapterId)}` : ""));
      if(seq !== renderSeq) return;
      const itm = Object.assign({}, d.play, { canWatch: d.canWatch, hasVideo: !!d.play.videoUrl, videoUrl: undefined, chapterId, chaptersList: d.play.chaptersList });
      plays.unshift(itm);
    }catch(e){ if(seq !== renderSeq) return; toast("Novelinha não encontrada."); go("#/catalogo"); return; }
  } else if(cleanStartId && chapterId) {
    const existing = plays.find(p => p.id === cleanStartId);
    if(existing) existing.chapterId = chapterId;
  }
  const items = buildReelFeed(plays, cleanStartId);
  if(!items.length){ toast("Ainda não há novelinhas com vídeo para você assistir."); go("#/home"); return; }

  app.innerHTML = reelShellHtml(`
    <div class="reel-scroller" id="reel-scroller">${items.map(reelSlideHtml).join("")}${items.length > 1 ? reelEndHtml(items.length) : ""}</div>
    <div class="reel-nav"><button class="reel-btn" data-act="up" aria-label="Novelinha anterior">${REEL_ICO.up}</button><button class="reel-btn" data-act="down" aria-label="Próxima novelinha">${REEL_ICO.down}</button></div>
    <div class="reel-sheet" id="reel-sheet"></div>`);
  const root = document.getElementById("reel");
  let seen = false; try{ seen = !!localStorage.getItem("md_reel_hint_v1"); }catch(e){}
  if(items.length > 1 && !seen){
    root.insertAdjacentHTML("beforeend", `<div class="reel-hint" id="reel-hint">${REEL_ICO.up} Deslize para ver a próxima novelinha</div>`);
    try{ localStorage.setItem("md_reel_hint_v1", "1"); }catch(e){}
    setTimeout(() => { const h = document.getElementById("reel-hint"); if(h) h.classList.add("gone"); }, 4500);
  }
  const r = reel = {
    items, root, scroller: document.getElementById("reel-scroller"), sheet: document.getElementById("reel-sheet"),
    last: items.length > 1 ? items.length : 0, active: -1, token: 0, ctl: null, ctlIndex: -1, muted: false, details: new Map(), lastPos: new Map(), lastSave: 0, idleT: 0, io: null,
    onKey: reelOnKey, fsCss: false,
    onFs: () => { if(!reelNativeFs()) reelUnlock(); },                    // saiu da tela cheia (botão, gesto ou Esc): devolve a rotação
    onVis: () => { if(document.hidden && r.ctl){ const p = r.items[r.ctlIndex]; if(p) reelSave(r, p.id, r.ctl, true); } },
    onHide: () => { if(r.ctl){ const p = r.items[r.ctlIndex]; if(p) reelSave(r, p.id, r.ctl, true); } }
  };
  root.addEventListener("click", reelOnClick);
  ["mousemove", "pointerdown", "touchstart"].forEach(ev => root.addEventListener(ev, reelPoke, { passive: true }));
  document.addEventListener("keydown", r.onKey);
  document.addEventListener("fullscreenchange", r.onFs); document.addEventListener("webkitfullscreenchange", r.onFs);
  document.addEventListener("visibilitychange", r.onVis);
  window.addEventListener("pagehide", r.onHide);
  r.io = new IntersectionObserver((entries) => {
    entries.forEach(en => { if(en.isIntersecting && en.intersectionRatio >= 0.6) reelSetActive(Number(en.target.dataset.i)); });
  }, { root: r.scroller, threshold: [0.6] });
  r.scroller.querySelectorAll(".reel-slide").forEach(s => r.io.observe(s));
}

/* --------------------------- CHECKOUT PIX -------------------------------- */
// O navegador só PEDE o pagamento e ACOMPANHA o resultado. Quem decide se o plano é liberado é o
// servidor, depois de confirmar com a SyncPay — nada aqui consegue "forçar" a liberação.
let checkout = { plan: null, payment: null, timer: null, polls: 0 };

function maskCpf(v){ v = v.replace(/\D/g,"").slice(0,11); return v.replace(/(\d{3})(\d)/,"$1.$2").replace(/(\d{3})(\d)/,"$1.$2").replace(/(\d{3})(\d{1,2})$/,"$1-$2"); }
function maskPhone(v){ v = v.replace(/\D/g,"").slice(0,11); if(v.length>7) return v.replace(/(\d{2})(\d{5})(\d{0,4})/,"($1) $2-$3").replace(/-$/,""); if(v.length>2) return v.replace(/(\d{2})(\d+)/,"($1) $2"); return v; }

function checkoutBox(){
  let host = document.getElementById("checkout-modal");
  if(!host){
    host = document.createElement("div"); host.id = "checkout-modal"; host.className = "modal-overlay";
    host.innerHTML = `<div class="modal-box" id="checkout-box" style="max-width:440px;"></div>`;
    document.body.appendChild(host);
  }
  return host;
}
function openCheckout(planId){
  if(!currentUser()){ go("#/login"); return; }
  const plan = planById(planId);
  if(!plan || !(plan.price > 0)) return;
  stopPolling();
  checkout = { plan, payment: null, timer: null, polls: 0 };
  checkoutBox().classList.add("open");
  document.body.style.overflow = "hidden";
  renderCheckoutForm();
}
function closeCheckout(){
  const pending = checkout.payment && checkout.payment.status === "pending";
  stopPolling();
  const host = document.getElementById("checkout-modal");
  if(host) host.classList.remove("open");
  document.body.style.overflow = "";
  if(pending) toast("Se você já pagou o PIX, a confirmação chega sozinha em instantes.");
}
function stopPolling(){ if(checkout.timer){ clearTimeout(checkout.timer); checkout.timer = null; } }
function coHead(title){ return `<div class="modal-head"><h3>${title}</h3><button class="modal-close" onclick="closeCheckout()">&times;</button></div>`; }
function setCheckout(html){ document.getElementById("checkout-box").innerHTML = html; }

function renderCheckoutForm(errorMsg, vals){
  const p = checkout.plan; vals = vals || {};
  setCheckout(`${coHead("Assinar plano " + esc(p.name))}
    <div class="co-summary"><div><b>${esc(p.name)}</b><div style="font-size:12.5px; color:var(--ink-muted); margin-top:2px;">30 dias de acesso · pagamento por PIX</div></div><div class="co-price">${fmtMoney(p.price)}</div></div>
    <div class="form-msg error" id="co-msg" style="${errorMsg?'display:block':''}">${esc(errorMsg||"")}</div>
    <form id="co-form" autocomplete="on">
      <div class="field"><label>CPF</label><input name="cpf" inputmode="numeric" placeholder="000.000.000-00" required autocomplete="off" value="${esc(vals.cpf||"")}"></div>
      <div class="field"><label>Celular com DDD</label><input name="phone" inputmode="tel" placeholder="(63) 99999-9999" required autocomplete="tel" value="${esc(vals.phone||"")}"></div>
      <div class="field-hint" style="margin:-4px 0 16px;">O CPF é usado apenas para gerar a cobrança PIX. Não guardamos o número completo.</div>
      <button class="btn btn-gold btn-block" id="co-submit" type="submit">Gerar PIX de ${fmtMoney(p.price)}</button>
    </form>`);
  const f = qs("#co-form");
  f.cpf.addEventListener("input", ()=>{ f.cpf.value = maskCpf(f.cpf.value); });
  f.phone.addEventListener("input", ()=>{ f.phone.value = maskPhone(f.phone.value); });
  f.addEventListener("submit", submitCheckout);
}

async function submitCheckout(e){
  e.preventDefault();
  const f = e.target, btn = qs("#co-submit");
  btn.disabled = true; btn.textContent = "Gerando PIX...";
  try{
    const r = await api("/payments/checkout", { method:"POST", body:{ planId: checkout.plan.id, cpf: f.cpf.value, phone: f.phone.value } });
    checkout.payment = r.payment; checkout.polls = 0;
    renderPix(r);
    scheduleCheck(4000);
  }catch(err){
    renderCheckoutForm(err.message, { cpf: f.cpf.value, phone: f.phone.value });   // mantém o que a pessoa digitou
  }
}

function renderPix(r){
  setCheckout(`${coHead("Pague com PIX")}
    <div class="pix-box">
      <div class="co-summary" style="text-align:left;"><div><b>${esc(checkout.plan.name)}</b><div style="font-size:12.5px; color:var(--ink-muted);">30 dias de acesso</div></div><div class="co-price">${fmtMoney(r.payment.amount)}</div></div>
      <img class="qr" src="${r.qr}" alt="QR Code do PIX">
      <div class="pix-code" id="pix-code">${esc(r.pixCode)}</div>
      <button class="btn btn-gold btn-block" style="margin-top:12px;" onclick="copyPix()">Copiar código PIX</button>
      <ol class="pix-steps"><li>Abra o app do seu banco e escolha <b>Pix</b>.</li><li>Leia o QR Code ou use <b>Pix Copia e Cola</b>.</li><li>Confirme o pagamento. Esta tela atualiza sozinha!</li></ol>
      <div class="pix-wait"><span class="spinner" style="width:18px;height:18px;"></span><span id="pix-status">Aguardando o pagamento…</span></div>
      <div style="display:flex; gap:10px; margin-top:14px;">
        <button class="btn btn-ghost btn-sm" style="flex:1;" onclick="checkNow()">Já paguei, verificar</button>
        <button class="btn btn-danger btn-sm" onclick="cancelCheckout()">Cancelar</button>
      </div>
    </div>`);
}

async function copyPix(){
  const code = checkout.payment && qs("#pix-code") ? qs("#pix-code").textContent : "";
  try{ await navigator.clipboard.writeText(code); toast("Código PIX copiado! Cole no app do seu banco."); }
  catch(e){
    const r = document.createRange(); r.selectNodeContents(qs("#pix-code"));
    const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
    toast("Selecionamos o código — é só copiar.");
  }
}

function scheduleCheck(ms){
  stopPolling();
  checkout.timer = setTimeout(checkNow, ms);
}
async function checkNow(){
  if(!checkout.payment) return;
  stopPolling();
  checkout.polls++;
  try{
    const r = await api("/payments/" + checkout.payment.id);
    const st = r.payment.status;
    if(st === "paid"){ return onPaid(r.payment); }
    if(st === "expired" || st === "canceled"){
      return setCheckout(`${coHead("PIX expirado")}<div class="co-ok"><div class="big">⌛</div><h3>Este PIX não vale mais</h3><p style="color:var(--ink-muted); font-size:14px;">Sem problema — gere um novo e pague em menos de um minuto.</p><button class="btn btn-gold btn-block" style="margin-top:14px;" onclick="renderCheckoutForm()">Gerar novo PIX</button></div>`);
    }
  }catch(err){ /* falha momentânea de rede: tenta de novo no próximo ciclo */ }
  if(checkout.polls < 300) scheduleCheck(checkout.polls < 60 ? 5000 : 10000);
}
// Voltou do app do banco? Confere na hora, sem esperar o próximo ciclo.
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState === "visible" && checkout.payment && checkout.payment.status === "pending" && checkout.timer) checkNow(); });

async function onPaid(payment){
  stopPolling();
  checkout.payment = payment;
  await loadFresh().catch(()=>{});
  setCheckout(`${coHead("Pagamento confirmado")}<div class="co-ok"><div class="big">🎉</div><h3>Tudo certo! Plano ${esc(checkout.plan.name)} ativo</h3>
    <p style="color:var(--ink-muted); font-size:14px; line-height:1.6;">Seu acesso vale até <b style="color:var(--gold-soft);">${fmtDate(payment.validUntil)}</b>.<br>O comprovante fica em <b>Minha conta › Meus pagamentos</b>.</p>
    <button class="btn btn-gold btn-block" style="margin-top:14px;" onclick="closeCheckout(); go('#/catalogo'); render();">Ver as novelinhas</button></div>`);
}
async function cancelCheckout(){
  try{ if(checkout.payment) await api("/payments/" + checkout.payment.id + "/cancel", { method:"POST" }); }catch(e){}
  checkout.payment = null;
  closeCheckout();
  toast("Pagamento cancelado. Nada foi cobrado.");
}

// "Prova social" verdadeira: capas de novelinhas que existem de fato e quantas há para assistir (nada de números inventados).
function AuthProof(){
  const plays = (DB.plays || []).filter(p => p.posterUrl), total = DB.playsTotal || plays.length;
  if(!plays.length || !total) return "";
  const covers = shuffled(plays).slice(0, 4);
  return `<div class="auth-proof"><p><b>${total} ${total === 1 ? "novelinha" : "novelinhas"}</b> para assistir quando e onde quiser.</p>
    <div class="auth-covers" aria-hidden="true">${covers.map(c => `<img src="${esc(c.posterUrl)}" alt="" loading="lazy">`).join("")}</div></div>`;
}

function attachRecoveryEvents(){
  const msg = qs("#auth-msg");
  const show = (t, ok) => { msg.className = "form-msg " + (ok ? "ok" : "error"); msg.textContent = t; msg.style.display = "block"; };
  const ff = qs("#forgot-form");
  if(ff) ff.addEventListener("submit", async e=>{
    e.preventDefault();
    const btn = ff.querySelector("button"); btn.disabled = true; btn.textContent = "Enviando...";
    try{
      const r = await api("/auth/forgot-password", { method:"POST", body:{ email: ff.elements.email.value } });
      show(r.message, true);
      ff.style.display = "none";
    }catch(err){ show(err.message, false); btn.disabled = false; btn.textContent = "Enviar link por e-mail"; }
  });
  const rf = qs("#reset-form");
  if(rf) rf.addEventListener("submit", async e=>{
    e.preventDefault();
    if(rf.elements.password.value !== rf.elements.confirm.value){ show("As duas senhas não são iguais.", false); return; }
    const btn = rf.querySelector("button"); btn.disabled = true; btn.textContent = "Salvando...";
    try{
      await api("/auth/reset-password", { method:"POST", body:{ token: rf.dataset.token, newPassword: rf.elements.password.value } });
      clearToken(); DB.me = null; DB.mine = null; saveCache();      // por segurança, entra de novo com a senha nova
      toast("Senha alterada! Entre com a sua nova senha.");
      go("#/login");
    }catch(err){ show(err.message, false); btn.disabled = false; btn.textContent = "Salvar nova senha"; }
  });
}
function attachAuthEvents(){
  const loginForm = qs("#login-form");
  if(loginForm){
    loginForm.addEventListener("submit", async e=>{
      e.preventDefault();
      const fd = new FormData(loginForm);
      const msg = qs("#auth-msg"), btn = loginForm.querySelector("button[type=submit]");
      if(btn.disabled) return;
      btn.disabled = true; btn.textContent = "Entrando...";
      try{
        const r = await api("/auth/login", { method:"POST", body:{ email: fd.get("email"), password: fd.get("password") } });
        setToken(r.token); DB.me = r.user;
        await loadFresh().catch(()=>{});
        toast("Bem-vindo(a) de volta, " + r.user.name.split(" ")[0] + "!");
        go(r.user.role==="admin" ? "#/admin" : "#/home");
      }catch(err){ msg.textContent = err.message; msg.style.display="block"; btn.disabled = false; btn.textContent = "Entrar"; }
    });
  }
  const signupForm = qs("#signup-form");
  if(signupForm){
    signupForm.addEventListener("submit", async e=>{
      e.preventDefault();
      const fd = new FormData(signupForm);
      const msg = qs("#auth-msg"), btn = signupForm.querySelector("button[type=submit]");
      if(btn.disabled) return;
      btn.disabled = true; btn.textContent = "Criando conta...";
      try{
        const r = await api("/auth/signup", { method:"POST", body:{ name: fd.get("name"), email: fd.get("email"), password: fd.get("password") } });
        setToken(r.token); DB.me = r.user;
        await loadFresh().catch(()=>{});
        toast("Conta criada! Bem-vindo(a) ao " + SITE_NAME + " 📺");
        go("#/home");
      }catch(err){ msg.textContent = err.message; msg.style.display="block"; btn.disabled = false; btn.textContent = "Criar conta"; }
    });
  }
}

  return `<div class="page-wrap">
    <h1 class="page-title">Minha conta</h1><p class="page-sub">Olá, ${esc(user.name.split(" ")[0])}! Aqui você acompanha sua assinatura e seus dados.</p>

      <div class="acc-nav">

      <div>

          <h3>Assinatura</h3>

          <p style="color:var(--ink-muted); font-size:13.5px; margin-bottom:18px;">${free ? 'Plano gratuito, sem data de expiração. Assine para liberar o catálogo completo.' : (active ? 'Válido até ' + fmtDate(user.planExpiry) + '.' : 'Venceu em ' + fmtDate(user.planExpiry) + '. Renove para voltar a assistir tudo.')}</p>
          ${free && paidPlan ? `<button class="btn btn-gold btn-sm" onclick="go('#/planos')">Ver planos</button>`
            : (!free ? `<button class="btn ${active?'btn-ghost':'btn-gold'} btn-sm" onclick="openCheckout('${esc(user.plan)}')">${active ? 'Renovar +30 dias' : 'Reativar plano'}</button> <a href="#/planos" class="btn btn-ghost btn-sm">Trocar de plano</a>` : '')}
        </div>
        <div class="acc-card" style="margin-bottom:20px;">
          <h3>Meus pagamentos</h3>
          <div id="my-payments"><p style="color:var(--ink-faint); font-size:13.5px;">Carregando…</p></div>
        </div>
        <div class="acc-card" style="margin-bottom:20px;">
          <h3>E-mails</h3>
          <label class="checkbox-row"><input type="checkbox" id="opt-emails" ${user.emailOptOut ? '' : 'checked'}> Quero receber novidades e destaques do catálogo por e-mail</label>
          <p class="field-hint" style="margin-top:8px;">Avisos importantes (vencimento do plano e comprovantes de pagamento) continuam chegando sempre.</p>
        </div>
        <div class="acc-card">
          <h3>Alterar senha</h3>
          <div class="form-msg" id="pw-msg"></div>
          <form id="pw-form">
            <div class="field"><label>Senha atual</label><input type="password" name="current" required autocomplete="current-password"></div>
            <div class="field"><label>Nova senha (mínimo 8 caracteres)</label><input type="password" name="next" required minlength="8" autocomplete="new-password"></div>
            <button class="btn btn-ghost btn-sm" type="submit">Salvar nova senha</button>
          </form>
        </div>
      </div>
    </div>
  </div>`;
}
const PAY_LABEL = { paid:["Pago","badge-ok"], pending:["Aguardando","badge-warn"], expired:["Expirado","badge-neutral"], canceled:["Cancelado","badge-neutral"] };
async function attachAccountEvents(){
  const pf = qs("#pw-form");
  if(pf) pf.addEventListener("submit", async e=>{
    e.preventDefault();
    const msg = qs("#pw-msg");
    try{
      const r = await api("/auth/change-password", { method:"POST", body:{ currentPassword: pf.current.value, newPassword: pf.next.value } });
      if(r.token) setToken(r.token);   // os outros aparelhos são desconectados; este continua logado
      msg.className = "form-msg ok"; msg.textContent = "Senha alterada com sucesso."; msg.style.display = "block"; pf.reset();
    }catch(err){ msg.className = "form-msg error"; msg.textContent = err.message; msg.style.display = "block"; }
  });
  const opt = qs("#opt-emails");
  if(opt) opt.addEventListener("change", async ()=>{
    try{ const r = await api("/auth/preferences", { method:"PATCH", body:{ emailOptOut: !opt.checked } }); DB.me = r.user; saveCache(); toast(opt.checked ? "Pronto! Você vai receber as novidades." : "Tudo bem, paramos os e-mails de divulgação."); }
    catch(err){ opt.checked = !opt.checked; toast(err.message); }
  });
  try{
    const r = await api("/payments/mine");
    const box = qs("#my-payments"); if(!box) return;
    box.innerHTML = r.payments.length ? r.payments.map(p=>{ const [t,c] = PAY_LABEL[p.status] || [p.status,"badge-neutral"];
      return `<div class="pay-row"><span>${fmtDate(p.createdAt)} · ${esc(p.planName)}</span><span>${fmtMoney(p.amount)} <span class="badge ${c}" style="margin-left:6px;">${t}</span></span></div>`; }).join("")
      : `<p style="color:var(--ink-faint); font-size:13.5px;">Você ainda não fez nenhum pagamento.</p>`;
  }catch(e){ const box = qs("#my-payments"); if(box) box.innerHTML = `<p style="color:var(--ink-faint); font-size:13.5px;">Não foi possível carregar agora.</p>`; }
}

async function afterAdminRender(hash, seq){
  const section = hash.split("/")[2] || "";
  const main = qs("#admin-main");
  const stale = () => seq !== undefined && seq !== renderSeq;
  try{
    if(section==="novelinhas") { adminPlaysPage = 1; await loadAdminPlaysPage(); if(stale()) return; main.innerHTML = AdminPlays(); attachAdminPlaysEvents(); return; }
    if(section==="vorta") {
      const [st, cat] = await Promise.all([
        api("/vorta/status").catch(e => ({ error: e.message })),
        api("/vorta/categories").catch(() => ({ data: [] }))
      ]);
      if(stale()) return;
      main.innerHTML = AdminVorta(st, cat);
      attachAdminVortaEvents();
      return;
    }
    if(section==="usuarios") { await refreshUsers(); if(stale()) return; main.innerHTML = AdminUsers(); attachAdminUsersEvents(); return; }
    if(section==="generos") { adminGenres = (await api("/plays/admin/genres")).genres; if(stale()) return; main.innerHTML = AdminGenres(); return; }
    if(section==="planos") { await refreshPlans(); if(stale()) return; main.innerHTML = AdminPlans(); return; }
    if(section==="pagamentos") { await refreshPlans(); adminPayPage = 1; await loadAdminPayments(); if(stale()) return; main.innerHTML = AdminPayments(); return; }
    const [, , , pay] = await Promise.all([refreshPlays(), refreshUsers(), refreshPlans(), api("/payments/admin/list?page=1")]);
    if(stale()) return;
    DB.payStats = pay.last30;
    main.innerHTML = AdminDashboard();
  }catch(e){ if(!stale()) main.innerHTML = `<p style="color:var(--danger);">${esc(e.message)}</p>`; }
}

async function adminSendTestEmail(btn){
  const to = (qs("#test-email-to").value || "").trim();
  if(!to){ showSysOut("Digite no campo ao lado o e-mail onde você quer receber o teste."); return; }
  btn.disabled = true;
  try{ const r = await api("/email/test", { method:"POST", body:{ to } }); showSysOut(r.message); }
  catch(e){ showSysOut(e.message); }
  btn.disabled = false;
}
async function adminRunDaily(btn){
  btn.disabled = true;
  try{ const r = await api("/cron/run-now", { method:"POST" }); showSysOut(JSON.stringify(r, null, 2)); }
  catch(e){ showSysOut(e.message); }
  btn.disabled = false;
}
function showSysOut(t){ const el = qs("#sys-out"); if(el){ el.style.display = "block"; el.textContent = t; } }

// Envia o arquivo de vídeo escolhido direto para o Bunny.net Stream,
// sem passar pelo nosso próprio servidor (evita limites de tamanho/tempo
// do Render). Usa o protocolo TUS (upload retomável, aguenta arquivos grandes).
async function uploadVideoToBunny(){
  const fileInput = qs("#bunny-file-input");
  const progressEl = qs("#bunny-progress");
  const file = fileInput.files[0];
  if(!file){ toast("Escolha um arquivo de vídeo primeiro."); return; }
  if(!window.tus){ toast("Não foi possível carregar o enviador de vídeo. Recarregue a página."); return; }

  const titleField = qs('#play-form [name="title"]');
  const title = (titleField && titleField.value.trim()) || "Novelinha sem título";

  progressEl.style.display = "block";
  progressEl.textContent = "Preparando upload...";

  let prep;
  try{
    prep = await api("/bunny/create-upload", { method:"POST", body:{ title } });
  }catch(err){
    progressEl.textContent = "";
    toast(err.message);
    return;
  }

  const upload = new tus.Upload(file, {
    endpoint: "https://video.bunnycdn.com/tusupload",
    retryDelays: [0, 3000, 5000, 10000],
    headers: {
      AuthorizationSignature: prep.signature,
      AuthorizationExpire: String(prep.expiration),
      VideoId: prep.videoGuid,
      LibraryId: String(prep.libraryId)
    },
    metadata: { filetype: file.type, title: title },
    onError: function(error){
      progressEl.textContent = "Erro no upload: " + error.message;
      toast("Falha ao enviar o vídeo.");
    },
    onProgress: function(bytesUploaded, bytesTotal){
      const pct = ((bytesUploaded / bytesTotal) * 100).toFixed(1);
      progressEl.textContent = "Enviando... " + pct + "%";
    },
    onSuccess: function(){
      progressEl.textContent = "Upload concluído! O Bunny ainda vai processar o vídeo (alguns minutos) antes de ficar disponível.";
      const urlField = qs("#video-url-field");
      if(urlField) urlField.value = prep.playbackUrl;
      toast("Vídeo enviado! Clique em \"Salvar novelinha\" para confirmar.");
    }
  });
  upload.start();
}

let genreRows = null;

// Lê a planilha: coluna do nome + uma ou mais colunas de gênero (ou vários gêneros na mesma célula).
function parseGenreSheet(text){
  const rows = parseCsv(text);
  if(!rows.length) return [];
  const head = rows[0].map(h => normName(h).replace(/ /g, "_"));
  const nameKeys = ["nome", "titulo", "serie", "novelinha", "peca", "name"];   // "peca" continua valendo para planilhas antigas
  const isGenreCol = (h) => ["genero", "categoria", "genre"].some(k => h.startsWith(k));
  let iName = head.findIndex(h => nameKeys.includes(h));
  let iGen = head.map((h, i) => isGenreCol(h) ? i : -1).filter(i => i >= 0);
  const hasHeader = iName >= 0 || iGen.length > 0;
  if(iName < 0) iName = 0;
  if(!iGen.length) iGen = rows[0].map((_, i) => i).filter(i => i !== iName);   // sem cabeçalho: todas as outras colunas
  const out = [];
  for(const r of rows.slice(hasHeader ? 1 : 0)){
    const name = (r[iName] || "").trim();
    if(!name) continue;
    const genres = iGen.flatMap(i => String(r[i] || "").split(/[,;|\/+]/)).map(x => x.trim()).filter(Boolean);
    out.push({ name, genres });
  }
  return out;
}

function openGenresModal(){

// ---------- Cadastro em lote (vários vídeos de uma vez) ----------
let batchFiles = [];
let batchPlan = "balcao";

// ---------- Planilha de capas (CSV com as colunas "nome" e "url_capa") ----------
let coverMap = new Map();
let coverInfo = null;

// Compara nomes sem se importar com maiúsculas, acentos, "_", "-" ou pontuação.
function normName(str){
  return String(str || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase()
    .replace(/[_\-.]+/g, " ").replace(/[^a-z0-9 ]/g, "").replace(/\s+/g, " ").trim();
}

// Lê CSV (aceita vírgula, ponto e vírgula ou tab, aspas, BOM e quebras de linha do Windows).
function parseCsv(text){
  text = String(text).replace(/^\uFEFF/, "");
  const firstLine = text.split(/\r?\n/, 1)[0] || "";
  const count = (ch) => firstLine.split(ch).length - 1;
  const delim = count(";") > count(",") ? ";" : (count("\t") > count(",") ? "\t" : ",");
  const rows = []; let row = [], cur = "", inQ = false;
  const endRow = () => { row.push(cur); cur = ""; if(row.some(x => x.trim() !== "")) rows.push(row); row = []; };
  for(let i = 0; i < text.length; i++){
    const c = text[i];
    if(inQ){
      if(c === '"'){ if(text[i+1] === '"'){ cur += '"'; i++; } else inQ = false; }
      else cur += c;
    } else if(c === '"') inQ = true;
    else if(c === delim){ row.push(cur); cur = ""; }
    else if(c === "\n" || c === "\r"){ if(c === "\r" && text[i+1] === "\n") i++; endRow(); }
    else cur += c;
  }
  if(cur !== "" || row.length) endRow();
  return rows;
}

// Tipo do link de vídeo (só para mostrar na tela e avisar quando não vai tocar no player).
function videoKind(url){
  if(isHls(url)) return { label: "HLS (.m3u8)", ok: true };
  if(isYoutube(url)) return { label: "YouTube", ok: true };
  if(/\.(mp4|webm|ogv|ogg|mov|m4v)(\?|#|$)/i.test(url)) return { label: "vídeo direto", ok: true };
  if(/drive\.google\.com|docs\.google\.com|dropbox\.com|mediadelivery\.net\/(embed|play)|vimeo\.com/i.test(url))
    return { label: "página (não é arquivo de vídeo)", ok: false };
  return { label: "link", ok: true };   // pode ser um mp4 sem extensão na URL: deixa passar
}

// Transforma o CSV em { map, total, invalid, invalidVideo, duplicates }. Cada URL é conferida (só http/https).
// Colunas: nome, url_capa (a capa) e, opcionalmente, url_video (link direto do vídeo) e duracao (minutos).
function parseCoverCsv(text){
  const rows = parseCsv(text);
  const out = { map: new Map(), total: 0, invalid: [], invalidVideo: [], duplicates: [] };
  if(!rows.length) return out;
  const head = rows[0].map(h => normName(h).replace(/ /g, "_"));
  const find = (names) => head.findIndex(h => names.includes(h));
  const iNameH = find(["nome", "titulo", "name"]);
  const iUrlH = find(["url_capa", "capa"]);
  const iVidH = find(["url_video", "video", "link_video", "link_do_video", "url_do_video"]);
  const iDurH = find(["duracao", "duracao_min", "duracao_minutos", "minutos"]);
  const hasHeader = iNameH >= 0 || iUrlH >= 0 || iVidH >= 0;
  const iName = iNameH >= 0 ? iNameH : 0;
  const iUrl = iUrlH >= 0 ? iUrlH : 1;
  const iVid = hasHeader ? iVidH : 2;          // sem cabeçalho: nome;capa;video;duracao
  const iDur = hasHeader ? iDurH : 3;
  const cleanUrl = (raw) => {
    raw = (raw || "").trim();
    if(!raw) return "";
    try{
      const u = new URL(raw);
      if(u.protocol === "http:" || u.protocol === "https:") return u.href.replace(/'/g, "%27");  // espaços viram %20
    }catch(e){}
    return null;                               // preenchido, mas inválido
  };
  for(const r of rows.slice(hasHeader ? 1 : 0)){
    const name = (r[iName] || "").trim();
    const rawCover = (r[iUrl] || "").trim(), rawVideo = iVid >= 0 ? (r[iVid] || "").trim() : "";
    if(!name && !rawCover && !rawVideo) continue;
    out.total++;
    const cover = cleanUrl(rawCover), video = cleanUrl(rawVideo);
    const key = normName(name);
    if(!name || !key){ out.invalid.push(name || "(sem nome)"); continue; }
    if(video === null) out.invalidVideo.push(name);          // link de vídeo quebrado: a linha segue só com a capa
    const goodVideo = video || "";
    const goodCover = cover || "";
    if(!goodCover && !goodVideo){ out.invalid.push(name); continue; }   // nada aproveitável nesta linha
    if(out.map.has(key)){ out.duplicates.push(name); continue; }   // vale a primeira linha
    let minutes = 0;
    if(iDur >= 0){ const m = parseInt(String(r[iDur] || "").replace(/[^\d]/g, ""), 10); if(m > 0) minutes = m; }
    out.map.set(key, { name, url: goodCover, video: goodVideo, minutes });
  }
  return out;
}

// Acha a capa de um item do lote pelo título e (se for arquivo) pelo nome do arquivo.
function lookupCover(item){
  if(item.coverUrl) return item.coverUrl;                    // item criado direto pela planilha (url_video)
  if(!coverMap.size) return null;
  const keys = [normName(item.title)];
  if(item.file && item.file.name) keys.push(normName(item.file.name.replace(/\.[^.]+$/, "")));
  for(const k of keys){ if(k && coverMap.has(k) && coverMap.get(k).url) return coverMap.get(k).url; }
  return null;
}

// Excel em português costuma salvar CSV em Windows-1252: tenta UTF-8 e, se falhar, usa esse.
async function readTextFile(file){
  const buf = await file.arrayBuffer();
  try{ return new TextDecoder("utf-8", { fatal: true }).decode(buf); }
  catch(e){ return new TextDecoder("windows-1252").decode(buf); }
}

// Tira da lista os itens que vieram de uma planilha anterior (para poder trocar de planilha sem duplicar).
function dropCsvItems(){ batchFiles = batchFiles.filter(f => !f.csv); }

// Linhas da planilha com url_video viram novelinhas da lista (sem upload: só grava capa + link do vídeo).
function addCsvVideoItems(r){
  const skipped = [];
  const existing = new Set();
  batchFiles.forEach(f => { existing.add(normName(f.title)); if(f.file) existing.add(normName(f.file.name.replace(/\\.[^.]+$/, ""))); });
  let added = 0;
  for(const [key, e] of r.map.entries()){
    if(!e.video) continue;
    if(existing.has(key)){ skipped.push(e.name); continue; }   // já tem um vídeo na lista com esse nome: vale o da lista
    batchFiles.push({
      csv: true, csvKey: key, videoUrl: e.video, coverUrl: e.url || "", title: e.name,
      duration: Math.max(e.minutes || 60, 60),
      status: e.minutes ? "Pronto para cadastrar (link direto)" : "Pronto para cadastrar (link direto — ajuste a duração, não dá pra detectar de um link)"
    });
    added++;
  }
  return { added, skipped };
}

async function onBatchCsvChosen(e){
  const file = e.target.files[0];
  const info = qs("#batch-csv-info");
  dropCsvItems();
  if(!file){ coverMap = new Map(); coverInfo = null; renderBatchList(); updateBatchStartBtn(); return; }
  try{
    const r = parseCoverCsv(await readTextFile(file));
    coverMap = r.map; coverInfo = r;
    const withVideo = addCsvVideoItems(r);
    const nCovers = [...r.map.values()].filter(v => v.url).length;
    const extra = [];
    if(r.invalid.length) extra.push(`${r.invalid.length} linha(s) ignorada(s) por nome ou URL inválida: ${r.invalid.slice(0,3).map(esc).join(", ")}${r.invalid.length>3?"…":""}`);
    if(r.invalidVideo.length) extra.push(`${r.invalidVideo.length} link(s) de vídeo inválido(s) (precisa começar com http:// ou https://): ${r.invalidVideo.slice(0,3).map(esc).join(", ")}${r.invalidVideo.length>3?"…":""}`);
    if(r.duplicates.length) extra.push(`${r.duplicates.length} nome(s) repetido(s) (vale o primeiro): ${r.duplicates.slice(0,3).map(esc).join(", ")}${r.duplicates.length>3?"…":""}`);
    if(withVideo.skipped.length) extra.push(`${withVideo.skipped.length} nome(s) já têm vídeo na lista acima, então o link da planilha foi ignorado: ${withVideo.skipped.slice(0,3).map(esc).join(", ")}${withVideo.skipped.length>3?"…":""}`);
    const bad = batchFiles.filter(f => f.csv && !videoKind(f.videoUrl).ok).length;
    if(bad) extra.push(`${bad} link(s) de vídeo apontam para uma página (Drive, Dropbox, Vimeo…) e <b>não vão tocar</b> no player. Use o .m3u8, um .mp4 direto ou YouTube — ou o campo de links do Google Drive acima.`);
    info.innerHTML = `<b style="color:var(--gold-soft);">✔ ${nCovers} capa(s) e ${withVideo.added} vídeo(s) por link direto carregados.</b>${extra.length ? "<br>⚠ " + extra.join("<br>⚠ ") : ""}`;
  }catch(err){
    coverMap = new Map(); coverInfo = null;
    info.textContent = "Não consegui ler esse arquivo. Salve como CSV (separado por vírgula ou ponto e vírgula) com as colunas nome, url_capa e url_video.";
  }
  renderBatchList();
  updateBatchStartBtn();
}

function onBatchLinksSubmit(){
  const raw = qs("#batch-links-input").value;
  const lines = raw.split("\n").map(l=>l.trim()).filter(Boolean);
  for(const line of lines){
    const parts = line.split("|");
    let title, url;
    if(parts.length >= 2){ title = parts[0].trim(); url = parts.slice(1).join("|").trim(); }
    else { title = "Novelinha sem título"; url = line.trim(); }
    if(!url) continue;
    batchFiles.push({ driveUrl: url, title, duration: 60, status: "Pronto para importar (ajuste a duração — não dá pra detectar de um link)" });
  }
  qs("#batch-links-input").value = "";
  renderBatchList();
  qs("#batch-start-btn").style.display = batchFiles.length ? "inline-block" : "none";
}

async function onBatchFilesChosen(e){
  const files = Array.from(e.target.files || []);
  const listEl = qs("#batch-list");
  listEl.textContent = "Detectando a duração dos vídeos...";
  for(const file of files){
    const minutes = await detectVideoDuration(file);
    batchFiles.push({ file, title: titleFromFilename(file.name), duration: Math.max(minutes || 60, 60), status: "Pronto para enviar" });
  }
  renderBatchList();
  qs("#batch-start-btn").style.display = batchFiles.length ? "inline-block" : "none";
}

function sleep(ms){ return new Promise(r=>setTimeout(r, ms)); }

function renderBatchList(){

    const matched = batchFiles.filter(f => lookupCover(f)).length;
    const used = new Set(batchFiles.map(f => normName(f.title)).concat(batchFiles.filter(f => f.csvKey).map(f => f.csvKey)).concat(batchFiles.filter(f => f.file).map(f => normName(f.file.name.replace(/\.[^.]+$/, "")))));
    const unused = [...coverMap.entries()].filter(([k]) => !used.has(k)).map(([, v]) => v.name);
    summary = `<div class="field-hint" style="margin:0;"><b>${matched} de ${batchFiles.length}</b> vídeo(s) com capa encontrada na planilha.${unused.length ? `<br>Capas da planilha sem vídeo nesta lista: ${unused.slice(0,5).map(esc).join(", ")}${unused.length>5?` e mais ${unused.length-5}`:""}.` : ""}</div>`;
  }
  qs("#batch-list").innerHTML = summary + batchFiles.map((f,i)=>{
    const cover = lookupCover(f);
    const coverLine = coverMap.size
      ? (cover ? `<div style="display:flex; align-items:center; gap:8px; margin-top:6px; font-size:12px; color:var(--gold-soft);"><img src="${esc(cover)}" alt="" style="height:46px; border-radius:3px; background:var(--bg-elev-2);"> capa encontrada na planilha</div>`
               : `<div style="margin-top:6px; font-size:12px; color:#E8938C;">⚠ sem capa na planilha para este nome (vai com uma imagem padrão; dá pra trocar depois)</div>`)
      : "";
    return `
    <div style="border:1px solid var(--line); border-radius:4px; padding:10px;">
      <div style="font-size:11px; color:var(--ink-faint); margin-bottom:6px; word-break:break-all;">${f.file ? "📁 arquivo: " + esc(f.file.name) : f.videoUrl ? "🎬 vídeo por link direto (" + esc(videoKind(f.videoUrl).label) + "): " + esc(f.videoUrl) : "🔗 link (" + esc(f.driveUrl) + ")"}</div>
      ${f.videoUrl && !videoKind(f.videoUrl).ok ? `<div style="margin-bottom:6px; font-size:12px; color:#E8938C;">⚠ este link é uma página, não o arquivo do vídeo — não vai tocar no player.</div>` : ""}
      <div class="form-grid-2">
        <div class="field" style="margin-bottom:6px;"><label>Título</label><input type="text" value="${esc(f.title)}" onchange="batchFiles[${i}].title=this.value; renderBatchList()"></div>
        <div class="field" style="margin-bottom:0;"><label>Duração (min)</label><input type="number" min="60" value="${f.duration}" onchange="batchFiles[${i}].duration=parseInt(this.value,10)||60"></div>

    </div>`;
  }).join("");
}

async function processBatchItem(i){
  const item = batchFiles[i];
  const setStatus = (txt) => { const el = qs("#batch-status-"+i); if(el) el.textContent = txt; };
  try{
    setStatus("Criando novelinha...");
    const created = await api("/plays", { method:"POST", body:{
      title: item.title, genres: guessGenres(item.title), releaseYear: new Date().getFullYear(),
      durationMinutes: item.duration, requiresPlan: batchPlan,
      synopsis: ".",
      director: "", cast: "",
      posterUrl: lookupCover(item) || "https://images.unsplash.com/photo-1503095396549-807759245b35?q=80&w=800&auto=format&fit=crop",
      backdropUrl: "",
      videoUrl: item.videoUrl || "", featured: false
    }});
    const playId = created.play.id;

    if(item.file){
      // Arquivo local: sobe direto do navegador pro Bunny via TUS.
      setStatus("Preparando envio do vídeo...");
      const prep = await api("/bunny/create-upload", { method:"POST", body:{ title: item.title } });
      await new Promise((resolve, reject)=>{
        const upload = new tus.Upload(item.file, {
          endpoint: "https://video.bunnycdn.com/tusupload",
          retryDelays: [0, 3000, 5000, 10000],
          headers: {
            AuthorizationSignature: prep.signature, AuthorizationExpire: String(prep.expiration),
            VideoId: prep.videoGuid, LibraryId: String(prep.libraryId)
          },
          metadata: { filetype: item.file.type, title: item.title },
          onError: (err) => { setStatus("Erro no envio: " + err.message); reject(err); },
          onProgress: (up, total) => setStatus("Enviando vídeo... " + ((up/total)*100).toFixed(0) + "%"),
          onSuccess: () => resolve()
        });
        upload.start();
      });
      await api("/plays/" + playId, { method:"PUT", body:{ videoUrl: prep.playbackUrl } });
      setStatus("✔ Concluído — edite a novelinha depois para completar gênero, sinopse etc.");
    } else if(item.driveUrl){
      // Link (Google Drive etc.): o Bunny busca sozinho, servidor-a-servidor.
      setStatus("Pedindo para o Bunny buscar o vídeo...");
      const prep = await api("/bunny/fetch-from-url", { method:"POST", body:{ url: item.driveUrl, title: item.title } });
      setStatus("Aguardando o Bunny confirmar...");
      let found = null;
      for(let attempt=0; attempt<20; attempt++){
        await sleep(4000);
        try{
          const r = await api("/bunny/resolve?marker=" + encodeURIComponent(prep.marker));
          if(r.found){ found = r; break; }
        }catch(e){ /* tenta de novo */ }
        setStatus("Aguardando o Bunny confirmar... (tentativa " + (attempt+1) + "/20)");
      }
      if(!found){
        setStatus("Não localizei a confirmação a tempo. Confira no painel do Bunny e cole a URL manualmente na novelinha, se precisar.");
        return;
      }
      await api("/plays/" + playId, { method:"PUT", body:{ videoUrl: found.playbackUrl } });
      setStatus("✔ Importação iniciada — o Bunny ainda está baixando/processando em segundo plano.");
    } else if(item.videoUrl){
      // Link direto (da planilha): o vídeo já está hospedado, então a novelinha já foi criada com ele.
      setStatus("✔ Concluído — capa e vídeo gravados direto do link. Edite a novelinha depois para completar sinopse e elenco.");
    } else {
      setStatus("Nada para enviar (nem arquivo nem link).");
    }
  }catch(err){
    setStatus("Erro: " + (err.message || "falhou ao processar este item."));
  }
}

// Pede pro Bunny buscar o vídeo direto de um link (Google Drive etc.) — muito
// mais rápido que enviar do navegador, porque a transferência é servidor-a-servidor.
async function importVideoFromUrl(){
  const urlInput = qs("#import-url-input");
  const progressEl = qs("#bunny-progress");
  const url = urlInput.value.trim();
  if(!url){ toast("Cole um link primeiro."); return; }
  const titleField = qs('#play-form [name="title"]');
  const title = (titleField && titleField.value.trim()) || "Novelinha sem título";

  progressEl.style.display = "block";
  progressEl.textContent = "Pedindo para o Bunny buscar o vídeo...";

  let prep;
  try{
    prep = await api("/bunny/fetch-from-url", { method:"POST", body:{ url, title } });
  }catch(err){
    progressEl.textContent = "";
    toast(err.message);
    return;
  }

  progressEl.textContent = "Bunny está buscando o vídeo. Aguardando confirmação (pode levar um pouco)...";
  let tries = 0;
  const poll = async () => {
    tries++;
    try{
      const r = await api("/bunny/resolve?marker=" + encodeURIComponent(prep.marker));
      if(r.found){
        qs("#video-url-field").value = r.playbackUrl;
        progressEl.textContent = "Importação iniciada! O Bunny ainda vai processar o vídeo (alguns minutos) antes de ficar disponível.";
        toast("Vídeo importado! Clique em \"Salvar novelinha\" para confirmar.");
        return;
      }
    }catch(e){ /* tenta de novo */ }
    if(tries >= 20){
      progressEl.textContent = "Ainda não localizei o vídeo importado. Ele pode estar demorando mais — confira no painel do Bunny.net, ou tente salvar a novelinha e colar a URL manualmente depois.";
      return;
    }
    setTimeout(poll, 4000);
  };
  poll();
}

let swUpdateReady = false;
function registerServiceWorker(){
  if("serviceWorker" in navigator){

    // Saiu versão nova do site: marca para recarregar na PRÓXIMA navegação (nunca no meio de um formulário).
    navigator.serviceWorker.addEventListener("controllerchange", ()=>{ if(hadController) swUpdateReady = true; });
    window.addEventListener("load", ()=>{ navigator.serviceWorker.register("/sw.js").catch(()=>{}); });
  }
}

function isMobileUA(){ return isIos() || /android|mobile/i.test(navigator.userAgent); }

// Qual convite mostrar: "button" (Android/Chrome, com o aviso nativo), "ios" (ensina o Compartilhar) ou

function installBannerMode(st){
  if(st.standalone || st.inApp) return null;
  if(st.dismissedAt && st.now - st.dismissedAt < INSTALL_SNOOZE_MS) return null;
  if(st.hasPrompt) return "button";
  if(st.ios) return "ios";
  return st.mobile ? "manual" : null;
}
function currentInstallMode(){
  let dismissedAt = 0; try{ dismissedAt = parseInt(localStorage.getItem("md_install_dismissed"), 10) || 0; }catch(e){}
  return installBannerMode({ standalone: isStandalone(), inApp: isInAppBrowser(), dismissedAt, now: Date.now(), hasPrompt: !!deferredInstall, ios: isIos(), mobile: isMobileUA() });
}

// Instala (Android/Chrome/Edge/PC) ou ensina o caminho (iPhone e navegadores sem botão automático).
async function promptInstall(){
  if(isStandalone()){ toast("O app já está instalado neste aparelho."); return; }
  if(deferredInstall){
    deferredInstall.prompt();
    const choice = await deferredInstall.userChoice.catch(()=>null);
    deferredInstall = null; removeInstallBanner();
    if(choice && choice.outcome !== "accepted") try{ localStorage.setItem("md_install_dismissed", String(Date.now())); }catch(e){}
    return;
  }
  if(isInAppBrowser()){ toast("Abra o site no Chrome ou no Safari para instalar o app."); return; }
  if(isIos()){ showInstallBanner("ios"); return; }
  if(isMobileUA()){ showInstallBanner("manual"); return; }
  toast("No menu do navegador, escolha “Instalar app” ou “Adicionar à tela inicial”.");
}

function showInstallBanner(mode){
  if(document.getElementById("install-banner")) return;
  const text = {
    button: 'Acesso direto da tela inicial, abre mais rápido e em tela cheia.',
    ios: 'Toque em <b>Compartilhar</b> <span aria-hidden="true">⬆️</span> e depois em <b>“Adicionar à Tela de Início”</b>.',
    manual: 'Abra o menu <b>⋮</b> do navegador e toque em <b>“Instalar app”</b> ou <b>“Adicionar à tela inicial”</b>.'
  }[mode] || "";
  const b = document.createElement("div");
  b.id = "install-banner"; b.className = "install-banner"; b.dataset.mode = mode;
  b.innerHTML = `<img src="/icons/icon-192.png" alt="">
    <div class="ib-text">
      <p class="ib-title">Instale o app ${esc(SITE_NAME)}</p>
      <p class="ib-sub">${text}</p>
      ${mode === "button" ? '<button class="btn btn-gold btn-sm" style="margin-top:8px;" onclick="promptInstall()">Instalar app</button>' : ''}
    </div>
    <button class="ib-close" aria-label="Fechar" onclick="dismissInstallBanner()">&times;</button>`;
  document.body.appendChild(b);
}
// Reavalia o convite sempre que algo muda (passou o tempo, o navegador liberou a instalação, trocou de tela).
function refreshInstallBanner(){
  if(!installReady || reel || conv.state === "main") return;           // nunca por cima do StoryReel nem do pop-up de assinatura
  const mode = currentInstallMode(), cur = document.getElementById("install-banner");
  if(!mode || (cur && cur.dataset.mode === mode)) return;
  if(cur) cur.remove();
  showInstallBanner(mode);
}
// O convite aparece alguns segundos depois de abrir (sem atrapalhar) e volta no máximo a cada 3 dias.
function scheduleInstallBanner(){
  if(installTimer || isStandalone()) return;
  installTimer = setTimeout(()=>{ installReady = true; refreshInstallBanner(); }, INSTALL_DELAY_MS);
}
</script>
