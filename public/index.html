<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mini Drama — novelinhas sem limite</title>
<meta name="description" content="novelinhas sem limite">
<meta name="theme-color" content="#120D0F">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mini Drama">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700;800&display=swap"></noscript>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.css">
<script defer src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/tus-js-client@4.1.0/dist/tus.min.js"></script>
<style>
:root{
  --bg:#120D0F; --bg-elev:#1B1417; --bg-elev-2:#241B1E;
  --curtain:#7A1F2E; --curtain-2:#9C2C3E;
  --gold:#C9A24B; --gold-soft:#E4CE95;
  --ink:#F4ECE3; --ink-muted:#B9A9A0; --ink-faint:#8A7A72;
  --line:rgba(244,236,227,0.10);
  --danger:#C4453C; --ok:#5C8A5A;
  --radius:3px; --radius-lg:6px;
  --shadow-deep:0 24px 60px rgba(0,0,0,0.55);
  --font-display:'Fraunces', Georgia, serif;
  --font-body:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--bg); color:var(--ink); font-family:var(--font-body); min-height:100vh; -webkit-font-smoothing:antialiased;}
img{max-width:100%; display:block;}
a{color:inherit; text-decoration:none;}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit;}
::-webkit-scrollbar{height:8px; width:8px;}
::-webkit-scrollbar-thumb{background:var(--line); border-radius:4px;}
.container{max-width:1240px; margin:0 auto; padding:0 28px;}
@media (max-width:640px){.container{padding:0 16px;}}

.site-header{position:sticky; top:0; z-index:60; display:flex; align-items:center; justify-content:space-between; padding:16px 28px; gap:24px; background:linear-gradient(180deg, rgba(9,6,7,0.92), rgba(9,6,7,0.55) 80%, transparent); backdrop-filter:blur(6px);}
.site-header.solid{background:var(--bg); box-shadow:0 1px 0 var(--line);}
@media (max-width:640px){.site-header{padding:14px 16px;}}
.brand{display:flex; align-items:baseline; gap:6px; font-family:var(--font-display); font-weight:700; font-size:23px; letter-spacing:.2px; flex-shrink:0;}
.brand .dot{width:7px; height:7px; border-radius:50%; background:var(--curtain-2); margin-left:1px;}
.btn{border:none; border-radius:var(--radius); padding:10px 20px; font-size:14px; font-weight:600; letter-spacing:.2px; transition:transform .12s ease, opacity .15s;}
.btn:active{transform:scale(0.97);}
.btn:disabled{opacity:.5; cursor:default;}
.btn-gold{background:var(--gold); color:#241708;}
.btn-gold:hover{background:var(--gold-soft);}
.btn-ghost{background:transparent; color:var(--ink); border:1px solid var(--line);}
.btn-ghost:hover{border-color:var(--ink-muted);}
.btn-danger{background:transparent; color:var(--danger); border:1px solid rgba(196,69,60,.4);}
.btn-danger:hover{background:rgba(196,69,60,.1);}
.btn-block{width:100%;}
.btn-sm{padding:7px 14px; font-size:13px;}

.hero{position:relative; height:74vh; min-height:460px; max-height:720px; overflow:hidden;}
.hero-slide{position:absolute; inset:0; opacity:0; transition:opacity .9s ease; background-size:cover; background-position:center 20%;}
.hero-slide.active{opacity:1;}
.hero-slide::after{content:""; position:absolute; inset:0; background:linear-gradient(0deg, var(--bg) 4%, rgba(18,13,15,0.15) 45%, rgba(18,13,15,0.55) 100%), linear-gradient(90deg, rgba(18,13,15,0.85) 0%, rgba(18,13,15,0.15) 55%);}
.hero-content{position:absolute; left:0; bottom:9%; padding:0 28px; max-width:640px; z-index:2;}
@media (max-width:640px){.hero-content{padding:0 16px; bottom:7%;}}
.hero-eyebrow{display:flex; align-items:center; gap:8px; color:var(--gold-soft); font-size:13px; font-weight:600; margin-bottom:14px;}
.hero-eyebrow .dot{width:6px; height:6px; border-radius:50%; background:var(--curtain-2);}
.hero-title{font-family:var(--font-display); font-size:clamp(32px,5.2vw,58px); line-height:1.02; font-weight:700; margin:0 0 16px;}
.hero-desc{color:var(--ink-muted); font-size:15.5px; line-height:1.6; margin:0 0 22px; max-width:520px;}
.hero-meta{display:flex; gap:14px; align-items:center; color:var(--ink-muted); font-size:13.5px; margin-bottom:22px; flex-wrap:wrap;}
.hero-meta span{display:flex; align-items:center; gap:6px;}
.hero-actions{display:flex; gap:12px; flex-wrap:wrap;}
.hero-dots{position:absolute; right:28px; bottom:9%; z-index:3; display:flex; flex-direction:column; gap:8px;}
@media (max-width:640px){.hero-dots{display:none;}}
.hero-dots button{width:26px; height:3px; border:none; background:var(--line); padding:0;}
.hero-dots button.active{background:var(--gold);}

.section-row{margin:44px 0;}
.section-row-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:16px;}
.section-title{font-family:var(--font-display); font-size:22px; font-weight:600; margin:0;}
.section-link{font-size:13px; color:var(--ink-muted);}
.section-link:hover{color:var(--gold);}
.rail{display:flex; gap:16px; overflow-x:auto; padding-bottom:10px; scroll-snap-type:x proximity;}
.rail::-webkit-scrollbar{display:none;}
.card{flex:0 0 210px; scroll-snap-align:start; cursor:pointer; position:relative; border-radius:var(--radius-lg); overflow:hidden; background:var(--bg-elev); border:1px solid var(--line); transition:border-color .18s, transform .18s;}
@media (max-width:640px){.card{flex-basis:150px;}}
.card:hover{border-color:var(--gold); transform:translateY(-3px);}
.card-poster{width:100%; aspect-ratio:2/3; object-fit:cover; background:var(--bg-elev-2);}
.card-body{padding:10px 12px 12px;}
.card-title{font-size:13.5px; font-weight:600; margin:0 0 4px; line-height:1.3; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.card-sub{font-size:11.5px; color:var(--ink-faint); display:flex; justify-content:space-between; gap:6px;}
.card-badge{position:absolute; top:8px; left:8px; background:var(--curtain); color:#fff; font-size:10px; font-weight:700; padding:3px 8px; border-radius:2px; letter-spacing:.3px;}
.card-lock{position:absolute; top:8px; right:8px; width:24px; height:24px; border-radius:50%; background:rgba(9,6,7,.7); display:flex; align-items:center; justify-content:center;}
.genre-filters{display:flex; gap:8px; overflow-x:auto; margin-bottom:22px; padding-bottom:2px;}
.genre-filters::-webkit-scrollbar{display:none;}
.chip{flex:0 0 auto; padding:8px 16px; border-radius:20px; border:1px solid var(--line); font-size:13px; color:var(--ink-muted); white-space:nowrap; background:none;}
.chip.active{background:var(--ink); color:var(--bg); border-color:var(--ink);}

.site-footer{border-top:1px solid var(--line); margin-top:80px; padding:44px 28px 130px; color:var(--ink-faint); font-size:13px;}
.footer-grid{display:grid; grid-template-columns:1.4fr 1fr 1fr 1fr; gap:28px; max-width:1240px; margin:0 auto 28px;}
@media (max-width:760px){.footer-grid{grid-template-columns:1fr 1fr;}}
.footer-grid h4{font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-muted); margin:0 0 12px; font-weight:600;}
.footer-grid a{display:block; margin-bottom:8px; color:var(--ink-faint);}
.footer-grid a:hover{color:var(--ink);}
.footer-bottom{max-width:1240px; margin:0 auto; border-top:1px solid var(--line); padding-top:20px;}

.auth-wrap{min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:calc(40px + env(safe-area-inset-top,0px)) 20px calc(40px + env(safe-area-inset-bottom,0px)); position:relative; overflow:hidden; background:#121212;}
.auth-wrap::before{content:""; position:absolute; inset:0; background:radial-gradient(ellipse at top, rgba(122,31,46,.22), transparent 62%); pointer-events:none;}
.auth-card{position:relative; z-index:1; width:100%; max-width:24rem; display:flex; flex-direction:column; align-items:center; padding:2rem; border-radius:1.5rem; background:linear-gradient(to right, rgba(255,255,255,.063), #121212); -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px); box-shadow:0 25px 50px -12px rgba(0,0,0,.55);}
.auth-card form{width:100%; display:flex; flex-direction:column; gap:.75rem;}
.auth-logo{display:flex; align-items:center; justify-content:center; width:3rem; height:3rem; border-radius:50%; background:rgba(255,255,255,.2); margin-bottom:1.5rem; box-shadow:0 10px 15px -3px rgba(0,0,0,.35); overflow:hidden;}
.auth-logo img{width:100%; height:100%; object-fit:cover; display:block;}
.auth-brand{text-align:center; font-family:var(--font-display); font-size:1.5rem; font-weight:600; color:#fff; margin:0 0 .5rem;}
.auth-sub{text-align:center; color:#9ca3af; font-size:.875rem; line-height:1.55; margin:0 0 1.5rem;}
.auth-input{width:100%; padding:.75rem 1.25rem; border:none; border-radius:.75rem; background:rgba(255,255,255,.1); color:#fff; font:inherit; font-size:.875rem; outline:none;}
.auth-input::placeholder{color:#d1d5db;}
.auth-input:focus{box-shadow:0 0 0 2px #9ca3af;}
.auth-hr{width:100%; border:none; border-top:1px solid rgba(255,255,255,.1); margin:.25rem 0;}
.auth-actions{width:100%; display:flex; flex-direction:column; gap:.75rem;}
.auth-btn{display:flex; align-items:center; justify-content:center; width:100%; padding:.75rem 1.25rem; border:none; border-radius:999px; font:inherit; font-size:.875rem; font-weight:500; color:#fff; box-shadow:0 1px 3px rgba(0,0,0,.4); transition:background .15s, filter .15s; cursor:pointer;}
.auth-btn-primary{background:rgba(255,255,255,.1);}
.auth-btn-primary:hover{background:rgba(255,255,255,.2);}
.auth-btn-secondary{background:linear-gradient(to bottom, #232526, #2d2e30);}
.auth-btn-secondary:hover{filter:brightness(1.1);}
.auth-btn:disabled{opacity:.6; cursor:default;}
.auth-btn:focus-visible, .auth-input:focus-visible, .auth-foot a:focus-visible{outline:2px solid #d1d5db; outline-offset:2px;}
.auth-foot{text-align:center; margin:.25rem 0 0; font-size:.75rem; color:#9ca3af; width:100%;}
.auth-foot a{color:rgba(255,255,255,.8); text-decoration:underline;}
.auth-foot a:hover{color:#fff;}
.auth-card .form-msg.error{background:none; border:none; padding:0; margin:0; color:#f87171; font-size:.875rem; text-align:left; width:100%;}
.auth-card .form-msg.ok{width:100%; margin:0 0 .75rem;}
.auth-card .field{margin:0; text-align:left; width:100%;}
.auth-card .field label{color:#9ca3af; font-weight:500; font-size:.75rem; margin:0 0 .35rem .25rem;}
.auth-card .field input{padding:.75rem 1.25rem; border:none; border-radius:.75rem; background:rgba(255,255,255,.1); color:#fff; font-size:.875rem;}
.auth-card .field input:focus{box-shadow:0 0 0 2px #9ca3af;}
.auth-proof{position:relative; z-index:1; margin-top:3rem; display:flex; flex-direction:column; align-items:center; text-align:center;}
.auth-proof p{color:#9ca3af; font-size:.875rem; margin:0 0 .5rem;}
.auth-proof p b{color:#fff; font-weight:500;}
.auth-covers{display:flex;}
.auth-covers img{width:2rem; height:2rem; border-radius:50%; border:2px solid #181824; object-fit:cover; background:var(--bg-elev-2);}
@media (max-width:640px){ .auth-input, .auth-card .field input{font-size:16px;} }   /* 16px evita o zoom automático do iPhone ao tocar no campo */
.field{margin-bottom:16px;}
.field label{display:block; font-size:12.5px; font-weight:600; color:var(--ink-muted); margin-bottom:6px;}
.field input, .field select, .field textarea{width:100%; background:var(--bg-elev-2); border:1px solid var(--line); color:var(--ink); padding:11px 13px; border-radius:var(--radius); font-size:14px; outline:none;}
.field input:focus, .field select:focus, .field textarea:focus{border-color:var(--gold);}
.field-hint{color:var(--ink-faint); font-size:11.5px; margin-top:5px;}
.form-msg{padding:10px 12px; border-radius:var(--radius); font-size:13px; margin-bottom:16px; display:none;}
.form-msg:empty{display:none !important;}
.genre-checks{display:grid; grid-template-columns:repeat(2,1fr); gap:9px 14px; background:var(--bg-elev-2); border:1px solid var(--line); border-radius:var(--radius); padding:12px 14px;}
@media (max-width:480px){.genre-checks{grid-template-columns:1fr;}}
.form-msg.error{display:block; background:rgba(196,69,60,.12); color:#E8938C; border:1px solid rgba(196,69,60,.3);}
.form-msg.ok{display:block; background:rgba(92,138,90,.14); color:#9CC79A; border:1px solid rgba(92,138,90,.3);}
.demo-note{background:var(--bg-elev-2); border:1px dashed var(--line); border-radius:var(--radius); padding:10px 12px; font-size:11.5px; color:var(--ink-faint); margin-top:18px; line-height:1.5;}

.plans-hero{text-align:center; padding:64px 20px 20px;}
.plans-hero h1{font-family:var(--font-display); font-size:clamp(30px,4.4vw,46px); margin:0 0 12px;}
.plans-hero p{color:var(--ink-muted); max-width:520px; margin:0 auto; font-size:15px;}
.plans-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:20px; max-width:1080px; margin:44px auto; padding:0 20px;}
@media (max-width:860px){.plans-grid{grid-template-columns:1fr; max-width:420px;}}
.plan-card{background:var(--bg-elev); border:1px solid var(--line); border-radius:var(--radius-lg); padding:30px 26px; display:flex; flex-direction:column; position:relative;}
.plan-card.featured{border-color:var(--gold); background:linear-gradient(180deg, rgba(201,162,75,.08), var(--bg-elev) 40%);}
.plan-tag{position:absolute; top:-12px; left:26px; background:var(--gold); color:#241708; font-size:11px; font-weight:700; padding:4px 10px; border-radius:2px;}
.plan-name{font-family:var(--font-display); font-size:21px; font-weight:600; margin:0 0 6px;}
.plan-price{font-size:34px; font-weight:700; margin:0 0 4px;}
.plan-price span{font-size:14px; font-weight:500; color:var(--ink-muted);}
.plan-period{color:var(--ink-faint); font-size:12.5px; margin-bottom:22px;}
.plan-benefits{list-style:none; padding:0; margin:0 0 26px; flex:1;}
.plan-benefits li{display:flex; gap:10px; align-items:flex-start; font-size:13.5px; color:var(--ink-muted); margin-bottom:11px; line-height:1.4;}
.plan-benefits li svg{flex-shrink:0; margin-top:2px; color:var(--gold);}
.plans-faq{max-width:720px; margin:60px auto 0; padding:0 20px;}
.faq-item{border-bottom:1px solid var(--line); padding:18px 0;}
.faq-item summary{cursor:pointer; font-weight:600; font-size:14.5px; list-style:none;}
.faq-item summary::-webkit-details-marker{display:none;}
.faq-item p{color:var(--ink-muted); font-size:13.5px; margin:10px 0 0; line-height:1.6;}

.detail-hero{position:relative; height:56vh; min-height:380px; background-size:cover; background-position:center;}
.detail-hero::after{content:""; position:absolute; inset:0; background:linear-gradient(0deg, var(--bg), rgba(18,13,15,.2) 60%);}
.detail-back{position:absolute; top:20px; left:20px; z-index:2;}
.detail-wrap{max-width:900px; margin:-90px auto 60px; position:relative; z-index:2; padding:0 24px;}
@media (max-width:640px){.detail-wrap{margin-top:-60px; padding:0 16px;}}
.detail-title{font-family:var(--font-display); font-size:clamp(26px,4vw,40px); font-weight:700; margin:0 0 10px;}
.detail-meta{display:flex; gap:14px; flex-wrap:wrap; color:var(--ink-muted); font-size:13.5px; margin-bottom:20px;}
.detail-actions{display:flex; gap:12px; margin-bottom:28px; flex-wrap:wrap;}
.detail-desc{color:var(--ink-muted); line-height:1.75; font-size:14.5px; max-width:680px; margin-bottom:26px;}
.detail-cast{font-size:13.5px; color:var(--ink-faint); line-height:1.9;}
.detail-cast b{color:var(--ink-muted); font-weight:600;}
.player-shell{background:#000; border-radius:var(--radius-lg); overflow:hidden; aspect-ratio:16/9; display:flex; align-items:center; justify-content:center; position:relative;}
.player-shell video, .player-shell iframe{width:100%; height:100%; border:none;}
.player-locked{text-align:center; padding:40px; color:var(--ink-muted);}
.player-locked svg{color:var(--gold); margin-bottom:14px;}
.player-locked h3{font-family:var(--font-display); color:var(--ink); margin:0 0 8px;}

/* ===== StoryReel (player vertical, estilo Reels/TikTok) ===== */
.player-launch{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; background-size:cover; background-position:center; color:var(--ink);}
.player-launch::before{content:""; position:absolute; inset:0; background:linear-gradient(0deg, rgba(18,13,15,.78), rgba(18,13,15,.25));}
.player-launch > *{position:relative;}
.player-launch-btn{width:68px; height:68px; border-radius:50%; border:2px solid var(--gold); background:rgba(18,13,15,.55); display:grid; place-items:center; color:var(--gold-soft); transition:transform .15s, background .15s;}
.player-launch-btn svg{width:26px; height:26px; margin-left:3px;}
.player-launch:hover .player-launch-btn{transform:scale(1.06); background:rgba(201,162,75,.2);}
.player-launch:focus-visible{outline:2px solid var(--gold); outline-offset:-4px;}
.player-launch-label{font-size:13.5px; font-weight:600; letter-spacing:.2px;}

body.reel-open{overflow:hidden;}
.reel{position:fixed; inset:0; z-index:80; background:#000; color:var(--ink); font-family:var(--font-body);}
.reel-scroller{position:absolute; inset:0; overflow-y:auto; overflow-x:hidden; scroll-snap-type:y mandatory; overscroll-behavior:contain; scrollbar-width:none;}
.reel-scroller::-webkit-scrollbar{display:none;}
@media (prefers-reduced-motion:no-preference){ .reel-scroller{scroll-behavior:smooth;} }

.reel-slide{position:relative; height:100vh; height:100dvh; scroll-snap-align:start; scroll-snap-stop:always; overflow:hidden; display:flex; align-items:center; justify-content:center; background:#000; content-visibility:auto; contain-intrinsic-size:100vw 100vh;}
.reel-bg{position:absolute; inset:-40px; background-size:cover; background-position:center; filter:blur(34px) brightness(.5) saturate(1.15);}
.reel-slide::before{content:""; position:absolute; inset:0; z-index:1; pointer-events:none; background:radial-gradient(120% 85% at 50% 50%, transparent 42%, rgba(122,31,46,.42) 100%);}

.reel-stage{position:relative; z-index:2; width:min(100vw, calc(100vh * 16 / 9)); width:min(100vw, calc(100dvh * 16 / 9)); aspect-ratio:16/9; background:#000; overflow:hidden; box-shadow:0 24px 60px rgba(0,0,0,.6);}
.reel-slide.is-tall .reel-stage{width:min(100vw, calc(100vh * 9 / 16)); width:min(100vw, calc(100dvh * 9 / 16)); height:100%; aspect-ratio:auto;}
.reel-slide.is-panel .reel-stage{width:100%; height:100%; aspect-ratio:auto; background:transparent; box-shadow:none;}
.reel-cover{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;}
.reel-stage.is-live .reel-cover{display:none;}
.reel-player{position:absolute; inset:0;}
.reel-player .plyr{height:100%; width:100%; background:transparent; font-family:var(--font-body);
  --plyr-color-main:#C9A24B; --plyr-control-radius:3px; --plyr-video-control-color:#F4ECE3; --plyr-font-weight-regular:500;
  --plyr-menu-background:#1B1417; --plyr-menu-color:#F4ECE3; --plyr-tooltip-background:#1B1417; --plyr-tooltip-color:#F4ECE3;}
.reel-player .plyr__video-wrapper{height:100%; background:transparent;}
.reel-player video{width:100%; height:100%; object-fit:contain; background:transparent;}
.reel-player iframe{border:0;}
.reel-loading{position:absolute; left:50%; top:50%; width:34px; height:34px; margin:-17px 0 0 -17px; border-radius:50%; border:2px solid rgba(244,236,227,.25); border-top-color:var(--gold); animation:reel-spin .9s linear infinite; z-index:3; pointer-events:none;}
@keyframes reel-spin{to{transform:rotate(360deg);}}
@media (prefers-reduced-motion:reduce){ .reel-loading{animation-duration:2.4s;} }

.reel-panel{position:absolute; inset:0; z-index:4; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; text-align:center; padding:20px; background:rgba(18,13,15,.74); backdrop-filter:blur(4px);}
.reel-panel svg{color:var(--gold);}
.reel-panel h3{font-family:var(--font-display); font-size:clamp(17px,4.6vw,24px); margin:6px 0 0;}
.reel-panel p{color:var(--ink-muted); font-size:13.5px; line-height:1.55; margin:0; max-width:36ch;}
.reel-panel-actions{display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:10px;}

.reel-top{position:absolute; z-index:10; top:0; left:0; right:0; display:flex; align-items:center; justify-content:space-between; padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 30px; background:linear-gradient(180deg, rgba(0,0,0,.62), transparent); pointer-events:none;}
.reel-top > *{pointer-events:auto;}
.reel-count{font-size:13px; font-weight:600; color:var(--ink); background:rgba(18,13,15,.55); border:1px solid rgba(244,236,227,.18); padding:7px 13px; border-radius:20px; backdrop-filter:blur(6px); font-variant-numeric:tabular-nums;}
.reel-btn{width:44px; height:44px; flex-shrink:0; border-radius:50%; border:1px solid rgba(244,236,227,.22); background:rgba(18,13,15,.55); color:var(--ink); display:grid; place-items:center; backdrop-filter:blur(6px); cursor:pointer; transition:border-color .15s, background .15s;}
.reel-btn:hover{border-color:var(--gold);}
.reel-btn:focus-visible, .reel a:focus-visible{outline:2px solid var(--gold); outline-offset:2px;}
.reel-btn[aria-pressed="true"]{color:var(--gold-soft); border-color:var(--gold);}

.reel-info{position:absolute; z-index:5; left:0; right:76px; max-width:560px; padding:0 16px; bottom:calc(env(safe-area-inset-bottom,0px) + 28px); text-shadow:0 1px 14px rgba(0,0,0,.75); pointer-events:none; transition:opacity .4s;}
.reel-title{font-family:var(--font-display); font-weight:700; font-size:clamp(20px,5vw,28px); line-height:1.15; margin:0 0 6px;}
.reel-meta{display:flex; gap:12px; flex-wrap:wrap; font-size:13px; color:var(--ink-muted); margin:0 0 8px;}
.reel-meta span{display:inline-flex; align-items:center; gap:5px;}
.reel-syn{font-size:13.5px; line-height:1.55; color:rgba(244,236,227,.9); margin:0; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
.reel-rail{position:absolute; z-index:6; right:12px; bottom:calc(env(safe-area-inset-bottom,0px) + 28px); display:flex; flex-direction:column; gap:12px; transition:opacity .4s;}
.reel-slide.is-tall .reel-info, .reel-slide.is-tall .reel-rail{bottom:calc(env(safe-area-inset-bottom,0px) + 92px);}
/* Depois que o vídeo começa, título/sinopse saem de cima da imagem (ficam no botão de detalhes). */
.reel-stage.is-live ~ .reel-info{opacity:0; visibility:hidden; pointer-events:none;}
/* Tela cheia por CSS (reserva quando o navegador não oferece a nativa): o palco cobre a tela e o resto some. */
.reel-slide.is-fs{content-visibility:visible; contain:none; overflow:visible; z-index:300;}
.reel-slide.is-fs .reel-stage{position:fixed; inset:0; width:100vw; height:100vh; height:100dvh; max-width:none; aspect-ratio:auto; z-index:300; box-shadow:none; background:#000;}
.reel-slide.is-fs .reel-info, .reel-slide.is-fs .reel-rail, .reel-slide.is-fs::before{display:none;}
.reel.fs-css .reel-top, .reel.fs-css .reel-nav, .reel.fs-css .reel-hint{display:none;}
@media (hover:hover) and (pointer:fine){ .reel-btn-fs{display:none;} }

/* Tela larga: o título sobe para o canto e some junto com os controles, para não cobrir a novelinha. */
@media (min-aspect-ratio:1/1){
  .reel-info{bottom:auto; top:72px; right:96px;}
  .reel-rail{bottom:auto; top:50%; transform:translateY(-50%);}
  .reel.ui-idle .reel-info, .reel.ui-idle .reel-rail{opacity:0; pointer-events:none;}
  .reel-slide.is-tall .reel-info{top:auto; bottom:calc(env(safe-area-inset-bottom,0px) + 92px);}
  .reel-slide.is-tall .reel-rail{top:auto; transform:none; bottom:calc(env(safe-area-inset-bottom,0px) + 92px);}
}
.reel-nav{position:absolute; z-index:7; right:18px; top:50%; transform:translateY(-50%); display:none; flex-direction:column; gap:10px;}
@media (hover:hover) and (pointer:fine){ .reel-nav{display:flex;} .reel-rail{right:76px;} }
.reel-btn:disabled{opacity:.35; cursor:default;}

.reel-end{flex-direction:column; gap:14px; text-align:center; padding:24px;}
.reel-end > *{position:relative; z-index:2;}
.reel-end h2{font-family:var(--font-display); font-size:clamp(22px,5vw,32px); margin:0;}
.reel-end p{color:var(--ink-muted); font-size:14px; margin:0; max-width:36ch; line-height:1.6;}

.reel-hint{position:absolute; z-index:9; left:50%; bottom:calc(env(safe-area-inset-bottom,0px) + 96px); transform:translateX(-50%); background:rgba(18,13,15,.78); border:1px solid rgba(244,236,227,.2); padding:9px 16px; border-radius:20px; font-size:13px; color:var(--ink); display:flex; align-items:center; gap:8px; pointer-events:none; transition:opacity .5s;}
.reel-hint.gone{opacity:0;}
@media (prefers-reduced-motion:no-preference){ .reel-hint svg{animation:reel-nudge 1.3s ease-in-out 2;} }
@keyframes reel-nudge{50%{transform:translateY(-5px);}}

.reel-sheet{position:absolute; z-index:20; inset:0; display:flex; align-items:flex-end; justify-content:center; background:rgba(0,0,0,.55); opacity:0; visibility:hidden; transition:opacity .2s, visibility 0s .2s;}
.reel-sheet.open{opacity:1; visibility:visible; transition:opacity .2s;}
.reel-sheet-box{width:min(560px,100%); max-height:80vh; max-height:80dvh; overflow-y:auto; background:var(--bg-elev); border:1px solid var(--line); border-radius:var(--radius-lg) var(--radius-lg) 0 0; padding:22px 22px calc(env(safe-area-inset-bottom,0px) + 22px); transform:translateY(24px); transition:transform .22s ease;}
.reel-sheet.open .reel-sheet-box{transform:none;}
.reel-sheet-head{display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:8px;}
.reel-sheet-head h3{font-family:var(--font-display); font-size:22px; margin:4px 0 0; line-height:1.2;}
.reel-sheet-syn{color:var(--ink-muted); font-size:14px; line-height:1.7; margin:0 0 14px;}
.reel-sheet-cast{color:var(--ink-faint); font-size:13.5px; line-height:1.9; margin:0 0 14px;}
.reel-sheet-cast b{color:var(--ink-muted); font-weight:600;}
.reel-sheet-plan{color:var(--ink-faint); font-size:13px; margin:0 0 16px;}

/* ===== Formato app: barra inferior, pesquisa, continuar assistindo, minha lista ===== */
.card-art{position:relative;}
.card-heart{position:absolute; top:8px; right:8px; width:34px; height:34px; padding:0; border:none; border-radius:50%; background:rgba(9,6,7,.62); backdrop-filter:blur(4px); color:var(--ink); display:grid; place-items:center; transition:transform .12s, color .15s;}
.card-heart svg{width:17px; height:17px;}
.card-heart:hover{color:var(--gold-soft); transform:scale(1.08);}
.card-heart[aria-pressed="true"], .btn[aria-pressed="true"] svg{color:var(--gold);}
.card-heart[aria-pressed="true"] svg, .btn[aria-pressed="true"] svg{fill:currentColor;}
.card-lock{top:auto; bottom:8px; right:8px;}

.rail-wrap{position:relative;}
.rail-arrow{display:none; position:absolute; top:calc(50% - 30px); z-index:5; width:40px; height:64px; border:none; background:rgba(9,6,7,.78); color:var(--ink); align-items:center; justify-content:center; opacity:0; transition:opacity .18s; padding:0;}
.rail-arrow.left{left:0; border-radius:0 var(--radius-lg) var(--radius-lg) 0;} .rail-arrow.right{right:0; border-radius:var(--radius-lg) 0 0 var(--radius-lg);}
.rail-arrow:hover{color:var(--gold-soft);}
@media (hover:hover) and (pointer:fine){ .rail-arrow{display:flex;} .rail-wrap:hover .rail-arrow, .rail-arrow:focus-visible{opacity:1;} }

.cw-card{position:relative; flex:0 0 min(300px, 72vw); scroll-snap-align:start;}
.cw-link{display:block;}
.cw-thumb{position:relative; aspect-ratio:16/9; border-radius:var(--radius-lg); overflow:hidden; background:var(--bg-elev-2) center/cover; border:1px solid var(--line); transition:border-color .18s;}
.cw-link:hover .cw-thumb, .cw-link:focus-visible .cw-thumb{border-color:var(--gold);}
.cw-thumb::after{content:""; position:absolute; inset:0; background:linear-gradient(0deg, rgba(9,6,7,.82), transparent 55%);}
.cw-play{position:absolute; z-index:2; left:50%; top:50%; width:46px; height:46px; margin:-23px 0 0 -23px; border-radius:50%; background:rgba(9,6,7,.6); border:1.5px solid var(--gold); color:var(--gold-soft); display:grid; place-items:center; opacity:0; transition:opacity .18s;}
.cw-play svg{margin-left:2px;}
.cw-link:hover .cw-play, .cw-link:focus-visible .cw-play{opacity:1;}
.cw-left{position:absolute; z-index:2; right:10px; bottom:12px; font-size:12px; font-weight:600; text-shadow:0 1px 6px rgba(0,0,0,.8);}
.cw-bar{position:absolute; z-index:2; left:0; right:0; bottom:0; height:4px; background:rgba(244,236,227,.22);}
.cw-bar i{display:block; height:100%; background:linear-gradient(90deg, var(--curtain-2), var(--gold)); border-radius:0 2px 2px 0;}
.cw-title{margin:9px 0 2px; font-size:14px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.cw-sub{margin:0; font-size:12px; color:var(--ink-faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.cw-x{position:absolute; top:8px; right:8px; z-index:3; width:30px; height:30px; padding:0; border:none; border-radius:50%; background:rgba(9,6,7,.7); color:var(--ink); display:grid; place-items:center;}
.cw-x:hover{color:var(--gold-soft);}
.cw-x svg{width:14px; height:14px;}
@media (hover:hover) and (pointer:fine){ .cw-x{opacity:0; transition:opacity .15s;} .cw-card:hover .cw-x, .cw-x:focus-visible{opacity:1;} }

.search-page{padding-top:28px; min-height:70vh;}
.search-box{position:relative; display:flex; align-items:center; margin-bottom:22px;}
.search-ico{position:absolute; left:16px; color:var(--ink-faint); display:grid; pointer-events:none;}
.search-ico svg{width:19px; height:19px;}
.search-box input{width:100%; height:52px; padding:0 48px 0 46px; border-radius:26px; border:1px solid var(--line); background:var(--bg-elev); color:var(--ink); font-size:16px; outline:none; transition:border-color .15s, box-shadow .15s; -webkit-appearance:none; appearance:none;}
.search-box input::-webkit-search-cancel-button{display:none;}
.search-box input:focus{border-color:var(--gold); box-shadow:0 0 0 3px rgba(201,162,75,.18);}
.search-clear{position:absolute; right:8px; width:36px; height:36px; padding:0; border:none; border-radius:50%; background:none; color:var(--ink-muted); display:grid; place-items:center;}
.search-clear[hidden]{display:none;}
.search-clear:hover{color:var(--ink);}
.search-hint{color:var(--ink-muted); font-size:14px; margin:0 0 22px;}
.search-count{color:var(--ink-muted); font-size:13.5px; margin:0 0 16px;}
.search-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:16px;}
@media (min-width:700px){ .search-grid{grid-template-columns:repeat(auto-fill, minmax(190px, 1fr)); gap:18px;} }
.search-grid .card{flex:none;}
.search-more{display:flex; justify-content:center; margin:26px 0 10px;}
.search-recent-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}
.search-recent-head h2{font-family:var(--font-display); font-size:17px; margin:0;}
.search-recent-head button{background:none; border:none; color:var(--ink-faint); font-size:13px;}
.search-recent-head button:hover{color:var(--gold-soft);}
.search-recent .genre-filters{flex-wrap:wrap; overflow:visible;}
.search-empty{display:flex; flex-direction:column; align-items:center; text-align:center; gap:8px; padding:56px 12px; color:var(--ink-muted);}
.search-empty svg{width:34px; height:34px; color:var(--gold);}
.search-empty p{margin:6px 0 0; color:var(--ink); font-family:var(--font-display); font-size:19px;}
.search-empty span{font-size:13.5px; max-width:34ch; line-height:1.6;}

/* Barra de navegação flutuante (embaixo, em todas as telas): pílula com indicador que desliza até a aba ativa. */
.fnav{position:fixed; left:50%; bottom:calc(14px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); z-index:70; width:100%; max-width:34rem; padding:0 10px; pointer-events:none;}
.fnav-bar{pointer-events:auto; position:relative; display:flex; align-items:center; justify-content:space-between; background:rgba(27,20,23,.93); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border:1px solid var(--line); border-radius:999px; padding:6px 5px; box-shadow:0 16px 44px rgba(0,0,0,.6);}
.fnav-item{position:relative; z-index:1; flex:1 1 0; min-width:0; display:flex; flex-direction:column; align-items:center; gap:2px; padding:7px 2px; border-radius:999px; color:var(--ink-faint); font-size:10.5px; font-weight:500; white-space:nowrap; transition:color .2s;}
.fnav-item svg{width:21px; height:21px; flex-shrink:0;}
.fnav-item:hover{color:var(--ink);}
.fnav-item.active{color:var(--gold-soft);}
.fnav-item:focus-visible{outline:2px solid var(--gold); outline-offset:-2px;}
.fnav-ind{position:absolute; z-index:0; top:4px; bottom:4px; left:0; width:0; border-radius:999px; background:rgba(201,162,75,.15); border:1px solid rgba(201,162,75,.3); transition:transform .4s cubic-bezier(.3,1.35,.5,1), width .4s cubic-bezier(.3,1.35,.5,1), opacity .2s; pointer-events:none;}
@media (min-width:640px){ .fnav-item{font-size:11.5px; flex-direction:row; justify-content:center; gap:7px; padding:11px 6px;} .fnav-item svg{width:19px; height:19px;} }
@media (prefers-reduced-motion:reduce){ .fnav-ind{transition:opacity .2s;} }
.fnav-item.cta{color:var(--gold);}
.fnav-item.cta.active{color:var(--gold-soft);}
.fnav-avatar{width:22px; height:22px; border-radius:50%; background:var(--curtain); color:#fff; display:grid; place-items:center; font-size:9.5px; font-weight:700; letter-spacing:.2px; border:1px solid var(--line); flex-shrink:0;}
.fnav-item.active .fnav-avatar{border-color:var(--gold);}
/* 7 ou mais itens (conta sem plano pago, administrador): letras e ícones menores no celular e barra mais larga no computador */
.fnav.dense .fnav-item{font-size:9.5px; padding:7px 0;}
.fnav.dense .fnav-item svg{width:19px; height:19px;}
@media (min-width:640px){ .fnav.dense{max-width:46rem;} .fnav.dense .fnav-item{font-size:11.5px; padding:11px 4px; gap:6px;} .fnav.dense .fnav-item svg{width:18px; height:18px;} }

/* ===== Fase 2: filtros do catálogo e tela Surpresa ===== */
.catalog-bar{display:flex; align-items:center; gap:10px; margin-bottom:22px;}
.catalog-bar .genre-filters{flex:1; min-width:0; margin-bottom:0;}
.btn-filters{flex-shrink:0; display:inline-flex; align-items:center; gap:7px; border-radius:20px; padding:8px 16px; font-size:13px;}
.btn-filters svg{width:15px; height:15px;}
.chip-count{background:var(--gold); color:#1a1208; border-radius:10px; min-width:18px; height:18px; padding:0 5px; font-size:11px; font-weight:700; display:inline-grid; place-items:center;}
.catalog-clear{background:none; border:none; color:var(--gold-soft); font-size:13px; text-decoration:underline; padding:0; margin-left:6px;}
.catalog-empty{grid-column:1/-1; text-align:center; padding:40px 12px; color:var(--ink-faint);}
body.fdrawer-open{overflow:hidden;}
.fdrawer-overlay{position:fixed; inset:0; z-index:150; background:rgba(0,0,0,.62); display:flex; justify-content:flex-end; opacity:0; transition:opacity .2s;}
.fdrawer-overlay.open{opacity:1;}
.filters-panel{width:min(380px,100%); height:100%; background:var(--bg-elev); border-left:1px solid var(--line); display:flex; flex-direction:column; transform:translateX(28px); transition:transform .22s ease;}
.fdrawer-overlay.open .filters-panel{transform:none;}
.filters-head{display:flex; align-items:center; justify-content:space-between; padding:18px 22px; border-bottom:1px solid var(--line);}
.filters-head h2{font-family:var(--font-display); font-size:21px; margin:0;}
.filters-close{width:40px; height:40px; border:none; background:none; color:var(--ink-muted); display:grid; place-items:center; border-radius:50%;}
.filters-close:hover{color:var(--ink);}
.filters-body{flex:1; overflow-y:auto; padding:22px;}
.filters-body label{display:block; font-size:11.5px; letter-spacing:.8px; text-transform:uppercase; color:var(--ink-faint); margin:0 0 7px;}
.filters-body .field{margin-bottom:20px;}
.filters-actions{display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:16px 22px calc(env(safe-area-inset-bottom,0px) + 16px); border-top:1px solid var(--line);}
.fdrawer-overlay :focus-visible{outline:2px solid var(--gold); outline-offset:2px;}

.surprise-page{padding-top:36px; min-height:70vh; text-align:center;}
.surprise-page .page-sub{margin:0 auto 12px; max-width:44ch;}
.deck{position:relative; width:min(100%,420px); height:clamp(230px,62vw,290px); margin:22px auto 8px;}
.deck-card{position:absolute; left:50%; top:10px; width:clamp(112px,32vw,150px); aspect-ratio:2/3; margin-left:calc(clamp(112px,32vw,150px) / -2); border-radius:10px; background:linear-gradient(160deg, var(--curtain), var(--bg-elev-2)) center/cover; border:1px solid rgba(244,236,227,.14); box-shadow:0 14px 30px rgba(0,0,0,.55); transform-origin:50% 130%; transform:translateX(calc(var(--i) * 15%)) rotate(calc(var(--i) * 9deg)); transition:transform .35s ease, opacity .35s;}
.deck-card:nth-child(3){z-index:2;}
.deck.done .deck-card{opacity:.28; transform:translateX(calc(var(--i) * 6%)) rotate(calc(var(--i) * 3deg)) scale(.92);}
@media (prefers-reduced-motion:no-preference){
  .deck.shuffling .deck-card{animation:deck-shuffle .8s ease-in-out both; animation-delay:calc((var(--i) + 2) * 45ms);}
}
@keyframes deck-shuffle{
  0%{transform:translateX(calc(var(--i) * 15%)) rotate(calc(var(--i) * 9deg));}
  45%{transform:translateX(calc(var(--i) * -34%)) rotate(calc(var(--i) * -16deg)) translateY(-14px);}
  100%{transform:translateX(calc(var(--i) * 15%)) rotate(calc(var(--i) * 9deg));}
}
.surprise-actions{display:flex; justify-content:center; margin:14px 0 26px;}
.surprise-actions .btn{display:inline-flex; align-items:center; gap:9px;}
.surprise-actions .btn:disabled{opacity:.55;}
.pick{display:grid; grid-template-columns:minmax(120px,190px) 1fr; gap:22px; max-width:640px; margin:0 auto; text-align:left; background:var(--bg-elev); border:1px solid var(--line); border-radius:var(--radius-lg); padding:18px;}
.pick-poster{display:block; border-radius:var(--radius); overflow:hidden; align-self:start;}
.pick-poster img{display:block; width:100%; aspect-ratio:2/3; object-fit:cover;}
.pick-tag{font-size:11.5px; letter-spacing:1px; text-transform:uppercase; color:var(--gold-soft);}
.pick h2{font-family:var(--font-display); font-size:clamp(21px,5vw,28px); line-height:1.15; margin:6px 0 8px;}
.pick-meta{display:flex; flex-wrap:wrap; gap:12px; font-size:13px; color:var(--ink-muted); margin:0 0 12px;}
.pick-syn{font-size:14px; line-height:1.65; color:var(--ink-muted); margin:0 0 16px; display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden;}
.pick-note{font-size:12.5px; color:var(--ink-faint); margin:0 0 12px;}
.pick-actions{display:flex; flex-wrap:wrap; gap:10px;}
@media (prefers-reduced-motion:no-preference){ .pick{animation:pick-in .4s ease both;} }
@keyframes pick-in{from{opacity:0; transform:translateY(14px);}}
@media (max-width:560px){ .pick{grid-template-columns:1fr; text-align:center;} .pick-poster{width:150px; margin:0 auto;} .pick-meta, .pick-actions{justify-content:center;} }

/* ===== Pop-up de assinatura (principal + mini) ===== */
body.conv-open{overflow:hidden;}
.conv-overlay{position:fixed; inset:0; z-index:140; display:flex; align-items:center; justify-content:center; padding:20px; background:rgba(0,0,0,.74); -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px); animation:conv-fade .3s ease both;}
.conv-card{position:relative; width:min(430px,100%); max-height:calc(100vh - 40px); max-height:calc(100dvh - 40px); overflow-y:auto; text-align:center; padding:30px 24px 20px; border-radius:1.5rem; background:linear-gradient(160deg, #2a1319, #121212 58%); border:1px solid rgba(201,162,75,.38); box-shadow:0 30px 80px rgba(0,0,0,.7); transform-origin:100% 100%; animation:conv-pop .42s cubic-bezier(.3,1.3,.5,1) both;}
.conv-card.closing{animation:conv-shrink .3s ease-in both;}
.conv-close{position:absolute; top:8px; right:8px; width:44px; height:44px; padding:0; border:none; border-radius:50%; background:none; color:var(--ink-muted); display:grid; place-items:center;}
.conv-close:hover{color:var(--ink);}
.conv-kicker{font-size:11.5px; letter-spacing:1.4px; text-transform:uppercase; color:var(--gold-soft); margin:0 0 6px;}
.conv-card h2{font-family:var(--font-display); font-size:clamp(24px,6.4vw,30px); line-height:1.15; margin:0 0 8px;}
.conv-sub{color:var(--ink-muted); font-size:14px; line-height:1.6; margin:0 auto; max-width:34ch;}
.conv-card .deck{height:clamp(210px,54vw,250px); margin:14px auto 4px;}
.conv-bullets{list-style:none; padding:0; margin:12px 0 18px; display:grid; gap:7px; text-align:left; font-size:13.5px; color:var(--ink-muted);}

const DB = { plays: [], plans: [], users: [], me: null };

/* --------------------------- CLIENTE DE API --------------------------------- */
function getToken(){ return localStorage.getItem(TOKEN_KEY); }
function setToken(t){ localStorage.setItem(TOKEN_KEY, t); }
function clearToken(){ localStorage.removeItem(TOKEN_KEY); }

function showWakeHint(on){ const el = document.getElementById("wake-hint"); if(el) el.classList.toggle("show", on); }

// Chamadas à API. GETs tentam de novo sozinhos (o servidor gratuito "dorme" e leva alguns
// segundos para acordar); POST/PUT/DELETE nunca são repetidos, para não duplicar nada.
async function api(path, { method="GET", body } = {}){
  const headers = { "Content-Type": "application/json" };
  const token = getToken();
  if(token) headers["Authorization"] = "Bearer " + token;
  const isGet = method === "GET";
  const attempts = isGet ? 4 : 1;
  for(let i=0; i<attempts; i++){
    const ctrl = new AbortController();
    const timer = setTimeout(()=>ctrl.abort(), isGet ? 35000 : 60000);
    try{
      const res = await fetch("/api" + path, { method, headers, body: body ? JSON.stringify(body) : undefined, signal: ctrl.signal });
      clearTimeout(timer);
      if(isGet && [502,503,504].includes(res.status) && i < attempts-1){ showWakeHint(true); await sleep(1500*(i+1)); continue; }
      let data = null;
      try{ data = await res.json(); }catch(e){ data = null; }
      if(!res.ok){
        const err = new Error((data && data.error) || "Ocorreu um erro. Tente novamente.");
        err.httpError = true; err.status = res.status; throw err;
      }
      return data;
    }catch(e){
      clearTimeout(timer);
      if(e.httpError) throw e;
      if(i < attempts-1){ showWakeHint(true); await sleep(1500*(i+1)); continue; }
    }
  }
  throw new Error("Sem conexão com o servidor. Verifique sua internet e tente de novo.");
}

/* --------------------------- HELPERS ----------------------------------- */
function esc(str){ return String(str==null?"":str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtMoney(v){ return v===0 ? "Grátis" : "R$ " + v.toFixed(2).replace(".", ","); }
function fmtDuration(min){ const h=Math.floor(min/60), m=min%60; return h + "h" + (m? (m<10?"0"+m:m)+"min" : ""); }
function fmtDate(iso){ return new Date(iso).toLocaleDateString("pt-BR"); }
function planById(id){ return DB.plans.find(p=>p.id===id); }
function planLevel(planId){ const idx = DB.plans.findIndex(p=>p.id===planId); return idx<0?0:idx; }
function isPlanActive(user){ if(!user) return false; const pl = planById(user.plan); if(user.plan === "plateia" || (pl && pl.price === 0)) return true; return new Date(user.planExpiry) > new Date(); }
function daysLeft(user){ return Math.max(0, Math.ceil((new Date(user.planExpiry) - Date.now()) / 86400000)); }
function currentUser(){ return DB.me; }
function toast(msg){
  const host = document.getElementById("toast-host");
  const t = document.createElement("div"); t.className="toast"; t.textContent = msg;
  host.appendChild(t); setTimeout(()=>{ t.remove(); }, 3400);
}
function qs(sel, root=document){ return root.querySelector(sel); }
function qsa(sel, root=document){ return Array.from(root.querySelectorAll(sel)); }
function go(hash){ location.hash = hash; }

/* ---- cache local: a 2ª visita em diante abre NA HORA, mesmo com o servidor dormindo ---- */
const CACHE_KEY = "minidrama_cache_v6";
function loadCache(){
  try{ localStorage.removeItem("minidrama_cache_v2"); localStorage.removeItem("minidrama_cache_v3"); localStorage.removeItem("minidrama_cache_v4"); localStorage.removeItem("minidrama_cache_v5"); }catch(e){}
  try{ const c = JSON.parse(localStorage.getItem(CACHE_KEY)); if(c && Date.now() - c.t < 14*86400000) return c; }catch(e){}
  return null;
}
function saveCache(){
  try{ localStorage.setItem(CACHE_KEY, JSON.stringify({ t: Date.now(), home: DB.home, plans: DB.plans, me: DB.me, vortaHome: DB.vortaHome, hasToken: !!getToken() })); }catch(e){}
}

// Busca catálogo, planos e (se logado) os dados do usuário. Só desloga em 401/403 — falha de rede não desloga ninguém.
async function loadFresh(){
  const [homeRes, plansRes, vortaFeed] = await Promise.all([
    api("/plays/feed/home"),
    api("/plans"),
    api("/vorta/feed?lang=pt").catch(() => null)
  ]);
  DB.home = homeRes; DB.plans = plansRes.plans;
  DB.vortaFeed = vortaFeed || { banners: [], dubladas: [], legendadas: [], channels: {}, counts: {}, total: 510 };
  DB.vortaHome = (vortaFeed && vortaFeed.channels && vortaFeed.channels.freereels) || [];
  const seen = new Set();
  const allPlays = [
    ...(vortaFeed && vortaFeed.banners ? vortaFeed.banners : []),
    ...(vortaFeed && vortaFeed.dubladas ? vortaFeed.dubladas : []),
    ...(vortaFeed && vortaFeed.legendadas ? vortaFeed.legendadas : []),
    ...(vortaFeed && vortaFeed.channels && vortaFeed.channels.freereels ? vortaFeed.channels.freereels : []),
    ...(vortaFeed && vortaFeed.channels && vortaFeed.channels.shortmax ? vortaFeed.channels.shortmax : []),
    ...(vortaFeed && vortaFeed.channels && vortaFeed.channels.meloshort ? vortaFeed.channels.meloshort : []),
    ...((homeRes && homeRes.featured) || []),
    ...((homeRes && homeRes.novos) || []),
    ...((homeRes && homeRes.genres) ? homeRes.genres.flatMap(g => g.plays) : [])
  ];
  DB.plays = allPlays.filter(p => p && p.id && !seen.has(p.id) && seen.add(p.id));
  DB.playsTotal = (vortaFeed && vortaFeed.total) ? Math.max(vortaFeed.total, DB.plays.length) : (homeRes.total || DB.plays.length);
  if(getToken()){
    try{ DB.me = (await api("/auth/me")).user; }
    catch(e){ if(e.httpError && (e.status === 401 || e.status === 403)){ clearToken(); DB.me = null; } }
  } else { DB.me = null; }
  saveCache();
}

// A ordem das fileiras muda à 00:00 no fuso do servidor (a resposta traz shuffleDay/shuffleTz). Se o que o navegador
// guardou é de outro dia, não vale mostrar: ele seria a vitrine de ontem.
function todayIn(tz){ try{ return new Intl.DateTimeFormat("en-CA", { timeZone: tz, year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date()); }catch(e){ return null; } }
function homeIsFromToday(home){
  const h = home || DB.home;
  if(!h || !h.shuffleDay || !h.shuffleTz) return true;               // sem a informação: não força atualização (evita laço)
  const t = todayIn(h.shuffleTz);
  return !t || t === h.shuffleDay;
}
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible" && DB.home && !homeIsFromToday()) refreshInBackground(); });   // aba que ficou aberta durante a virada do dia
async function refreshInBackground(){
  try{
    const before = JSON.stringify([DB.home, DB.plans, DB.me]);
    await loadFresh();
    const changed = before !== JSON.stringify([DB.home, DB.plans, DB.me]);
    if(changed && ["#/home", "#/planos", "#/catalogo"].includes(location.hash || "#/home")) render();
  }catch(e){ /* silencioso: o usuário já está vendo a versão guardada */ }
}

async function boot(){
  startConversionTimer();                                            // o pop-up de assinatura conta 30 s a partir daqui
  registerServiceWorker();
  const cached = loadCache();
  if(cached && cached.hasToken === !!getToken() && (cached.plans || []).length && cached.home && cached.home.catalog && homeIsFromToday(cached.home)){
    DB.home = cached.home; DB.plans = cached.plans; DB.me = cached.me || null; DB.vortaHome = cached.vortaHome || []; DB.vortaFeed = cached.vortaFeed || { channels: {}, banners: [] };
    const seen = new Set();
    DB.plays = [...cached.home.featured, ...(cached.home.novos || []), ...cached.home.genres.flatMap(g => g.plays), ...(DB.vortaHome || [])].filter(p => !seen.has(p.id) && seen.add(p.id));
    render();
    refreshInBackground();
    scheduleInstallBanner();
    return;
  }
  const wake = setTimeout(()=>showWakeHint(true), 4000);
  try{
    await loadFresh();
  }catch(e){
    clearTimeout(wake);
    document.getElementById("app").innerHTML = `<div class="boot-screen"><div class="brand">Mini Drama</div><p style="text-align:center; padding:0 20px;">${esc(e.message || "Não foi possível conectar ao servidor.")}</p><button class="btn btn-gold" onclick="location.reload()">Tentar de novo</button></div>`;
    return;
  }
  clearTimeout(wake);
  render();
  scheduleInstallBanner();
}

const ADMIN_ROUTES = ["#/admin","#/admin/novelinhas","#/admin/usuarios","#/admin/planos","#/admin/vorta"];

let renderSeq = 0;   // cada navegação ganha um número; resposta atrasada de uma navegação antiga é descartada
async function render(){
  const seq = ++renderSeq;
  reelTeardown(); dropFiltersDrawer(); document.body.classList.remove("reel-open"); appRenders++;   // sai do StoryReel (se estava nele) antes de qualquer tela
  let hash = location.hash || "#/home";
  // Links antigos (e-mails já enviados, favoritos, app instalado) continuam abrindo: #/peca/ID -> #/novelinha/ID e #/admin/pecas -> #/admin/novelinhas
  if(hash.startsWith("#/peca/") || hash === "#/admin/pecas"){
    hash = hash.replace("#/peca/", "#/novelinha/").replace("#/admin/pecas", "#/admin/novelinhas");
    try{ history.replaceState(null, "", hash); }catch(e){}
  }
  refreshConversion();                                               // entrou numa tela onde o convite não aparece (player, planos, login)? ele sai da frente
  const user = currentUser();

  if(ADMIN_ROUTES.some(r=>hash.startsWith(r)) && !(user && user.role==="admin")){
    toast("Acesso restrito à administração.");
    hash = "#/login"; location.hash = hash; return;
  }

  const app = document.getElementById("app");
  window.scrollTo(0,0);

  if(hash.startsWith("#/admin")) { app.innerHTML = AdminLayout(hash); await afterAdminRender(hash, seq); return; }
  if(hash === "#/reel" || hash.startsWith("#/reel/")) { await openReel(hash.split("/")[2] || "", seq); return; }
  if(hash === "#/surpresa") { app.innerHTML = PublicShell(SurprisePage()); afterPublicRender(); attachSurpriseEvents(); return; }
  if(hash === "#/buscar" || hash.startsWith("#/buscar/")) {
    let q = ""; try{ q = decodeURIComponent(hash.split("/").slice(2).join("/")); }catch(e){ q = ""; }
    app.innerHTML = PublicShell(SearchPage(q)); afterPublicRender(); attachSearchEvents(q); return;
  }
  if(hash === "#/minha-lista") {
    if(!user){ toast("Entre na sua conta para ver sua lista."); go("#/login"); return; }
    app.innerHTML = PublicShell(`<div class="container" style="padding-top:36px;"><p class="search-hint">Carregando sua lista…</p></div>`); afterPublicRender();
    const html = await MyListPage();
    if(seq !== renderSeq) return;
    qs("#app main").innerHTML = html; afterPublicRender(); return;
  }
  if(hash.startsWith("#/novelinha/")) {
    const id = hash.split("/")[2];
    app.innerHTML = PublicShell(`<div class="page-wrap"><p>Carregando novelinha...</p></div>`); afterPublicRender();
    const html = await PlayDetail(id);
    if(seq !== renderSeq) return;
    qs("#app main").outerHTML = `<main>${html}</main>`; afterPublicRender();
    return;
  }
  if(hash === "#/esqueci-senha") { app.innerHTML = ForgotPage(); attachRecoveryEvents(); return; }
  if(hash.startsWith("#/redefinir-senha")) { app.innerHTML = ResetPage(hash); attachRecoveryEvents(); return; }
  if(hash === "#/login") { app.innerHTML = LoginPage(); attachAuthEvents(); return; }
  if(hash === "#/cadastro") { app.innerHTML = SignupPage(); attachAuthEvents(); return; }
  if(hash === "#/planos") { app.innerHTML = PublicShell(PlansPage()); afterPublicRender(); return; }
  if(hash === "#/conta") {
    if(!user){ go("#/login"); return; }
    app.innerHTML = PublicShell(AccountPage(user)); afterPublicRender(); attachAccountEvents(); return;
  }
  if(hash === "#/catalogo") {
    app.innerHTML = PublicShell(`<div class="page-wrap"><p>Carregando catálogo...</p></div>`); afterPublicRender();
    const html = await CatalogPage();
    if(seq !== renderSeq) return;
    qs("#app main").outerHTML = `<main>${html}</main>`; afterPublicRender(); attachCatalogEvents();
    return;
  }
  app.innerHTML = PublicShell(HomePage());
  afterPublicRender();
  attachHomeEvents();
}

let fnavLast = null;      // onde o indicador estava na tela anterior: a nova tela começa ali e desliza até a aba atual
function FloatingNav(user, hash){
  const paid = hasPaidPlan(user), waiting = !user && !!getToken();                    // waiting: tem login guardado, mas a conta ainda não carregou
  const initials = user ? esc(user.name.split(" ").map(w => w[0]).slice(0, 2).join("").toUpperCase()) : "";
  const it = (href, label, icon, on, extra = {}) => ({ href, label, icon, on, ...extra });
  const items = [
    it("#/home", "Início", ICO.home, hash === "#/home" || hash === "#/" || hash === ""),
    it("#/catalogo", "Catálogo", ICO.grid, hash.startsWith("#/catalogo")),
    it("#/buscar", "Buscar", ICO.search, hash.startsWith("#/buscar")),                // a lupa que ficava no topo
    it("#/surpresa", "Surpresa", ICO.shuffle, hash === "#/surpresa"),
    ...(user ? [it("#/minha-lista", "Lista", ICO.heart, hash === "#/minha-lista", { aria: "Minha lista" })] : []),
    ...(user && !paid ? [it("#/planos", "Assinar", ICO.crown, hash === "#/planos", { cta: true })] : []),   // o botão "Assinar" que ficava no topo
    ...(user ? [it("#/conta", "Conta", `<span class="fnav-avatar" aria-hidden="true">${initials}</span>`, hash === "#/conta", { aria: "Conta de " + user.name })]
      : waiting ? [{ loading: true, label: "Conta" }]
      : [it("#/login", "Entrar", ICO.user, false), it("#/cadastro", "Criar conta", ICO.userPlus, false, { cta: true })]),
    ...(user && user.role === "admin" ? [it("#/admin", "Admin", ICO.settings, false)] : [])
  ];
  const ind = fnavLast ? `style="width:${fnavLast.w}px; transform:translateX(${fnavLast.x}px);"` : `style="opacity:0;"`;
  const row = (x) => x.loading
    ? `<span class="fnav-item" aria-busy="true"><span class="sk" style="width:22px; height:22px; border-radius:50%;"></span><span>${x.label}</span></span>`
    : `<a class="fnav-item ${x.on ? "active" : ""} ${x.cta ? "cta" : ""}" href="${x.href}" ${x.on ? 'aria-current="page"' : ""} ${x.aria ? `aria-label="${esc(x.aria)}" title="${esc(x.aria)}"` : ""}>${x.icon}<span>${x.label}</span></a>`;
  return `<nav class="fnav ${items.length >= 7 ? "dense" : ""}" aria-label="Navegação principal"><div class="fnav-bar" id="fnav-bar">
    ${items.map(row).join("")}
    <span class="fnav-ind" id="fnav-ind" ${ind} aria-hidden="true"></span></div></nav>`;
}
function placeFnavIndicator(){
  const bar = document.getElementById("fnav-bar"), ind = document.getElementById("fnav-ind"); if(!bar || !ind) return;
  const act = bar.querySelector(".fnav-item.active");
  if(!act){ ind.style.opacity = "0"; fnavLast = null; return; }
  const x = act.offsetLeft, w = act.offsetWidth;

/* ---- Pesquisa ---- */
const RECENT_KEY = "md_recent_searches";
function getRecent(){ try{ return JSON.parse(localStorage.getItem(RECENT_KEY) || "[]").filter(x => typeof x === "string").slice(0, 6); }catch(e){ return []; } }
function setRecent(list){ try{ localStorage.setItem(RECENT_KEY, JSON.stringify(list)); }catch(e){} }
function addRecent(q){
  q = String(q || "").trim(); if(q.length < 2) return;
  setRecent([q, ...getRecent().filter(x => x.toLowerCase() !== q.toLowerCase())].slice(0, 6));
}
function SearchPage(q){
  return `<div class="container search-page">
    <form class="search-box" role="search" onsubmit="return false">
      <span class="search-ico">${ICO.search}</span>
      <input id="search-input" type="search" inputmode="search" enterkeyhint="search" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Buscar por título, direção ou elenco" aria-label="Buscar novelinhas" value="${esc(q)}">
      <button type="button" class="search-clear" id="search-clear" aria-label="Limpar busca" ${q ? "" : "hidden"}>${ICO.x}</button>
    </form>
    <div id="search-out" aria-live="polite"></div>
  </div>`;
}
let searchSeq = 0, searchTimer = null, searchState = { q: "", page: 1 };
function attachSearchEvents(q0){
  const input = qs("#search-input"), out = qs("#search-out"), clear = qs("#search-clear");
  if(!input) return;
  const alive = () => input.isConnected;
  const idle = () => {
    const rec = getRecent();
    out.innerHTML = `<p class="search-hint">Busque por título, direção ou elenco. Acentos e maiúsculas não importam.</p>` + (rec.length ? `<div class="search-recent">
      <div class="search-recent-head"><h2>Buscas recentes</h2><button type="button" data-recent-clear>Limpar</button></div>
      <div class="genre-filters">${rec.map(r => `<button type="button" class="chip" data-recent="${esc(r)}">${esc(r)}</button>`).join("")}</div></div>` : "");
  };
  const run = async (raw, page = 1) => {
    if(!alive()) return;
    const q = String(raw || "").trim(), my = ++searchSeq;
    clear.hidden = !input.value;
    try{ history.replaceState(null, "", q ? "#/buscar/" + encodeURIComponent(q) : "#/buscar"); }catch(e){}
    if(!q){ idle(); return; }
    if(page === 1) out.innerHTML = `<p class="search-hint">Buscando…</p>`;
    let r, vortaRes = null;
    try{
      [r, vortaRes] = await Promise.all([
        api(`/plays?page=${page}&pageSize=24&search=${encodeURIComponent(q)}`),
        page === 1 ? api(`/vorta/search?category=freereels&q=${encodeURIComponent(q)}&limit=12`).catch(() => null) : Promise.resolve(null)
      ]);
    }
    catch(e){ if(alive() && my === searchSeq) out.innerHTML = `<p class="search-hint">${esc(e.message)}</p>`; return; }
    if(!alive() || my !== searchSeq) return;                            // resposta velha de uma digitação anterior
    const vortaPlays = (vortaRes && vortaRes.plays) || [];
    const combinedPlays = page === 1 ? [...vortaPlays, ...r.plays] : r.plays;
    const cards = combinedPlays.map(PlayCard).join("");
    const totalCount = r.total + vortaPlays.length;
    if(page === 1){
      out.innerHTML = combinedPlays.length
        ? `<p class="search-count">${totalCount} resultado${totalCount === 1 ? "" : "s"} para “${esc(q)}”</p><div class="search-grid" id="search-grid">${cards}</div>${r.totalPages > 1 ? `<div class="search-more"><button type="button" class="btn btn-ghost btn-sm" id="search-more">Ver mais</button></div>` : ""}`
        : `<div class="search-empty">${ICO.search}<p>Nenhuma novelinha para “${esc(q)}”</p><span>Confira a grafia ou tente o nome da direção ou de alguém do elenco.</span></div>`;
    } else {
      qs("#search-grid").insertAdjacentHTML("beforeend", cards);
      const more = qs("#search-more"); if(more && page >= r.totalPages) more.parentElement.remove();
    }
    searchState = { q, page };
    syncHearts();
  };
  input.addEventListener("input", () => { clear.hidden = !input.value; clearTimeout(searchTimer); searchTimer = setTimeout(() => run(input.value), 280); });
  input.addEventListener("keydown", (e) => { if(e.key === "Enter"){ e.preventDefault(); clearTimeout(searchTimer); addRecent(input.value); run(input.value); input.blur(); } });
  clear.addEventListener("click", () => { input.value = ""; clearTimeout(searchTimer); run(""); input.focus(); });
  out.addEventListener("click", (e) => {
    const chip = e.target.closest("[data-recent]");
    if(chip){ input.value = chip.dataset.recent; run(input.value); return; }
    if(e.target.closest("[data-recent-clear]")){ setRecent([]); idle(); return; }
    if(e.target.closest("#search-more")){ run(searchState.q, searchState.page + 1); return; }
    if(e.target.closest(".card") && !e.target.closest("[data-heart]")) addRecent(searchState.q);   // guarda a busca que levou a uma novelinha
  });
  run(q0);
  if(!q0) input.focus();
}

/* ---- Surpresa ---- */
let surprise = { lastId: null, busy: false };
function pickRandom(pool, excludeId, rnd = Math.random){
  if(!pool || !pool.length) return null;
  const cand = pool.filter(p => p.id !== excludeId);
  const list = cand.length ? cand : pool;
  const r = typeof rnd === "function" ? rnd() : Math.random();
  const idx = Math.min(Math.floor(Math.max(0, r) * list.length), list.length - 1);
  return list[idx];
}
function shuffled(list){ const a = list.slice(); for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
// Baralho de capas (o mesmo desenho serve para a tela Surpresa e para o pop-up de assinatura; o id evita duplicar elementos).
function deckHtml(plays, id = "deck"){
  const covers = shuffled(plays.filter(p => p.posterUrl)).slice(0, 5).map(p => p.posterUrl);
  return `<div class="deck" id="${esc(id)}" aria-hidden="true">${[0, 1, 2, 3, 4].map(i => `<span class="deck-card" style="--i:${i - 2};${covers[i] ? ` background-image:url('${esc(covers[i])}')` : ""}"></span>`).join("")}</div>`;
}
function SurprisePage(){
  return `<div class="container surprise-page">
    <h1 class="page-title">Conteúdo surpresa</h1>
    <p class="page-sub">Não sabe o que assistir? Embaralhe o catálogo e deixe o ${esc(SITE_NAME)} escolher uma novelinha para você.</p>
    ${deckHtml(DB.plays || [])}
    <div class="surprise-actions"><button type="button" class="btn btn-gold" id="surprise-go">${ICO.shuffle} <span>Sortear novelinha</span></button></div>
    <div id="surprise-pick" aria-live="polite"></div>
  </div>`;
}
function pickHtml(p){
  const plan = planById(p.requiresPlan), canPlay = p.canWatch && p.hasVideo, syn = String(p.synopsis || "").trim();
  const saved = inMyList(p.id);
  return `<article class="pick">
    <a class="pick-poster" href="#/novelinha/${esc(p.id)}" aria-label="Abrir ${esc(p.title)}"><img src="${esc(p.posterUrl)}" alt="${esc(p.title)}"></a>
    <div>
      <span class="pick-tag">Sua novelinha sorteada</span>
      <h2>${esc(p.title)}</h2>
      <p class="pick-meta"><span>${esc(p.genre || "")}</span><span>${fmtDuration(p.durationMinutes)}</span><span>${esc(p.releaseYear)}</span></p>
      ${syn.length > 2 ? `<p class="pick-syn">${esc(syn)}</p>` : ""}
      ${!p.canWatch ? `<p class="pick-note">Disponível no plano ${esc(plan ? plan.name : "")}.</p>` : (!p.hasVideo ? `<p class="pick-note">O vídeo desta novelinha ainda não foi cadastrado.</p>` : "")}
      <div class="pick-actions">
        <a class="btn btn-gold" href="#/${canPlay ? "reel" : "novelinha"}/${esc(p.id)}">${canPlay ? `${ICO.play} Assistir` : "Ver detalhes"}</a>
        ${!p.canWatch ? `<a class="btn btn-ghost" href="#/planos">Ver planos</a>` : ""}
        <button type="button" class="btn btn-ghost" data-heart="${esc(p.id)}" aria-pressed="${saved}">${ICO.heart} Minha lista</button>
      </div>
    </div>
  </article>`;

// O sorteio é feito no servidor (GET /plays/random) e vale para TODAS as novelinhas cadastradas, sem limite de data.
function attachSurpriseEvents(){
  const go_ = qs("#surprise-go"), out = qs("#surprise-pick");
  if(!go_) return;
  const alive = () => go_.isConnected;
  const label = (t) => { go_.querySelector("span").textContent = t; };
  surprise = { lastId: null, busy: false };
  // capas do baralho: também sorteadas de todas (a vitrine inicial usa só o que já está na página)
  api("/plays/random?count=5").then(r => {
    if(!alive()) return;
    const d = qs("#deck"); if(d && r.plays && r.plays.length) d.outerHTML = deckHtml(r.plays);
    if(!r.total){ label("Ainda não há novelinhas"); go_.disabled = true; }
  }).catch(() => {});
  go_.addEventListener("click", async () => {
    if(surprise.busy) return;
    surprise.busy = true; go_.disabled = true; out.innerHTML = "";
    const d = qs("#deck"); if(d){ d.classList.remove("done"); d.classList.add("shuffling"); }
    const pause = new Promise(r => setTimeout(r, reelReduced() ? 0 : 800));          // o tempo da animação do baralho
    let pick = null, err = null;
    try{
      const url = "/plays/random?count=1" + (surprise.lastId ? "&exclude=" + encodeURIComponent(surprise.lastId) : "");
      const [r] = await Promise.all([api(url), pause]);
      pick = (r.plays || [])[0] || null;
    }catch(e){ err = e; await pause; }
    surprise.busy = false;
    if(!alive()) return;
    const d2 = qs("#deck"); if(d2) d2.classList.remove("shuffling");
    go_.disabled = false;
    if(err){ toast(err.message); label("Tentar de novo"); return; }
    if(!pick){ label("Ainda não há novelinhas"); go_.disabled = true; return; }
    surprise.lastId = pick.id;
    if(d2) d2.classList.add("done");
    out.innerHTML = pickHtml(pick); label("Sortear outra"); syncHearts();
  });
}

/* --------------------------- CONVERSÃO: pop-up de assinatura (principal + mini) --------------------------------
   Aparece 30 s depois de abrir o site para quem NÃO tem plano pago ativo (visitante ou conta gratuita), a cada acesso
   (nada é gravado no navegador). Ao fechar vira um mini fixo no canto que "pula" para chamar a atenção. Não interrompe
   quem está assistindo nem quem já está em Planos ou preenchendo login/cadastro: espera uma tela livre. */
const CONV_DELAY_MS = 30000;
let conv = { fired: false, state: "idle", plays: null, prevFocus: null };     // state: idle | main | mini | gone

// Telas onde o convite NÃO aparece: player, planos (já está assinando) e telas de acesso.
function convRouteOk(hash){ return !/^#\/(reel|planos|login|cadastro|esqueci-senha|redefinir-senha|admin)/.test(hash || "#/home"); }
// Visitante OU conta sem plano pago ativo (plano gratuito ou pago vencido).
function convEligible(){ const u = currentUser(); return !u || !hasPaidPlan(u); }
// O que o convite deve estar mostrando agora (função pura, testada).
function convDecision(st){
  if(!st.fired || st.state === "gone") return "none";
  if(!st.eligible) return "hide";
  if(!st.routeOk) return st.state === "idle" ? "wait" : "hide";               // ainda não apareceu: espera uma tela livre
  return (st.state === "idle" || st.state === "main") ? "main" : "mini";
}
const convCheapestPlan = () => (DB.plans || []).filter(p => p.price > 0).sort((a, b) => a.price - b.price)[0] || null;
const convPlays = () => (conv.plays && conv.plays.length ? conv.plays : (DB.plays || [])).filter(p => p.posterUrl);

function convMainHtml(){
  const user = currentUser(), plan = convCheapestPlan();
  const sub = user ? "Você está no plano gratuito. Escolha um plano e libere mais novelinhas, quando e onde quiser."
                   : "Crie sua conta grátis e escolha um plano para liberar mais novelinhas, quando e onde quiser.";
  return `<div class="conv-overlay" id="conv-main" role="dialog" aria-modal="true" aria-labelledby="conv-title">
    <div class="conv-card" id="conv-card">
      <button type="button" class="conv-close" data-conv-close aria-label="Fechar">${ICO.x}</button>
      <p class="conv-kicker">${esc(SITE_NAME)}</p>
      <h2 id="conv-title">Assista novelinhas sem limite</h2>

      ${deckHtml(convPlays(), "conv-deck")}

      <button type="button" class="conv-later" data-conv-close>Agora não</button>
    </div></div>`;
}
function convMiniHtml(){
  const thumbs = convPlays().slice(0, 3).map(p => `<i style="background-image:url('${esc(p.posterUrl)}')"></i>`).join("");
  return `<aside class="conv-mini" id="conv-mini" aria-label="Oferta de assinatura">
    <a class="conv-mini-body" href="#/planos" data-conv-cta>
      ${thumbs ? `<span class="conv-mini-thumbs" aria-hidden="true">${thumbs}</span>` : ""}
      <span class="conv-mini-text"><b>Assine agora</b><small>novelinhas sem limite</small></span>
    </a>
    <button type="button" class="conv-mini-x" data-conv-dismiss aria-label="Dispensar oferta">${ICO.x}</button>
  </aside>`;

function convRemove(){
  const m = document.getElementById("conv-main"), n = document.getElementById("conv-mini");
  if(m) m.remove(); if(n) n.remove();
  document.body.classList.remove("conv-open", "has-conv-mini");
  document.removeEventListener("keydown", convOnKey);
}
function convShowMini(){
  if(document.getElementById("conv-mini")) return;
  document.body.insertAdjacentHTML("beforeend", convMiniHtml());
  document.body.classList.add("has-conv-mini");
}
function convShowMain(){
  if(document.getElementById("conv-main")) return;
  conv.state = "main"; conv.prevFocus = document.activeElement;
  const mini = document.getElementById("conv-mini"); if(mini) mini.remove();
  document.body.classList.remove("has-conv-mini");
  document.body.insertAdjacentHTML("beforeend", convMainHtml());
  document.body.classList.add("conv-open");
  document.addEventListener("keydown", convOnKey);
  const cta = document.querySelector("#conv-main [data-conv-cta]"); if(cta) cta.focus();
  // as capas sorteadas entre TODAS as novelinhas chegam depois (o pop-up aparece na hora, sem esperar a rede)
  if(!conv.plays) api("/plays/random?count=5").then(r => {
    conv.plays = (r.plays || []).filter(p => p.posterUrl);
    const d = document.getElementById("conv-deck"); if(d && conv.plays.length) d.outerHTML = deckHtml(conv.plays, "conv-deck");
    const m = document.getElementById("conv-mini"); if(m){ m.remove(); convShowMini(); }
  }).catch(() => {});
}
// Fecha o principal e o transforma no mini (encolhe em direção ao canto). `animate=false`: troca na hora (ex.: foi para Planos).
function convCloseMain(animate = true){
  const main = document.getElementById("conv-main"), card = document.getElementById("conv-card");
  if(!main) return;
  const finish = () => {
    if(!document.getElementById("conv-main")) return;
    main.remove(); document.body.classList.remove("conv-open"); document.removeEventListener("keydown", convOnKey);
    conv.state = "mini";
    if(conv.prevFocus && conv.prevFocus.isConnected) try{ conv.prevFocus.focus(); }catch(e){}
    refreshConversion();
  };
  if(animate && card && !reelReduced()){ card.classList.add("closing"); setTimeout(finish, 300); } else finish();
}
function convOnKey(e){
  const main = document.getElementById("conv-main"); if(!main) return;
  if(e.key === "Escape"){ convCloseMain(); return; }
  if(e.key === "Tab"){                                                        // foco preso dentro do pop-up
    const f = [...main.querySelectorAll("button, a[href]")].filter(x => !x.disabled);
    if(!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
  }
}
document.addEventListener("click", (e) => {
  const main = document.getElementById("conv-main");
  if(main && e.target === main){ convCloseMain(); return; }                   // clique fora do cartão
  if(e.target.closest("[data-conv-close]")){ convCloseMain(); return; }
  if(e.target.closest("[data-conv-dismiss]")){ conv.state = "gone"; convRemove(); return; }
  if(e.target.closest("#conv-main [data-conv-cta]")){ convCloseMain(false); }  // o link segue para Planos; o pop-up não fica para trás
});

// Reconcilia o que está na tela com o que deveria estar. Chamada ao disparar o tempo e a cada troca de tela/login.
function refreshConversion(){
  const action = convDecision({ fired: conv.fired, state: conv.state, eligible: convEligible(), routeOk: convRouteOk(location.hash) && !reel });
  if(action === "main") convShowMain();
  else if(action === "mini") convShowMini();
  else if(action === "hide"){ if(conv.state === "main") conv.state = "mini"; convRemove(); }
  if(action !== "main") refreshInstallBanner();                               // o balão de instalar espera enquanto o pop-up principal está aberto
}
function startConversionTimer(){
  if(conv.started) return;
  conv.started = true;
  setTimeout(() => { conv.fired = true; refreshConversion(); }, CONV_DELAY_MS);   // exatamente 30 s depois de abrir o site
}

function isYoutube(url){ return /youtube\.com|youtu\.be/.test(url||""); }
function embedYoutube(url){ const m = url.match(/(?:v=|youtu\.be\/)([\w-]{6,})/); return m ? `https://www.youtube.com/embed/${m[1]}` : url; }
function isHls(url){ return /\.m3u8(\?|$)/i.test(url||""); }

// Lê a duração de um arquivo de vídeo local (em minutos), sem precisar subir nada.
function detectVideoDuration(file){
  return new Promise((resolve)=>{
    const url = URL.createObjectURL(file);
    const videoEl = document.createElement("video");
    videoEl.preload = "metadata";
    videoEl.onloadedmetadata = () => { URL.revokeObjectURL(url); resolve(Math.round(videoEl.duration / 60)); };
    videoEl.onerror = () => { URL.revokeObjectURL(url); resolve(null); };
    videoEl.src = url;
  });
}
// Transforma "minha_novelinha-EP_final.mp4" em "Minha Novelinha Ep Final".
function titleFromFilename(filename){
  const base = filename.replace(/\.[^/.]+$/, "");
  return base.replace(/[_\-]+/g, " ").replace(/\s+/g, " ").trim().replace(/\b\w/g, c => c.toUpperCase());
}
// Converte um arquivo de imagem escolhido pelo usuário em base64, pra usar direto como URL.
function fileToDataUrl(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
